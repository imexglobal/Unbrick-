ound the window.","exru":"В сильный дождь вода протекает по стене у окна."},{"ko":"전등이 나가다","en":"the light bulb goes out","ru":"перегорела лампочка","ex":"거실 전등이 나가서 갈아야 돼요.","exen":"The living room light went out, so I need to change it.","exru":"В гостиной перегорела лампочка, нужно её поменять."},{"ko":"문이 잠기다","en":"the door gets locked","ru":"дверь захлопнулась (заперлась)","ex":"열쇠가 안에 있는데 문이 잠겼어요.","exen":"The key is inside, but the door got locked.","exru":"Ключ внутри, а дверь захлопнулась."},{"ko":"가스불이 안 들어오다","en":"the gas stove won't light","ru":"газовая плита не зажигается","ex":"가스불이 안 들어와서 요리를 못 했어요.","exen":"The gas stove wouldn't light, so I couldn't cook.","exru":"Газ не зажигался, и я не смог приготовить еду."},{"ko":"냉동이 안 되다","en":"the freezer doesn't freeze","ru":"морозилка не морозит","ex":"냉동이 잘 안 돼요. 음식물이 자꾸 녹아요.","exen":"The freezer doesn't freeze well. The food keeps thawing.","exru":"Морозилка плохо морозит. Продукты всё время оттаивают."},{"ko":"와이파이 연결이 안 되다","en":"Wi-Fi won't connect","ru":"не подключается Wi-Fi","ex":"지하에 있어서 그런지 와이파이 연결이 잘 안 돼요.","exen":"Maybe because I'm underground, Wi-Fi doesn't connect well.","exru":"Наверное, из-за того что я в подвале, Wi-Fi плохо подключается."},{"ko":"액정이 깨지다","en":"the screen (LCD) cracks","ru":"разбился экран","ex":"휴대 전화를 떨어뜨려서 액정이 깨졌어요.","exen":"I dropped my phone and the screen cracked.","exru":"Я уронил телефон, и экран разбился."},{"ko":"부팅이 안 되다","en":"won't boot up","ru":"не загружается (компьютер)","ex":"노트북 부팅이 안 돼서 보고서를 못 썼어요.","exen":"My laptop wouldn't boot, so I couldn't write the report.","exru":"Ноутбук не загружался, поэтому я не написал отчёт."},{"ko":"전원이 안 켜지다","en":"the power won't turn on","ru":"не включается (питание)","ex":"어제부터 전원이 안 켜지는데 어떻게 해야 되나요?","exen":"It hasn't turned on since yesterday; what should I do?","exru":"Со вчерашнего дня не включается, что мне делать?"},{"ko":"서비스 센터에 문의하다","en":"to contact (inquire at) a service center","ru":"обратиться в сервисный центр","ex":"노트북에 문제가 있어서 서비스 문의 좀 드리려고 하는데요.","exen":"There's a problem with my laptop, so I'd like to make a service inquiry.","exru":"С ноутбуком проблема, я хотел бы обратиться в сервис."},{"ko":"서비스 센터에 방문하다","en":"to visit a service center","ru":"посетить сервисный центр","ex":"가까운 서비스 센터에 방문해 주십시오.","exen":"Please visit the nearest service center.","exru":"Пожалуйста, обратитесь в ближайший сервисный центр."},{"ko":"출장 서비스를 신청하다","en":"to request a home-visit repair service","ru":"вызвать мастера на дом","ex":"냉장고가 고장 나면 출장 서비스를 신청하세요.","exen":"If the fridge breaks, request a home-visit service.","exru":"Если сломается холодильник, вызовите мастера на дом."},{"ko":"고치다","en":"to fix, to repair","ru":"чинить, ремонтировать","ex":"고치는 데 얼마나 걸리나요?","exen":"How long does it take to fix?","exru":"Сколько времени займёт ремонт?"},{"ko":"수리하다","en":"to repair","ru":"ремонтировать","ex":"수리하는 데 얼마나 걸려요?","exen":"How long does the repair take?","exru":"Сколько длится ремонт?"},{"ko":"수리 비용을 내다","en":"to pay the repair cost","ru":"оплатить ремонт","ex":"고객의 실수로 고장이 난 경우에는 수리 비용을 내야 한다.","exen":"If it broke because of the customer's mistake, you must pay for the repair.","exru":"Если поломка произошла по вине клиента, ремонт нужно оплатить."},{"ko":"무상 수리를 받다","en":"to get a free repair","ru":"получить бесплатный ремонт","ex":"구입하신 지 1년이 안 지났으면 무상 수리가 가능합니다.","exen":"If less than a year has passed since purchase, a free repair is possible.","exru":"Если с покупки не прошёл год, возможен бесплатный ремонт."},{"ko":"딱딱하다","en":"hard (not soft)","ru":"твёрдый","ex":"딱딱한 걸 계속 씹어서 그런지 이가 아프네요.","exen":"My tooth hurts, maybe because I kept chewing hard things.","exru":"Зуб болит, наверное, потому что я всё время жевал твёрдое."},{"ko":"바닥","en":"floor, ground","ru":"пол","ex":"아까 바닥에 떨어뜨려서 그런지 전원이 안 켜져요.","exen":"It won't turn on, maybe because I dropped it on the floor earlier.","exru":"Не включается — наверное, потому что я уронил его на пол."},{"ko":"떨어뜨리다","en":"to drop","ru":"уронить","ex":"가방을 떨어뜨려서 액정이 깨졌어요.","exen":"I dropped my bag and the screen cracked.","exru":"Я уронил сумку, и экран разбился."},{"ko":"속도","en":"speed","ru":"скорость","ex":"며칠 전부터 속도가 좀 느려졌어요.","exen":"It has gotten a bit slower for a few days.","exru":"Несколько дней назад он стал работать медленнее."},{"ko":"예방 주사","en":"vaccination, preventive shot","ru":"прививка","ex":"예방 주사 맞을 때 많이 아팠나요?","exen":"Did it hurt a lot when you got the shot?","exru":"Было очень больно, когда делали прививку?"},{"ko":"냉기","en":"cold air (cooling)","ru":"холод (охлаждение)","ex":"냉기가 약합니다.","exen":"The cooling is weak.","exru":"Слабое охлаждение."},{"ko":"조절하다","en":"to adjust, to control","ru":"регулировать","ex":"온도를 조절하고 점검해야 돼요.","exen":"You need to adjust the temperature and have it checked.","exru":"Нужно отрегулировать температуру и проверить."},{"ko":"점검하다","en":"to inspect, to check","ru":"проверять, осматривать","ex":"제가 잠시 점검해 보겠습니다.","exen":"Let me check it for a moment.","exru":"Сейчас я это проверю."},{"ko":"보험에 가입하다","en":"to take out insurance","ru":"оформить страховку","ex":"구입할 때 보험에 가입했는데 비용이 얼마나 드나요?","exen":"I got insurance when I bought it; how much will it cost?","exru":"При покупке я оформил страховку — сколько это будет стоить?"},{"ko":"고객 부담금","en":"customer's deductible (co-payment)","ru":"доля оплаты клиента (франшиза)","ex":"고객 부담금을 제외하고 돌려받으실 수 있습니다.","exen":"You can get it back except for the deductible.","exru":"Вам вернут деньги, за вычетом доли клиента."},{"ko":"제외하다","en":"to exclude, to deduct","ru":"исключать, вычитать","ex":"","exen":"","exru":""},{"ko":"환급받다","en":"to get a refund (reimbursement)","ru":"получить возмещение","ex":"","exen":"","exru":""},{"ko":"갈등","en":"conflict","ru":"конфликт","ex":"고객의 무리한 요구 때문에 갈등이 자주 생겨요.","exen":"Conflicts often arise because of customers' unreasonable demands.","exru":"Из-за необоснованных требований клиентов часто возникают конфликты."},{"ko":"일시적","en":"temporary","ru":"временный","ex":"와이파이가 안 되는 것은 일시적인 문제예요.","exen":"The Wi-Fi not working is a temporary problem.","exru":"То, что не работает Wi-Fi, — временная проблема."},{"ko":"플러그","en":"plug","ru":"вилка (электрическая)","ex":"플러그를 잘 꽂았는지 확인해 보세요.","exen":"Check whether the plug is properly inserted.","exru":"Проверьте, хорошо ли вставлена вилка."},{"ko":"뽑다","en":"to pull out (a plug)","ru":"вынуть, выдернуть","ex":"플러그를 뽑았다 다시 꽂아 보세요.","exen":"Try unplugging it and plugging it back in.","exru":"Попробуйте вынуть вилку и снова вставить."},{"ko":"꽂다","en":"to insert, to plug in","ru":"вставить, воткнуть","ex":"플러그를 안쪽 끝까지 정확히 꽂아 주세요.","exen":"Insert the plug all the way in properly.","exru":"Вставьте вилку до конца."},{"ko":"밸브","en":"valve","ru":"вентиль, клапан","ex":"밸브를 열었는지 확인해 보세요.","exen":"Check whether you opened the valve.","exru":"Проверьте, открыли ли вы вентиль."},{"ko":"잠그다","en":"to lock; to turn off (a valve, tap)","ru":"запирать; перекрывать (кран)","ex":"","exen":"","exru":""},{"ko":"펌프질","en":"plunging, pumping","ru":"прочистка вантузом","ex":"혹시 펌프질은 해 봤어요?","exen":"Have you tried plunging it?","exru":"А вантузом пробовали?"},{"ko":"종료하다","en":"to close, to quit (an app)","ru":"закрыть, завершить (приложение)","ex":"앱을 종료하거나 불필요한 데이터를 삭제해 보세요.","exen":"Try closing apps or deleting unnecessary data.","exru":"Попробуйте закрыть приложения или удалить ненужные данные."},{"ko":"뚫다","en":"to unclog, to pierce through","ru":"прочистить, пробить","ex":"변기 뚫는 세제를 사용해서 뚫어 보세요.","exen":"Try unclogging it with toilet-unclogging detergent.","exru":"Попробуйте прочистить средством для унитаза."},{"ko":"이물질","en":"foreign object/substance","ru":"посторонний предмет","ex":"이물질이 들어간 경우에는 전문가의 도움이 필요하다.","exen":"If a foreign object got in, you need an expert's help.","exru":"Если попал посторонний предмет, нужна помощь специалиста."},{"ko":"온도를 낮추다","en":"to lower the temperature","ru":"понизить температуру","ex":"온도가 높지 않은가요? 온도를 낮춰 보세요.","exen":"Isn't the temperature high? Try lowering it.","exru":"Не слишком ли высокая температура? Попробуйте её понизить."},{"ko":"보증 기간","en":"warranty period","ru":"гарантийный срок","ex":"보통 스마트폰의 보증 기간은 1년이다.","exen":"The warranty period for smartphones is usually one year.","exru":"Гарантийный срок смартфона обычно один год."},{"ko":"보증서","en":"warranty certificate","ru":"гарантийный талон","ex":"전자 제품을 사면 보증서를 받는다.","exen":"When you buy electronics, you receive a warranty certificate.","exru":"При покупке электроники выдают гарантийный талон."}],"grammar":[{"g":"-어서 그런지","ko":"딱딱한 걸 계속 씹[[어서 그런지]] 이가 아프네요.","en":"My tooth hurts, maybe because I kept chewing hard things.","ru":"Зуб болит — наверное, потому что я всё время жевал твёрдое."},{"g":"-어서 그런지","ko":"더운 나라에서 와[[서 그런지]] 한국 겨울이 너무 추워요.","en":"Perhaps because I come from a hot country, Korean winters feel very cold.","ru":"Наверное, потому что я из жаркой страны, корейская зима кажется очень холодной."},{"g":"-어서 그런지","ko":"동생이 아르바이트를 시작해[[서 그런지]] 전화를 잘 안 받아요.","en":"My younger sibling rarely answers the phone, maybe because they started a part-time job.","ru":"Младший брат редко берёт трубку — наверное, потому что начал подрабатывать."},{"g":"-어서 그런지","ko":"지하에 있[[어서 그런지]] 와이파이 연결이 잘 안 돼요.","en":"Maybe because I'm underground, the Wi-Fi doesn't connect well.","ru":"Наверное, из-за того что я в подвале, Wi-Fi плохо подключается."},{"g":"-어서 그런지","ko":"머리카락이 들어가[[서 그런지]] 하수구가 막힌 것 같아요.","en":"Maybe because hair got in, the drain seems clogged.","ru":"Наверное, туда попали волосы — похоже, слив засорился."},{"g":"-어서 그런지","ko":"아침을 늦게 먹[[어서 그런지]] 아직 배가 안 고프다.","en":"Maybe because I ate breakfast late, I'm not hungry yet.","ru":"Наверное, потому что я поздно позавтракал, я ещё не голоден."},{"g":"-어서 그런지","ko":"안젤라 씨는 한국 친구가 많[[아서 그런지]] 한국어 발음이 자연스럽다.","en":"Perhaps because Angela has many Korean friends, her Korean pronunciation is natural.","ru":"Наверное, потому что у Анжелы много корейских друзей, у неё естественное произношение."},{"g":"-어서 그런지","ko":"휴대 전화를 산 지 오래돼[[서 그런지]] 배터리가 빨리 닳는다.","en":"Maybe because I bought my phone long ago, the battery drains quickly.","ru":"Наверное, потому что телефон уже старый, батарея быстро садится."},{"g":"-어서 그런지","ko":"이 집은 지하철역과 가까[[워서 그런지]] 월세가 비싼 편이다.","en":"Perhaps because this house is close to the subway station, the rent is rather high.","ru":"Наверное, потому что дом близко к метро, аренда довольно дорогая."},{"g":"-어서 그런지","ko":"비가 와[[서 그런지]] 인터넷이 자꾸 끊기네요.","en":"Maybe because it's raining, the internet keeps cutting out.","ru":"Наверное, из-за дождя интернет всё время пропадает."},{"g":"-어서 그런지","ko":"게임을 많이 해[[서 그런지]] 컴퓨터 속도가 많이 느려졌어요.","en":"Maybe because I played a lot of games, the computer got much slower.","ru":"Наверное, из-за того что я много играл, компьютер сильно замедлился."},{"g":"-나요?, -은가요?","ko":"고치는 데 얼마나 걸리[[나요]]?","en":"How long does it take to fix?","ru":"Сколько времени займёт ремонт?"},{"g":"-나요?, -은가요?","ko":"예방 주사 맞을 때 많이 아팠[[나요]]?","en":"Did it hurt a lot when you got the vaccination?","ru":"Было очень больно, когда делали прививку?"},{"g":"-나요?, -은가요?","ko":"한국어를 배우는 사람이 많[[은가요]]?","en":"Are there many people learning Korean?","ru":"Много ли людей учат корейский?"},{"g":"-나요?, -은가요?","ko":"노트북이 고장 나서 서비스 센터에 방문하려고 하는데 예약을 해야 되[[나요]]?","en":"My laptop broke and I want to visit the service center. Do I need a reservation?","ru":"У меня сломался ноутбук, хочу пойти в сервисный центр. Нужно записываться?"},{"g":"-나요?, -은가요?","ko":"한국과 고향의 물가가 비슷[[한가요]]?","en":"Are prices in Korea similar to those in your hometown?","ru":"Цены в Корее похожи на цены у вас на родине?"},{"g":"-나요?, -은가요?","ko":"집에서 회사까지 거리가 [[먼가요]]?","en":"Is it far from your home to the office?","ru":"От дома до работы далеко?"},{"g":"-나요?, -은가요?","ko":"구청에 가려면 몇 번 버스를 타[[나요]]?","en":"Which bus do I take to get to the district office?","ru":"На каком автобусе ехать до районной администрации?"},{"g":"-나요?, -은가요?","ko":"아나이스 씨는 고향이 어디[[인가요]]?","en":"Anais, where is your hometown?","ru":"Анаис, откуда вы родом?"},{"g":"-나요?, -은가요?","ko":"요즘 도서관에 사람이 많[[은가요]]?","en":"Are there many people at the library these days?","ru":"В библиотеке сейчас много людей?"},{"g":"-나요?, -은가요?","ko":"수리 비용은 얼마 정도[[인가요]]?","en":"About how much does the repair cost?","ru":"Сколько примерно стоит ремонт?"}],"content":[{"q":"게시판에 글을 쓴 사람은 어떤 문제가 있습니까?","qen":"What problem does the person who posted on the board have?","qru":"Какая проблема у человека, написавшего на форуме?","t":"변기가 일주일에 서너 번 이상 자주 막혀요.","en":"The toilet clogs often, three or four times or more a week.","ru":"Унитаз часто засоряется — три-четыре раза в неделю и больше.","k":["변기","막혀요"]},{"q":"변기에 이물질이 들어간 경우에는 어떻게 해야 합니까?","qen":"What should you do if a foreign object gets into the toilet?","qru":"Что делать, если в унитаз попал посторонний предмет?","t":"펌프질이나 세제로는 해결이 안 돼서 전문가의 도움을 받아야 해요.","en":"Plunging or detergent won't solve it, so you need an expert's help.","ru":"Вантуз или средство не помогут, нужна помощь специалиста.","k":["전문가"]},{"q":"라흐만 씨의 휴대 전화 액정은 왜 깨졌습니까?","qen":"Why did Rahman's phone screen crack?","qru":"Почему разбился экран телефона Рахмана?","t":"휴대 전화가 가방 안에 있었는데 가방을 떨어뜨려서 깨졌어요.","en":"The phone was in his bag, and he dropped the bag, so it cracked.","ru":"Телефон был в сумке, он уронил сумку, и экран разбился.","k":["가방","떨어뜨려서"]},{"q":"보험에 가입한 경우 수리 후에 무엇을 해야 합니까?","qen":"If you have insurance, what should you do after the repair?","qru":"Что нужно сделать после ремонта, если есть страховка?","t":"영수증을 보험사로 보내면 고객 부담금을 제외하고 돌려받을 수 있어요.","en":"Send the receipt to the insurer and you get the money back minus the deductible.","ru":"Нужно отправить чек в страховую, и деньги вернут за вычетом доли клиента.","k":["영수증","보험사"]},{"q":"전자 제품의 보증서에는 어떤 정보가 있습니까?","qen":"What information is on an electronics warranty certificate?","qru":"Какая информация есть в гарантийном талоне на электронику?","t":"모델명, 구입 일자, 보증 내용, 보증 기간 등이 있어요.","en":"It has the model name, purchase date, warranty details, and warranty period.","ru":"Там указаны модель, дата покупки, условия и срок гарантии.","k":["모델명","보증 기간"]},{"q":"어느 경우에 무상 수리를 받을 수 있습니까?","qen":"In what case can you get a free repair?","qru":"В каком случае можно получить бесплатный ремонт?","t":"보증 기간 내에 정상적인 상태에서 고장이 나면 무상 수리를 받을 수 있어요.","en":"If it breaks under normal use within the warranty period, you can get a free repair.","ru":"Если поломка произошла при нормальном использовании в течение гарантийного срока.","k":["보증 기간","정상적인"]},{"q":"스마트폰과 에어컨의 보증 기간은 보통 얼마입니까?","qen":"What is the usual warranty period for smartphones and air conditioners?","qru":"Какой обычно гарантийный срок у смартфонов и кондиционеров?","t":"스마트폰은 보통 1년이고 에어컨 같은 계절 제품은 2년이에요.","en":"Smartphones usually have one year, and seasonal products like air conditioners have two years.","ru":"У смартфонов обычно год, у сезонных товаров вроде кондиционеров — два года.","k":["1년","2년"]}]},{"n":10,"vocab":[{"ko":"학원 강사","en":"private academy instructor","ru":"преподаватель в частной школе (хагвоне)","ex":"","exen":"","exru":""},{"ko":"다문화 언어 강사","en":"multicultural language instructor","ru":"преподаватель языка для многокультурных семей","ex":"저는 다문화 언어 강사가 돼서 베트남 학생들을 가르치고 싶어요.","exen":"I want to become a multicultural language instructor and teach Vietnamese students.","exru":"Я хочу стать преподавателем языка для многокультурных семей и учить вьетнамских учеников."},{"ko":"편의점 아르바이트","en":"part-time job at a convenience store","ru":"подработка в круглосуточном магазине","ex":"","exen":"","exru":""},{"ko":"시간제","en":"part-time (hourly) work","ru":"почасовая (неполная) занятость","ex":"","exen":"","exru":""},{"ko":"사업하다","en":"to run a business","ru":"заниматься бизнесом","ex":"","exen":"","exru":""},{"ko":"가게를 차리다","en":"to open (set up) a shop","ru":"открыть магазин","ex":"저는 요리를 잘해서 5년 후쯤 가게를 차릴 거예요.","exen":"I'm good at cooking, so I'll open a shop in about five years.","exru":"Я хорошо готовлю, поэтому лет через пять открою своё заведение."},{"ko":"통역","en":"interpreting","ru":"устный перевод","ex":"통역이나 번역 일을 하고 싶어요.","exen":"I want to do interpreting or translation work.","exru":"Я хочу работать устным или письменным переводчиком."},{"ko":"번역","en":"translation","ru":"письменный перевод","ex":"","exen":"","exru":""},{"ko":"전문성","en":"expertise, professionalism","ru":"профессионализм, специализация","ex":"전문성 있는 일을 하고 싶어요.","exen":"I want to do work that requires expertise.","exru":"Я хочу заниматься профессиональной работой."},{"ko":"안정적이다","en":"to be stable","ru":"стабильный","ex":"안정적인 회사에 취직하고 싶어요.","exen":"I want to get a job at a stable company.","exru":"Я хочу устроиться в стабильную компанию."},{"ko":"월급","en":"monthly salary","ru":"зарплата (месячная)","ex":"월급을 많이 주는 회사에서 일하고 싶어요.","exen":"I want to work at a company that pays a high salary.","exru":"Я хочу работать в компании с высокой зарплатой."},{"ko":"근무 환경","en":"working environment","ru":"условия работы","ex":"근무 환경이 좋은 회사에서 일하고 싶어요.","exen":"I want to work at a company with a good working environment.","exru":"Я хочу работать в компании с хорошими условиями труда."},{"ko":"출퇴근이 자유롭다","en":"to have flexible commuting hours","ru":"свободный график прихода и ухода","ex":"","exen":"","exru":""},{"ko":"발전 가능성","en":"potential for growth","ru":"перспективы роста","ex":"발전 가능성이 있는 회사에 지원했어요.","exen":"I applied to a company with growth potential.","exru":"Я подал заявку в компанию с перспективами роста."},{"ko":"사회에 기여하다","en":"to contribute to society","ru":"вносить вклад в общество","ex":"","exen":"","exru":""},{"ko":"자기 계발","en":"self-development","ru":"саморазвитие","ex":"","exen":"","exru":""},{"ko":"보람을 느끼다","en":"to feel a sense of reward (fulfillment)","ru":"чувствовать удовлетворение (от работы)","ex":"일에 대한 보람을 느낄 수 있는 회사가 좋아요.","exen":"I like a company where I can feel my work is rewarding.","exru":"Мне нравится компания, где работа приносит удовлетворение."},{"ko":"구인 광고","en":"job advertisement (help-wanted ad)","ru":"объявление о вакансии","ex":"구인 광고를 보고 회사에 지원했어요.","exen":"I saw the job ad and applied to the company.","exru":"Я увидел объявление о вакансии и подал заявку."},{"ko":"이력서","en":"résumé, CV","ru":"резюме","ex":"미리 이력서를 써 놓는 것이 좋을 거예요.","exen":"It would be good to write your résumé in advance.","exru":"Лучше заранее написать резюме."},{"ko":"지원서","en":"application form","ru":"заявление (анкета) о приёме на работу","ex":"이력서나 지원서가 필요해요.","exen":"You need a résumé or an application form.","exru":"Нужно резюме или анкета."},{"ko":"서류를 제출하다","en":"to submit documents","ru":"подать документы","ex":"11일까지 서류를 제출해야 해요.","exen":"I have to submit the documents by the 11th.","exru":"Нужно подать документы до 11-го числа."},{"ko":"필기시험을 보다","en":"to take a written exam","ru":"сдавать письменный экзамен","ex":"서류 심사에 합격하면 필기시험을 보는 회사도 있어요.","exen":"Some companies give a written exam if you pass the document screening.","exru":"В некоторых компаниях после отбора по документам сдают письменный экзамен."},{"ko":"면접을 보다","en":"to have a job interview","ru":"проходить собеседование","ex":"내일 면접을 잘 보기 위해서 면접 준비를 열심히 했어요.","exen":"I prepared hard to do well in tomorrow's interview.","exru":"Чтобы хорошо пройти завтрашнее собеседование, я усердно готовился."},{"ko":"합격 통보 문자를 받다","en":"to receive a text notifying you that you passed","ru":"получить SMS о том, что приняли","ex":"면접을 잘 보면 일주일 뒤쯤 합격 통보를 받을 거예요.","exen":"If the interview goes well, you'll get an acceptance notice in about a week.","exru":"Если собеседование пройдёт хорошо, примерно через неделю придёт уведомление о приёме."},{"ko":"분야","en":"field, area (of recruitment)","ru":"область, сфера","ex":"모집 분야: 영업직","exen":"Recruitment field: sales","exru":"Набор на должность: отдел продаж"},{"ko":"인원","en":"number of people","ru":"количество человек","ex":"모집 인원: 2명","exen":"Number of openings: 2","exru":"Количество мест: 2"},{"ko":"제출","en":"submission","ru":"подача (документов)","ex":"제출 서류: 이력서, 여권 사본","exen":"Documents to submit: résumé, copy of passport","exru":"Документы для подачи: резюме, копия паспорта"},{"ko":"문의","en":"inquiry","ru":"справки, вопросы","ex":"궁금한 점은 중학교로 문의하세요.","exen":"Direct any questions to the middle school.","exru":"С вопросами обращайтесь в среднюю школу."},{"ko":"지원","en":"application (for a job)","ru":"подача заявки (на работу)","ex":"지원 방법: 온라인 접수","exen":"How to apply: online submission","exru":"Способ подачи заявки: онлайн"},{"ko":"증명서","en":"certificate (official document)","ru":"справка, свидетельство","ex":"경력 증명서를 제출해 주세요.","exen":"Please submit your certificate of employment history.","exru":"Пожалуйста, предоставьте справку о стаже работы."},{"ko":"사본","en":"copy (of a document)","ru":"копия","ex":"필요한 서류는 이력서와 자격증 사본이다.","exen":"The required documents are a résumé and a copy of your certificate.","exru":"Необходимые документы — резюме и копия сертификата."},{"ko":"자격증","en":"certificate, license (qualification)","ru":"сертификат (квалификация)","ex":"교사 자격증을 땄습니다.","exen":"I obtained a teaching certificate.","exru":"Я получил сертификат учителя."},{"ko":"자기소개서","en":"cover letter (self-introduction)","ru":"сопроводительное письмо (самопрезентация)","ex":"","exen":"","exru":""},{"ko":"경력 증명서","en":"certificate of work experience","ru":"справка о стаже работы","ex":"","exen":"","exru":""},{"ko":"졸업 증명서","en":"certificate of graduation","ru":"справка об окончании учебного заведения","ex":"","exen":"","exru":""},{"ko":"자격증을 따다","en":"to obtain a certificate","ru":"получить сертификат","ex":"컴퓨터 자격증도 미리 따 놓으세요.","exen":"Get a computer certificate in advance, too.","exru":"Заранее получите и компьютерный сертификат."},{"ko":"취직하다","en":"to get a job","ru":"устроиться на работу","ex":"저는 무역 회사에 취직하고 싶어요.","exen":"I want to get a job at a trading company.","exru":"Я хочу устроиться в торговую компанию."},{"ko":"국적을 취득하다","en":"to acquire citizenship","ru":"получить гражданство","ex":"한국 국적을 취득하기 위해 한국어 공부를 하고 있다.","exen":"I'm studying Korean to acquire Korean citizenship.","exru":"Я учу корейский, чтобы получить корейское гражданство."},{"ko":"급여","en":"pay, wages","ru":"заработная плата","ex":"한국의 직장인은 보통 한 달에 한 번씩 급여를 받는다.","exen":"Korean office workers are usually paid once a month.","exru":"Корейские служащие обычно получают зарплату раз в месяц."},{"ko":"기본급","en":"base pay","ru":"базовый оклад","ex":"","exen":"","exru":""},{"ko":"수당","en":"allowance, bonus pay","ru":"надбавка, пособие","ex":"","exen":"","exru":""},{"ko":"공제하다","en":"to deduct","ru":"вычитать, удерживать","ex":"","exen":"","exru":""}],"grammar":[{"g":"-기 위해서","ko":"쓰레기를 줄이[[기 위해]] 어떤 노력을 해야 합니까?","en":"What efforts should we make to reduce garbage?","ru":"Какие усилия нужно приложить, чтобы сократить количество мусора?"},{"g":"-기 위해서","ko":"한국 국적을 취득하[[기 위해]] 1년 전부터 한국어 공부를 하고 있다.","en":"I've been studying Korean for a year in order to get Korean citizenship.","ru":"Чтобы получить корейское гражданство, я уже год учу корейский."},{"g":"-기 위해서","ko":"한국 회사에 취직하[[기 위해서]] 뭘 준비하고 있어요?","en":"What are you preparing in order to get a job at a Korean company?","ru":"Что вы делаете, чтобы устроиться в корейскую компанию?"},{"g":"-기 위해서","ko":"토픽 시험에 합격하[[기 위해]] 열심히 공부하고 있어요.","en":"I'm studying hard to pass the TOPIK exam.","ru":"Я усердно учусь, чтобы сдать экзамен TOPIK."},{"g":"-기 위해서","ko":"지난 주말에 친구를 만나[[기 위해서]] 명동에 갔어요.","en":"Last weekend I went to Myeongdong to meet a friend.","ru":"В прошлые выходные я ездил в Мёндон, чтобы встретиться с другом."},{"g":"-기 위해서","ko":"제이슨 씨가 고향에 돈을 보내[[기 위해서]] 은행에 가요.","en":"Jason is going to the bank to send money home.","ru":"Джейсон идёт в банк, чтобы отправить деньги на родину."},{"g":"-기 위해서","ko":"우리 주민 센터에서는 연말에 불우 이웃을 돕[[기 위해서]] 돈을 모으고 있어요.","en":"Our community center is raising money at year-end to help neighbors in need.","ru":"В конце года наш районный центр собирает деньги, чтобы помочь нуждающимся соседям."},{"g":"-기 위해서","ko":"나중에 가게를 차리[[기 위해서]] 열심히 돈을 모으고 있어요.","en":"I'm saving money diligently to open a shop later.","ru":"Я усердно коплю деньги, чтобы потом открыть магазин."},{"g":"-기 위해서","ko":"회사에 늦지 않[[기 위해서]] 아침에 일찍 일어났어요.","en":"I got up early so as not to be late for work.","ru":"Я рано встал, чтобы не опоздать на работу."},{"g":"-기 위해서","ko":"건강해지[[기 위해서]] 요즘 아침마다 운동해요.","en":"These days I exercise every morning to get healthier.","ru":"Сейчас я каждое утро занимаюсь спортом, чтобы стать здоровее."},{"g":"-어 놓다","ko":"미리 이력서를 써 [[놓는]] 것이 좋을 거예요.","en":"It would be good to write your résumé in advance.","ru":"Лучше заранее написать резюме."},{"g":"-어 놓다","ko":"아침 일찍 샌드위치를 만들[[어 놓았다]].","en":"I made sandwiches early in the morning (and had them ready).","ru":"Рано утром я приготовил бутерброды (заранее)."},{"g":"-어 놓다","ko":"숙제를 미리 해 [[놓아서]] 마음이 편하다.","en":"I feel at ease because I did my homework in advance.","ru":"Мне спокойно, потому что я заранее сделал домашнее задание."},{"g":"-어 놓다","ko":"걱정 말아요. 미리 예약해 [[놓았어요]].","en":"Don't worry. I made a reservation in advance.","ru":"Не волнуйтесь. Я заранее забронировал."},{"g":"-어 놓다","ko":"네, 선물을 준비해 [[놓았어요]].","en":"Yes, I've prepared the present.","ru":"Да, подарок я уже приготовил."},{"g":"-어 놓다","ko":"손님이 오시는데 미리 에어컨을 켜 [[놓으세요]].","en":"Guests are coming, so turn on the air conditioner in advance.","ru":"Придут гости, включите кондиционер заранее."},{"g":"-어 놓다","ko":"다음 주에 고향에 가서 지난달에 미리 비행기표를 사 [[놓았어요]].","en":"I'm going home next week, so I bought the plane ticket last month in advance.","ru":"На следующей неделе я еду на родину, поэтому заранее купил билет ещё в прошлом месяце."},{"g":"-어 놓다","ko":"지금 청소하기 위해서 창문을 열[[어 놓았어요]].","en":"I've opened the windows (and left them open) to clean now.","ru":"Я открыл окна, чтобы сейчас убраться."},{"g":"-어 놓다","ko":"우산은 저기 교실 뒤에 세워 [[놓으세요]].","en":"Stand the umbrella at the back of the classroom over there.","ru":"Поставьте зонт вон там, в конце класса."},{"g":"-어 놓다","ko":"고천 씨가 벽에 가족 사진을 걸[[어 놓았다]].","en":"Gocheon hung a family photo on the wall.","ru":"Гочхон повесила на стену семейную фотографию."},{"g":"-어 놓다","ko":"무역 회사에 취직하려면 컴퓨터 자격증도 미리 따 [[놓으세요]].","en":"If you want a job at a trading company, get a computer certificate in advance too.","ru":"Если хотите работать в торговой компании, заранее получите и компьютерный сертификат."}],"content":[{"q":"애나 씨는 왜 이 학교에 지원했습니까?","qen":"Why did Anna apply to this school?","qru":"Почему Анна подала заявку в эту школу?","t":"고향에서 초등학교 선생님으로 5년 동안 일해서 한국에서도 아이들을 가르치고 싶었어요.","en":"She worked as an elementary school teacher for five years at home, so she wanted to teach children in Korea too.","ru":"Она пять лет работала учительницей начальных классов на родине и хотела учить детей и в Корее.","k":["선생님","가르치고"]},{"q":"애나 씨는 어떤 선생님이 되고 싶어 합니까?","qen":"What kind of teacher does Anna want to be?","qru":"Каким учителем хочет быть Анна?","t":"애나 씨는 친구 같은 선생님이 되고 싶어 해요.","en":"Anna wants to be a teacher who is like a friend.","ru":"Анна хочет быть учителем, похожим на друга.","k":["친구 같은"]},{"q":"애나 씨는 이 학교 취업을 위해 무엇을 준비했습니까?","qen":"What did Anna prepare for this job?","qru":"Что Анна сделала, чтобы подготовиться к этой работе?","t":"2년 전에 캐나다에서 영어 교사 자격증을 땄고 게임을 이용한 영어 지도에 관한 책을 많이 봤어요.","en":"She got an English teaching certificate in Canada two years ago and read many books on teaching English with games.","ru":"Два года назад она получила в Канаде сертификат учителя английского и прочитала много книг об обучении английскому с помощью игр.","k":["자격증","영어"]},{"q":"면접 결과는 언제, 어디에서 확인할 수 있습니까?","qen":"When and where can the interview result be checked?","qru":"Когда и где можно узнать результаты собеседования?","t":"1주일 후에 홈페이지에서 확인할 수 있어요.","en":"It can be checked on the website a week later.","ru":"Через неделю на сайте.","k":["1주일","홈페이지"]},{"q":"방과 후 영어 교사 광고에 지원하려면 어떤 자격이 필요합니까?","qen":"What qualification is needed to apply for the after-school English teacher ad?","qru":"Какая квалификация нужна для вакансии учителя английского на продлёнке?","t":"대학교를 졸업하고 영어를 전공해야 해요.","en":"You must be a university graduate who majored in English.","ru":"Нужно высшее образование по специальности «английский язык».","k":["대졸","영어 전공"]},{"q":"한국의 직장인이 받는 급여는 어떻게 구성됩니까?","qen":"What does a Korean employee's pay consist of?","qru":"Из чего состоит зарплата корейского служащего?","t":"급여는 크게 기본급과 수당으로 구성돼요.","en":"Pay mainly consists of base pay and allowances.","ru":"Зарплата в основном состоит из базового оклада и надбавок.","k":["기본급","수당"]},{"q":"계좌에 입금되는 돈이 실제 월급과 다른 이유는 무엇입니까?","qen":"Why is the amount deposited different from the actual salary?","qru":"Почему сумма, поступающая на счёт, отличается от фактической зарплаты?","t":"세금, 건강 보험료, 정기 적금 등을 급여에서 공제하기 때문이에요.","en":"Because taxes, health insurance premiums, and savings installments are deducted from the pay.","ru":"Потому что из зарплаты вычитают налоги, взносы на медицинское страхование, накопительные вклады и т. п.","k":["세금","공제"]}]},{"n":11,"vocab":[{"ko":"주택","en":"house (detached)","ru":"частный дом","ex":"","exen":"","exru":""},{"ko":"아파트","en":"apartment","ru":"квартира (в многоквартирном доме)","ex":"가장 많이 볼 수 있는 집은 아파트다.","exen":"The most common type of home is the apartment.","exru":"Самый распространённый тип жилья — квартира в многоэтажке."},{"ko":"오피스텔","en":"officetel (studio for living and working)","ru":"офистель (квартира-студия для жилья и работы)","ex":"","exen":"","exru":""},{"ko":"빌라","en":"villa (low-rise multi-family housing)","ru":"малоэтажный многоквартирный дом («вилла»)","ex":"방 두 개인 월세 빌라를 찾고 있어요.","exen":"I'm looking for a two-room villa with monthly rent.","exru":"Я ищу двухкомнатную квартиру в малоэтажке с помесячной арендой."},{"ko":"원룸","en":"studio (one-room) apartment","ru":"однокомнатная квартира-студия","ex":"","exen":"","exru":""},{"ko":"기숙사","en":"dormitory","ru":"общежитие","ex":"","exen":"","exru":""},{"ko":"매매","en":"buying and selling (purchase)","ru":"купля-продажа","ex":"집을 사려고 매매 가격을 알아보고 있는데 너무 비싸요.","exen":"I'm checking sale prices to buy a house, but they're too expensive.","exru":"Я смотрю цены на покупку жилья, но они слишком высокие."},{"ko":"임대","en":"lease, rental","ru":"аренда, наём","ex":"나라에서 빌려주는 임대 아파트는 월세가 저렴하다.","exen":"Government rental apartments have cheap monthly rent.","exru":"В государственных арендных квартирах низкая плата."},{"ko":"전세","en":"jeonse (lump-sum deposit lease)","ru":"чонсе (аренда за крупный залог без помесячной платы)","ex":"전세로 살고 싶지만 보증금이 너무 비싸요.","exen":"I'd like to live on jeonse, but the deposit is too expensive.","exru":"Хочу жить на условиях чонсе, но залог слишком большой."},{"ko":"월세","en":"monthly rent","ru":"помесячная аренда","ex":"깨끗한 데다가 월세도 싸요.","exen":"It's clean and the monthly rent is cheap too.","exru":"Чисто, да и аренда недорогая."},{"ko":"교통이 편리하다","en":"to have convenient transportation","ru":"удобный транспорт","ex":"교통도 편리한 데다가 주변에 편의 시설도 많아요.","exen":"Transportation is convenient, and there are many amenities nearby.","exru":"Транспорт удобный, да и поблизости много удобств."},{"ko":"편의 시설","en":"amenities, convenience facilities","ru":"инфраструктура, удобства (магазины и т. п.)","ex":"편의 시설이 많아서 생활도 편리하다.","exen":"There are many amenities, so life is convenient.","exru":"Много объектов инфраструктуры, поэтому жить удобно."},{"ko":"산책로","en":"walking trail","ru":"прогулочная дорожка","ex":"","exen":"","exru":""},{"ko":"전망","en":"view","ru":"вид (из окна)","ex":"서울 남산타워에 올라가면 전망이 좋다.","exen":"If you go up Namsan Tower in Seoul, the view is great.","exru":"С башни Намсан в Сеуле открывается прекрасный вид."},{"ko":"햇빛","en":"sunlight","ru":"солнечный свет","ex":"집은 햇빛이 잘 들어오고 전망이 좋았다.","exen":"The house got lots of sunlight and had a good view.","exru":"В доме было много солнца и хороший вид."},{"ko":"내부","en":"interior, inside","ru":"интерьер, внутренняя часть","ex":"","exen":"","exru":""},{"ko":"환경","en":"environment","ru":"окружение, обстановка","ex":"학교가 가까워서 교육 환경이 좋아요.","exen":"The school is close, so the educational environment is good.","exru":"Школа рядом, поэтому хорошая образовательная среда."},{"ko":"옵션","en":"built-in furnishings/appliances (option)","ru":"встроенная мебель и техника","ex":"지난번 집에는 가구, 세탁기 등의 옵션이 없어서 불편했다.","exen":"My last place had no furniture or washing machine included, so it was inconvenient.","exru":"В прошлой квартире не было мебели и стиральной машины, и это было неудобно."},{"ko":"형태","en":"form, type","ru":"форма, тип","ex":"한국은 다양한 형태의 집이 있다.","exen":"Korea has various types of housing.","exru":"В Корее есть разные типы жилья."},{"ko":"선호하다","en":"to prefer","ru":"предпочитать","ex":"사람들은 시설이 좋고 교통이 편리한 집을 선호한다.","exen":"People prefer houses with good facilities and convenient transportation.","exru":"Люди предпочитают жильё с хорошими условиями и удобным транспортом."},{"ko":"테라스","en":"terrace","ru":"терраса","ex":"주차장과 테라스가 있다.","exen":"There's a parking lot and a terrace.","exru":"Есть парковка и терраса."},{"ko":"남향","en":"south-facing","ru":"окна на юг","ex":"이 집은 남향인 데다가 전망도 좋다.","exen":"This house faces south, and the view is good too.","exru":"Этот дом выходит на юг, да и вид хороший."},{"ko":"층간 소음","en":"noise between floors","ru":"шум от соседей сверху/снизу","ex":"","exen":"","exru":""},{"ko":"도보","en":"on foot, walking","ru":"пешком","ex":"","exen":"","exru":""},{"ko":"등기부 등본","en":"certified copy of the property register","ru":"выписка из реестра недвижимости","ex":"특히 등기부 등본을 꼭 확인해야 한다.","exen":"In particular, you must check the property register.","exru":"Особенно обязательно проверьте выписку из реестра недвижимости."},{"ko":"부동산 중개소","en":"real estate agency","ru":"агентство недвижимости","ex":"집을 구하려고 부동산 중개소에 갔다.","exen":"I went to a real estate agency to find a house.","exru":"Я пошёл в агентство недвижимости, чтобы найти жильё."},{"ko":"부동산 중개인","en":"real estate agent","ru":"риелтор","ex":"부동산 중개인과 함께 집을 구경했다.","exen":"I looked around the house with the real estate agent.","exru":"Я осмотрел квартиру вместе с риелтором."},{"ko":"신축","en":"newly built (building)","ru":"новостройка","ex":"신축은 깨끗하고 보통 시설이 좋아서 비쌉니다.","exen":"New buildings are clean and usually well-equipped, so they're expensive.","exru":"Новостройки чистые и обычно хорошо оборудованы, поэтому дорогие."},{"ko":"역세권","en":"area near a subway station","ru":"район рядом со станцией метро","ex":"","exen":"","exru":""},{"ko":"잔금","en":"balance (remaining payment)","ru":"остаток суммы (окончательный расчёт)","ex":"이사하는 날 잔금을 내면 됩니다.","exen":"You pay the balance on moving day.","exru":"Остаток суммы платят в день переезда."},{"ko":"전입 신고","en":"move-in registration (change of address report)","ru":"регистрация по новому месту жительства","ex":"주민 센터에 꼭 방문하여 전입 신고를 해야 한다.","exen":"You must visit the community center and register your move-in.","exru":"Обязательно нужно прийти в районный центр и зарегистрироваться по новому адресу."},{"ko":"특약 사항","en":"special terms (in a contract)","ru":"особые условия (договора)","ex":"집수리 등 특약 사항을 자세하게 쓴다.","exen":"Write special terms such as house repairs in detail.","exru":"Особые условия, например ремонт, записывают подробно."},{"ko":"풀 옵션","en":"fully furnished (all appliances included)","ru":"полностью меблированная (со всей техникой)","ex":"","exen":"","exru":""},{"ko":"보증금","en":"deposit","ru":"залог, депозит","ex":"","exen":"","exru":""},{"ko":"확정 일자","en":"fixed-date stamp (on a lease contract)","ru":"отметка о дате регистрации договора аренды","ex":"전입 신고를 하고 확정 일자를 받아야 한다.","exen":"You must register your move-in and get a fixed-date stamp.","exru":"Нужно зарегистрироваться и получить отметку о дате договора."},{"ko":"공유 주택","en":"shared house","ru":"совместное жильё (шеринг-хаус)","ex":"","exen":"","exru":""},{"ko":"셰어 하우스","en":"share house","ru":"шеринг-хаус","ex":"","exen":"","exru":""}],"grammar":[{"g":"-는 데다가","ko":"교통도 편리[[한 데다가]] 주변에 편의 시설도 많아요.","en":"Transportation is convenient, and on top of that there are many amenities nearby.","ru":"Транспорт удобный, да к тому же рядом много удобств."},{"g":"-는 데다가","ko":"요즘 밥을 많이 먹[[는 데다가]] 운동을 안 하니까 자꾸 살이 쪄요.","en":"These days I eat a lot and don't exercise either, so I keep gaining weight.","ru":"Сейчас я много ем, да ещё и не занимаюсь спортом, поэтому всё время полнею."},{"g":"-는 데다가","ko":"아파트는 사람이 많이 살 수 있[[는 데다가]] 편리하고 안전하다고 생각해요.","en":"I think apartments can house many people, and besides, they're convenient and safe.","ru":"Я думаю, в многоэтажках может жить много людей, к тому же они удобны и безопасны."},{"g":"-는 데다가","ko":"네, 깨끗[[한 데다가]] 월세도 싸요.","en":"Yes, it's clean and on top of that the rent is cheap.","ru":"Да, чисто, да и аренда недорогая."},{"g":"-는 데다가","ko":"방이 좁[[은 데다가]] 어두워서 별로 마음에 안 들어요.","en":"The room is small and dark too, so I don't really like it.","ru":"Комната тесная, да ещё и тёмная, так что она мне не очень нравится."},{"g":"-는 데다가","ko":"남향[[인 데다가]] 새로 수리해서 깨끗해요.","en":"It faces south and, besides, it was newly renovated, so it's clean.","ru":"Окна на юг, к тому же недавно сделан ремонт, так что чисто."},{"g":"-는 데다가","ko":"이 집은 버스 정류장에서 가까[[운 데다가]] 근처에 시장이 있어서 살기 편해요.","en":"This house is close to the bus stop and also has a market nearby, so it's convenient.","ru":"Этот дом близко к остановке, да и рынок рядом, поэтому жить удобно."},{"g":"-는 데다가","ko":"지금 살고 있는 집이 학교에서 [[먼 데다가]] 방도 좁아서 곧 이사할 거예요.","en":"My current place is far from school and the room is small, so I'll move soon.","ru":"Нынешняя квартира далеко от школы, да и комната тесная, поэтому скоро перееду."},{"g":"-는 데다가","ko":"한국의 여름 날씨는 더[[운 데다가]] 비가 많이 내려요.","en":"Korean summer weather is hot, and on top of that it rains a lot.","ru":"Летом в Корее жарко, да ещё и много дождей."},{"g":"-는 데다가","ko":"어제 잠을 못 [[잔 데다가]] 요즘 일이 많아서 피곤해요.","en":"I couldn't sleep last night and I've had a lot of work lately, so I'm tired.","ru":"Я вчера не выспался, да ещё и работы сейчас много, поэтому устал."},{"g":"-는 데다가","ko":"아침에 늦게 일어[[난 데다가]] 버스를 놓쳤어요.","en":"I woke up late in the morning and missed the bus as well.","ru":"Утром я поздно встал, да ещё и на автобус опоздал."},{"g":"-는다","ko":"사람들은 시설이 좋고 교통이 편리한 집을 선호[[한다]].","en":"People prefer houses with good facilities and convenient transportation.","ru":"Люди предпочитают жильё с хорошими условиями и удобным транспортом."},{"g":"-는다","ko":"나는 방이 너무 좁아서 이사하려고 [[한다]].","en":"My room is too small, so I'm going to move.","ru":"Моя комната слишком тесная, поэтому я собираюсь переехать."},{"g":"-는다","ko":"나는 한국에서 고향 친구와 함께 아파트에서 [[산다]].","en":"In Korea I live in an apartment with a friend from home.","ru":"В Корее я живу в квартире вместе с другом с родины."},{"g":"-는다","ko":"그런데 집이 회사와 아주 [[멀다]].","en":"But the house is very far from work.","ru":"Но дом очень далеко от работы."},{"g":"-는다","ko":"이 집이 아주 마음에 [[든다]].","en":"I really like this house.","ru":"Этот дом мне очень нравится."},{"g":"-는다","ko":"대중교통을 이용하기 편리하고 집 근처에 편의 시설이 [[있다]].","en":"Public transport is convenient and there are amenities near the house.","ru":"Общественным транспортом пользоваться удобно, а рядом с домом есть инфраструктура."},{"g":"-는다","ko":"집 볼 때 햇빛이 잘 들어오는지 확인[[한다]].","en":"When viewing a house, you check whether it gets good sunlight.","ru":"Осматривая жильё, проверяют, много ли там солнца."},{"g":"-는다","ko":"이번에 이사한 집은 지하철역과 버스 정류장이 [[가깝다]].","en":"The house I just moved into is close to the subway station and bus stop.","ru":"Дом, в который я переехал, находится близко к метро и автобусной остановке."}],"content":[{"q":"집을 보러 다닐 때 집 안에서 무엇을 확인해야 합니까?","qen":"When viewing a house, what should you check inside?","qru":"Что нужно проверить внутри, когда смотришь жильё?","t":"해가 잘 들어오는지, 소음이 없는지, 물과 전기와 난방이 잘 나오는지 확인해야 해요.","en":"Check whether it gets sun, whether it's quiet, and whether water, electricity, and heating work well.","ru":"Нужно проверить, много ли солнца, нет ли шума, нормально ли работают вода, электричество и отопление.","k":["햇빛","난방"]},{"q":"집을 계약할 때 누구와 직접 계약하는 것이 안전합니까?","qen":"When signing a lease, with whom is it safe to sign directly?","qru":"С кем безопаснее напрямую заключать договор?","t":"집주인과 직접 계약하는 것이 안전해요.","en":"It's safe to sign directly with the landlord.","ru":"Безопаснее заключать договор напрямую с хозяином.","k":["집주인"]},{"q":"왜 등기부 등본을 꼭 확인해야 합니까?","qen":"Why must you check the property register?","qru":"Почему обязательно нужно проверить выписку из реестра недвижимости?","t":"집주인인 척하면서 다른 사람의 집을 팔거나 세를 준 후에 도망가는 경우가 있기 때문이에요.","en":"Because some people pretend to be the owner, sell or rent out someone else's house, and run away.","ru":"Потому что бывает, что человек выдаёт себя за хозяина, продаёт или сдаёт чужой дом и скрывается.","k":["집주인","등기부 등본"]},{"q":"전세나 월세로 이사한 후에 주민 센터에서 무엇을 해야 합니까?","qen":"After moving in on jeonse or monthly rent, what must you do at the community center?","qru":"Что нужно сделать в районном центре после переезда на условиях чонсе или помесячной аренды?","t":"전입 신고를 하고 확정 일자를 받아야 해요.","en":"You must register your move-in and get a fixed-date stamp.","ru":"Нужно зарегистрироваться по новому адресу и получить отметку о дате договора.","k":["전입 신고","확정 일자"]},{"q":"후엔 씨는 어떤 집을 찾고 있습니까?","qen":"What kind of house is Huyen looking for?","qru":"Какое жильё ищет Хуен?","t":"학원가 근처에 있는 방 두 개짜리 전세 아파트를 찾고 있어요.","en":"She's looking for a two-room jeonse apartment near the academy district.","ru":"Она ищет двухкомнатную квартиру на условиях чонсе рядом с районом частных школ.","k":["전세","아파트"]},{"q":"부동산 중개인이 소개한 두 집은 어떻게 다릅니까?","qen":"How do the two houses the agent introduced differ?","qru":"Чем отличаются два варианта, которые предложил риелтор?","t":"한 곳은 교통이 편리하고 편의 시설이 많고, 다른 곳은 남향이어서 햇빛이 잘 들고 전망이 좋아요.","en":"One has convenient transport and many amenities; the other faces south, so it gets good sun and has a nice view.","ru":"В одном удобный транспорт и много инфраструктуры, другой выходит на юг — там много солнца и хороший вид.","k":["교통","남향"]},{"q":"공유 주택은 무엇입니까?","qen":"What is a shared house?","qru":"Что такое совместное жильё (шеринг-хаус)?","t":"2인 이상의 사람들과 집을 공유하는 임대 주택이에요.","en":"It's rental housing where two or more people share a home.","ru":"Это арендное жильё, которое делят два и более человек.","k":["공유","임대 주택"]},{"q":"공유 주택이 사회 초년생들에게 인기가 있는 이유는 무엇입니까?","qen":"Why are shared houses popular with young people starting out in society?","qru":"Почему шеринг-хаусы популярны среди молодых людей, только начинающих самостоятельную жизнь?","t":"월세가 주변 집세보다 싸고 계약 기간이 최소 1개월이어서 인기가 있어요.","en":"Because the rent is cheaper than nearby rents and the minimum contract is just one month.","ru":"Потому что аренда дешевле, чем по соседству, а минимальный срок договора — всего месяц.","k":["월세","1개월"]}]},{"n":12,"vocab":[{"ko":"설날","en":"Seollal (Lunar New Year)","ru":"Соллаль (Новый год по лунному календарю)","ex":"설날에는 세배를 하고 새해 인사를 한다.","exen":"On Seollal, people bow deeply and exchange New Year greetings.","exru":"На Соллаль делают новогодний поклон и поздравляют с Новым годом."},{"ko":"정월 대보름","en":"Jeongwol Daeboreum (first full moon of the lunar year)","ru":"Чонволь Тэборым (первое полнолуние года)","ex":"","exen":"","exru":""},{"ko":"추석","en":"Chuseok (Korean harvest festival)","ru":"Чусок (праздник урожая)","ex":"추석에는 조상에게 차례를 지낸다.","exen":"On Chuseok, people hold ancestral rites.","exru":"На Чусок совершают обряд поминовения предков."},{"ko":"동지","en":"Dongji (winter solstice)","ru":"Тонджи (зимнее солнцестояние)","ex":"동지는 일 년 중 가장 밤이 길다.","exen":"Dongji has the longest night of the year.","exru":"В Тонджи самая длинная ночь в году."},{"ko":"음력","en":"lunar calendar","ru":"лунный календарь","ex":"설날은 음력 1월 1일이다.","exen":"Seollal is the 1st day of the 1st lunar month.","exru":"Соллаль — 1-е число 1-го месяца по лунному календарю."},{"ko":"부럼","en":"bureom (nuts cracked on Daeboreum)","ru":"пурым (орехи, которые грызут на Тэборым)","ex":"부럼을 먹으면 일 년 동안 피부병에 걸리지 않는다.","exen":"If you eat bureom, you won't get skin diseases for a year.","exru":"Если есть орехи пурым, весь год не будет кожных болезней."},{"ko":"팥죽","en":"red bean porridge","ru":"каша из красной фасоли","ex":"팥죽의 붉은색이 나쁜 기운을 쫓는다.","exen":"The red color of red bean porridge drives away bad energy.","exru":"Красный цвет фасолевой каши отгоняет злые силы."},{"ko":"송편","en":"songpyeon (half-moon rice cakes)","ru":"сонпхён (рисовые пирожки в форме полумесяца)","ex":"추석에는 송편을 빚어서 먹는다.","exen":"On Chuseok, people make and eat songpyeon.","exru":"На Чусок лепят и едят сонпхён."},{"ko":"떡국","en":"tteokguk (rice cake soup)","ru":"ттоккук (суп с рисовыми клёцками)","ex":"설날에 떡국을 먹으면 나이도 한 살 더 먹는다고 생각한다.","exen":"People believe eating tteokguk on Seollal makes you a year older.","exru":"Считается, что, поев ттоккук на Соллаль, становишься на год старше."},{"ko":"기원하다","en":"to pray for, to wish for","ru":"молиться о чём-то, желать","ex":"건강하게 오래 살기를 기원한다.","exen":"People wish to live long and healthy lives.","exru":"Желают долгой и здоровой жизни."},{"ko":"피부병","en":"skin disease","ru":"кожная болезнь","ex":"일 년 동안 피부병이 생기지 않는다.","exen":"You won't get skin diseases for a year.","exru":"Целый год не будет кожных болезней."},{"ko":"생기다","en":"to occur, to arise","ru":"появляться, возникать","ex":"","exen":"","exru":""},{"ko":"붉은색","en":"red color","ru":"красный цвет","ex":"붉은색이 나쁜 것을 쫓는다.","exen":"The color red drives away bad things.","exru":"Красный цвет отгоняет зло."},{"ko":"쫓다","en":"to chase away, to drive out","ru":"прогонять, отгонять","ex":"","exen":"","exru":""},{"ko":"윷놀이를 하다","en":"to play yunnori (a traditional board game)","ru":"играть в юннори (традиционная игра с палочками)","ex":"가족과 친척들이 모여 윷놀이를 한다.","exen":"Family and relatives gather and play yunnori.","exru":"Семья и родственники собираются и играют в юннори."},{"ko":"연날리기","en":"kite flying","ru":"запуск воздушного змея","ex":"떡국을 먹고 근처 공원에 가서 연날리기를 했어요.","exen":"We ate tteokguk, then went to a nearby park and flew kites.","exru":"Мы поели ттоккук, пошли в ближайший парк и запускали воздушного змея."},{"ko":"제기차기","en":"jegichagi (shuttlecock kicking game)","ru":"чегичхаги (игра с подбрасыванием волана ногой)","ex":"","exen":"","exru":""},{"ko":"놀이를 즐기다","en":"to enjoy games","ru":"развлекаться играми","ex":"아이들은 연날리기, 제기차기 놀이를 즐겼다.","exen":"Children enjoyed kite flying and jegichagi.","exru":"Дети развлекались запуском змея и чегичхаги."},{"ko":"보름달","en":"full moon","ru":"полная луна","ex":"보름달을 보며 소원을 빈다.","exen":"People look at the full moon and make wishes.","exru":"Смотрят на полную луну и загадывают желания."},{"ko":"소원을 빌다","en":"to make a wish","ru":"загадывать желание","ex":"추석 때 보통 보름달을 보면서 소원을 빌어요.","exen":"On Chuseok people usually make wishes looking at the full moon.","exru":"На Чусок обычно загадывают желание, глядя на полную луну."},{"ko":"빌다","en":"to wish, to pray","ru":"молить, желать","ex":"가정에 행복이 가득하시길 빕니다.","exen":"I wish your home to be full of happiness.","exru":"Желаю, чтобы в вашем доме было много счастья."},{"ko":"햇곡식","en":"newly harvested grain","ru":"зерно нового урожая","ex":"","exen":"","exru":""},{"ko":"햇과일","en":"newly harvested fruit","ru":"фрукты нового урожая","ex":"","exen":"","exru":""},{"ko":"차례를 지내다","en":"to hold an ancestral memorial rite","ru":"совершать обряд поминовения предков","ex":"추석에는 햇곡식과 햇과일로 차례를 지내요.","exen":"On Chuseok, rites are held with newly harvested grain and fruit.","exru":"На Чусок совершают обряд поминовения с зерном и фруктами нового урожая."},{"ko":"풍습","en":"custom, tradition","ru":"обычай","ex":"동지에는 팥죽을 먹는 풍습이 있어요.","exen":"There's a custom of eating red bean porridge on Dongji.","exru":"На Тонджи есть обычай есть фасолевую кашу."},{"ko":"한가위","en":"Hangawi (another name for Chuseok)","ru":"Хангави (другое название Чусока)","ex":"추석은 한가위라고도 한다.","exen":"Chuseok is also called Hangawi.","exru":"Чусок также называют Хангави."},{"ko":"황금연휴","en":"golden (long) holiday weekend","ru":"«золотые» длинные выходные","ex":"","exen":"","exru":""},{"ko":"귀성 전쟁","en":"the holiday travel rush (homecoming war)","ru":"праздничная транспортная давка («война» за поездку домой)","ex":"","exen":"","exru":""},{"ko":"귀성객","en":"people traveling to their hometowns for the holiday","ru":"едущие на праздник в родные места","ex":"서울역은 귀성객들로 붐빕니다.","exen":"Seoul Station is crowded with holiday travelers.","exru":"Сеульский вокзал полон людей, едущих домой на праздник."},{"ko":"고속 도로","en":"expressway, highway","ru":"скоростная автомагистраль","ex":"","exen":"","exru":""},{"ko":"붐비다","en":"to be crowded","ru":"быть переполненным, кишеть людьми","ex":"기차역과 버스 터미널도 붐벼요.","exen":"Train stations and bus terminals are crowded too.","exru":"Вокзалы и автовокзалы тоже переполнены."},{"ko":"근하신년","en":"Happy New Year (formal greeting)","ru":"С Новым годом! (официальное поздравление)","ex":"","exen":"","exru":""},{"ko":"가득하다","en":"to be full","ru":"полный, наполненный","ex":"","exen":"","exru":""},{"ko":"친지들","en":"relatives and close acquaintances","ru":"родные и близкие","ex":"가족, 친지들과 함께 감사와 행복이 넘치는 추석 연휴 보내시길 바랍니다.","exen":"I hope you spend a Chuseok holiday full of gratitude and happiness with family and relatives.","exru":"Желаю провести праздник Чусок с семьёй и близкими, полный благодарности и счастья."},{"ko":"넉넉하다","en":"to be ample, generous","ru":"щедрый, обильный","ex":"보름달처럼 넉넉하고 풍성한 한가위 보내십시오.","exen":"Have a Hangawi as ample and abundant as the full moon.","exru":"Желаю щедрого и изобильного, как полная луна, праздника Хангави."},{"ko":"풍성하다","en":"to be abundant, plentiful","ru":"изобильный, богатый","ex":"","exen":"","exru":""},{"ko":"덕담을 하다","en":"to give words of blessing","ru":"говорить добрые пожелания","ex":"세배를 받은 윗사람은 아랫사람에게 덕담을 해 준다.","exen":"The elder who receives the bow offers words of blessing to the younger person.","exru":"Старший, принявший поклон, говорит младшему добрые пожелания."},{"ko":"세배하다","en":"to perform the New Year's bow","ru":"делать новогодний поклон старшим","ex":"아랫사람이 윗사람에게 세배를 한다.","exen":"Younger people bow to their elders.","exru":"Младшие кланяются старшим."},{"ko":"설빔을 입다","en":"to wear New Year's clothes","ru":"надевать новогоднюю (праздничную) одежду","ex":"","exen":"","exru":""},{"ko":"세뱃돈을 받다","en":"to receive New Year's money","ru":"получать новогодние деньги","ex":"아이들은 세배하고 세뱃돈을 받는다.","exen":"Children bow and receive New Year's money.","exru":"Дети кланяются и получают новогодние деньги."},{"ko":"단오","en":"Dano (5th day of the 5th lunar month)","ru":"Тано (5-й день 5-го лунного месяца)","ex":"단오는 음력 5월 5일이다.","exen":"Dano is the 5th day of the 5th lunar month.","exru":"Тано — 5-й день 5-го месяца по лунному календарю."},{"ko":"씨름","en":"ssireum (Korean wrestling)","ru":"ссирым (корейская борьба)","ex":"","exen":"","exru":""},{"ko":"그네를 타다","en":"to ride a swing","ru":"качаться на качелях","ex":"","exen":"","exru":""}],"grammar":[{"g":"-어도","ko":"비가 와[[도]] 행사는 진행됩니다.","en":"Even if it rains, the event will go ahead.","ru":"Даже если пойдёт дождь, мероприятие состоится."},{"g":"-어도","ko":"나는 시간이 없[[어도]] 아침밥을 꼭 먹는다.","en":"Even if I don't have time, I always eat breakfast.","ru":"Даже если нет времени, я обязательно завтракаю."},{"g":"-어도","ko":"고천 씨는 몸이 아무리 아[[파도]] 수업 시간에 결석하지 않는다.","en":"No matter how sick she is, Gocheon never misses class.","ru":"Как бы плохо Гочхон себя ни чувствовала, она не пропускает занятия."},{"g":"-어도","ko":"아무리 바[[빠도]] 명절에는 꼭 고향에 가야지.","en":"However busy I am, I must go home for the holidays.","ru":"Как бы я ни был занят, на праздники обязательно надо ехать домой."},{"g":"-어도","ko":"저는 아무리 피곤해[[도]] 매일 운동을 해요.","en":"No matter how tired I am, I exercise every day.","ru":"Как бы я ни устал, я каждый день занимаюсь спортом."},{"g":"-어도","ko":"저는 늦게 자[[도]] 7시에는 꼭 일어나요.","en":"Even if I go to bed late, I always get up at 7.","ru":"Даже если ложусь поздно, в 7 обязательно встаю."},{"g":"-어도","ko":"며칠 동안 약을 먹[[어도]] 낫지 않아요.","en":"Even though I've taken medicine for days, I'm not getting better.","ru":"Пью лекарство уже несколько дней, но не выздоравливаю."},{"g":"-어도","ko":"저는 아무리 추[[워도]] 소매가 짧은 옷이 좋아요.","en":"No matter how cold it is, I like short-sleeved clothes.","ru":"Как бы ни было холодно, мне нравится одежда с короткими рукавами."},{"g":"-어도","ko":"길이 많이 막[[혀도]] 꼭 갈 거예요.","en":"Even if the roads are very congested, I'll definitely go.","ru":"Даже если на дорогах будут пробки, я обязательно поеду."},{"g":"-어도","ko":"한국 뉴스를 여러 번 들[[어도]] 이해가 되지 않아요.","en":"Even if I listen to Korean news several times, I don't understand it.","ru":"Даже если слушаю корейские новости несколько раз, я их не понимаю."},{"g":"-어도","ko":"비싸[[도]] 꼭 그 휴대 전화를 살 거예요.","en":"Even if it's expensive, I'll definitely buy that phone.","ru":"Даже если он дорогой, я обязательно куплю этот телефон."},{"g":"-게 되다","ko":"싸고 좋은 집을 구해서 이사 가[[게 됐어요]].","en":"I found a cheap, nice house, so I ended up moving.","ru":"Я нашёл дешёвую и хорошую квартиру, так что переезжаю."},{"g":"-게 되다","ko":"장사가 안 돼서 가게 문을 닫[[게 되었다]].","en":"Business was bad, so I ended up closing the shop.","ru":"Торговля не шла, и пришлось закрыть магазин."},{"g":"-게 되다","ko":"이번에 새로운 회사에 들어가[[게 되어서]] 정말 기쁘다.","en":"I'm really happy that I got to join a new company this time.","ru":"Я очень рад, что в этот раз попал в новую компанию."},{"g":"-게 되다","ko":"친한 친구 소개로 만나[[게 됐어요]].","en":"We came to meet through a close friend's introduction.","ru":"Мы познакомились благодаря близкому другу."},{"g":"-게 되다","ko":"이제는 매운 음식을 잘 먹[[게 됐어요]].","en":"Now I've come to eat spicy food well.","ru":"Теперь я научился хорошо есть острое."},{"g":"-게 되다","ko":"과장님 덕분에 한국 문화를 잘 알[[게 됐어요]].","en":"Thanks to you, manager, I've come to know Korean culture well.","ru":"Благодаря вам, начальник, я хорошо узнал корейскую культуру."},{"g":"-게 되다","ko":"지난주에 다리를 다쳐서 병원에 입원하[[게 되었다]].","en":"I hurt my leg last week and ended up being hospitalized.","ru":"На прошлой неделе я повредил ногу и попал в больницу."},{"g":"-게 되다","ko":"갑자기 제주도에 눈이 많이 와서 여행을 못 가[[게 되었다]].","en":"It suddenly snowed a lot on Jeju Island, so I couldn't go on the trip.","ru":"На Чеджу внезапно выпало много снега, и поездка сорвалась."},{"g":"-게 되다","ko":"처음에는 한국 역사에 관심이 없었는데 역사 드라마를 보고 관심을 가지[[게 됐어요]].","en":"At first I wasn't interested in Korean history, but after watching historical dramas I became interested.","ru":"Сначала меня не интересовала история Кореи, но, посмотрев исторические дорамы, я ею заинтересовался."},{"g":"-게 되다","ko":"아이를 키우면서 부모님의 고마움을 깨닫[[게 됐어요]].","en":"Raising a child, I came to realize how grateful I am to my parents.","ru":"Воспитывая ребёнка, я осознал, как благодарен родителям."}],"content":[{"q":"설날에 아랫사람과 윗사람은 무엇을 합니까?","qen":"What do younger people and elders do on Seollal?","qru":"Что делают младшие и старшие на Соллаль?","t":"아랫사람이 윗사람에게 세배를 하고, 윗사람은 덕담을 해 주고 아이들에게 세뱃돈을 줘요.","en":"Younger people bow to elders, and elders give words of blessing and give children New Year's money.","ru":"Младшие кланяются старшим, а старшие говорят добрые пожелания и дарят детям новогодние деньги.","k":["세배","세뱃돈"]},{"q":"추석에 차례를 지내는 이유는 무엇입니까?","qen":"Why do people hold ancestral rites on Chuseok?","qru":"Зачем на Чусок совершают обряд поминовения?","t":"햇곡식과 햇과일을 준비해서 조상에게 감사하는 마음을 표현하는 거예요.","en":"They prepare newly harvested grain and fruit to express gratitude to their ancestors.","ru":"Готовят зерно и фрукты нового урожая, чтобы выразить благодарность предкам.","k":["조상","감사"]},{"q":"요즘 명절의 모습은 예전과 어떻게 달라졌습니까?","qen":"How have holidays changed nowadays compared to the past?","qru":"Как изменились праздники по сравнению с прошлым?","t":"직접 찾아가는 대신 문자 메시지로 인사를 보내고, 가족이 함께 여행을 가기도 해요.","en":"Instead of visiting in person, people send greetings by text, and families sometimes travel together.","ru":"Вместо визитов поздравляют сообщениями, а семьи иногда вместе путешествуют.","k":["문자 메시지","여행"]},{"q":"뉴스에서 기자는 어떤 명절에 대해 말하고 있습니까?","qen":"Which holiday is the reporter talking about in the news?","qru":"О каком празднике говорит корреспондент в новостях?","t":"추석, 즉 한가위에 대해 말하고 있어요.","en":"She's talking about Chuseok, that is, Hangawi.","ru":"Она говорит о Чусоке, то есть о Хангави.","k":["추석","한가위"]},{"q":"고향에서 서울로 올라오는 부모들이 많은 이유는 무엇입니까?","qen":"Why are many parents coming up from their hometowns to Seoul?","qru":"Почему многие родители сами едут из родных мест в Сеул?","t":"자녀들이 고향 가는 길이 많이 막히고, 이번 추석은 연휴가 짧기 때문이에요.","en":"Because the roads home are badly congested for their children, and this Chuseok holiday is short.","ru":"Потому что у детей дорога домой сильно загружена, а праздники в этот Чусок короткие.","k":["길이 막히","연휴가 짧"]},{"q":"동지에 왜 팥죽을 먹습니까?","qen":"Why do people eat red bean porridge on Dongji?","qru":"Почему на Тонджи едят фасолевую кашу?","t":"팥죽의 붉은색이 나쁜 기운을 쫓아 준다고 생각하기 때문이에요.","en":"Because people believe the red color of the porridge drives away bad energy.","ru":"Потому что считается, что красный цвет каши отгоняет злые силы.","k":["붉은색","나쁜 기운"]},{"q":"단오에는 어떤 풍습이 있었습니까?","qen":"What customs were there on Dano?","qru":"Какие обычаи были на праздник Тано?","t":"창포물에 머리를 감고 남자들은 씨름을 하고 여자들은 그네를 탔어요.","en":"People washed their hair in iris water, men wrestled (ssireum), and women rode swings.","ru":"Мыли волосы в настое аира, мужчины боролись (ссирым), а женщины качались на качелях.","k":["씨름","그네"]},{"q":"강릉 단오제는 언제 유네스코 세계 무형 유산이 되었습니까?","qen":"When did the Gangneung Danoje Festival become a UNESCO intangible heritage?","qru":"Когда фестиваль Каннын Таноже стал нематериальным наследием ЮНЕСКО?","t":"2005년에 유네스코 세계 무형 유산이 되었어요.","en":"It became a UNESCO intangible cultural heritage in 2005.","ru":"Он стал нематериальным наследием ЮНЕСКО в 2005 году.","k":["2005년","유네스코"]}]},{"n":13,"vocab":[{"ko":"회의를 하다","en":"to hold a meeting","ru":"проводить совещание","ex":"오늘 오후 한 시에 전체 사원 회의를 하니 모두 참석해 주십시오.","exen":"There is an all-staff meeting at 1 p.m. today, so please everyone attend.","exru":"Сегодня в час дня общее собрание сотрудников, просьба всем присутствовать."},{"ko":"업무 지시를 하다/받다","en":"to give / receive work instructions","ru":"давать / получать рабочие указания","ex":"매일 아침 회의에서 팀장님은 팀원들에게 업무 지시를 한다.","exen":"Every morning at the meeting the team leader gives work instructions to the team members.","exru":"Каждое утро на совещании руководитель группы даёт сотрудникам рабочие указания."},{"ko":"서류를 작성하다","en":"to fill out / draw up documents","ru":"составлять документы","ex":"사장님께 제출할 서류를 오늘까지 작성해야 한다.","exen":"I have to prepare the documents for the president by today.","exru":"Нужно до сегодняшнего дня подготовить документы для директора."},{"ko":"결재를 하다/받다","en":"to approve / get approval (of a document)","ru":"утверждать / получать утверждение (документа)","ex":"세 시에 부장님께 보고서 결재를 받아야 한다.","exen":"At three I have to get the report approved by the department head.","exru":"В три часа нужно получить утверждение отчёта у начальника отдела."},{"ko":"업무를 보고하다","en":"to report on one's work","ru":"отчитываться о работе","ex":"","exen":"","exru":""},{"ko":"기계를 정비하다","en":"to maintain / service a machine","ru":"обслуживать (ремонтировать) оборудование","ex":"기계에 문제가 있으면 공구를 가지고 기계를 정비한다.","exen":"If there is a problem with the machine, I service it with tools.","exru":"Если со станком проблема, я ремонтирую его с помощью инструментов."},{"ko":"작동을 확인하다","en":"to check that something works","ru":"проверять работу (исправность)","ex":"작업할 때는 안전이 가장 중요하니까 꼭 기계 작동을 확인하세요.","exen":"Safety is most important when working, so be sure to check the machine.","exru":"При работе важнее всего безопасность, поэтому обязательно проверьте работу станка."},{"ko":"공구를 준비하다","en":"to prepare tools","ru":"готовить инструменты","ex":"","exen":"","exru":""},{"ko":"재고를 정리하다","en":"to sort out the inventory","ru":"разбирать складские запасы","ex":"오후에는 창고에 가서 재고를 정리한다.","exen":"In the afternoon I go to the warehouse and sort the stock.","exru":"Во второй половине дня я иду на склад и разбираю запасы."},{"ko":"자재를 주문하다","en":"to order materials","ru":"заказывать материалы","ex":"부족한 자재가 있으면 주문한다.","exen":"If any materials are short, I order them.","exru":"Если каких-то материалов не хватает, я их заказываю."},{"ko":"작업 일지를 작성하다/제출하다","en":"to write / submit a work log","ru":"заполнять / сдавать рабочий журнал","ex":"퇴근하기 전에 작업 일지를 제출하고 가세요.","exen":"Submit your work log before you leave work.","exru":"Перед уходом с работы сдайте рабочий журнал."},{"ko":"업무","en":"work, duties, business","ru":"работа, служебные обязанности","ex":"업무를 파악해 가고 있어요.","exen":"I'm getting to grasp my duties.","exru":"Я постепенно разбираюсь в своих обязанностях."},{"ko":"지시","en":"instruction, order","ru":"указание, распоряжение","ex":"","exen":"","exru":""},{"ko":"작성하다","en":"to write up, to draw up","ru":"составлять, заполнять","ex":"작업 일지 잊지 말고 작성하세요.","exen":"Don't forget to fill in the work log.","exru":"Не забудьте заполнить рабочий журнал."},{"ko":"결재","en":"approval (of a document by a superior)","ru":"утверждение (документа начальником)","ex":"","exen":"","exru":""},{"ko":"정비하다","en":"to maintain, to service","ru":"обслуживать, налаживать","ex":"","exen":"","exru":""},{"ko":"작동","en":"operation, functioning (of a machine)","ru":"работа, функционирование (механизма)","ex":"","exen":"","exru":""},{"ko":"공구","en":"tool","ru":"инструмент","ex":"","exen":"","exru":""},{"ko":"재고","en":"stock, inventory","ru":"запасы на складе","ex":"잠시드 씨, 창고의 재고를 체크하세요.","exen":"Jamshid, check the stock in the warehouse.","exru":"Джамшид, проверьте запасы на складе."},{"ko":"자재","en":"materials","ru":"материалы","ex":"","exen":"","exru":""},{"ko":"제출하다","en":"to submit","ru":"сдавать, представлять","ex":"안젤라 씨, 모레까지 보고서를 제출하세요.","exen":"Angela, submit the report by the day after tomorrow.","exru":"Анжела, сдайте отчёт до послезавтра."},{"ko":"작업","en":"work, operation (task)","ru":"работа, рабочая операция","ex":"반장님, 오늘 작업을 다 마무리했는데요.","exen":"Foreman, I've finished today's work.","exru":"Бригадир, я закончил сегодняшнюю работу."},{"ko":"마무리하다","en":"to finish, to wrap up","ru":"завершать, доделывать","ex":"오늘 작업을 다 마무리했어요.","exen":"I've wrapped up all of today's work.","exru":"Я полностью закончил сегодняшнюю работу."},{"ko":"스스로","en":"by oneself, on one's own","ru":"сам, самостоятельно","ex":"아이에게 자기 방을 스스로 정리하게 하세요.","exen":"Have your child tidy their own room by themselves.","exru":"Пусть ребёнок сам убирает свою комнату."},{"ko":"거주하다","en":"to reside","ru":"проживать","ex":"6개월 이상 거주하는 외국인에게 외국인 등록을 하게 합니다.","exen":"Foreigners residing over six months are required to register.","exru":"Иностранцев, проживающих более шести месяцев, обязывают пройти регистрацию."},{"ko":"창고","en":"warehouse, storeroom","ru":"склад","ex":"택배 박스를 창고로 옮기게 하셨어요.","exen":"He had the parcel boxes moved to the warehouse.","exru":"Он велел перенести коробки с посылками на склад."},{"ko":"적응하다","en":"to adapt, to adjust","ru":"адаптироваться, привыкать","ex":"선배님들이 잘 가르쳐 주셔서 잘 적응해 가고 있어요.","exen":"My seniors teach me well, so I'm adjusting well.","exru":"Старшие коллеги хорошо меня учат, так что я неплохо адаптируюсь."},{"ko":"방식","en":"way, method, manner","ru":"способ, манера","ex":"지금은 한국 사람들의 일하는 방식을 알아 가는 중이에요.","exen":"I'm now getting to know how Koreans work.","exru":"Сейчас я постепенно узнаю, как работают корейцы."},{"ko":"파악하다","en":"to grasp, to figure out","ru":"понимать, разбираться (в чём-то)","ex":"회사 업무를 파악해 가고 있어요.","exen":"I'm getting a grasp of the company's work.","exru":"Я постепенно разбираюсь в работе компании."},{"ko":"허락을 받다","en":"to get permission","ru":"получать разрешение","ex":"직장에서는 상사에게 미리 허락을 받는 게 좋아요.","exen":"At work it's best to get permission from your boss in advance.","exru":"На работе лучше заранее получить разрешение начальника."},{"ko":"상의하다","en":"to discuss, to consult","ru":"советоваться, обсуждать","ex":"","exen":"","exru":""},{"ko":"반반씩","en":"half and half, fifty-fifty","ru":"пополам, поровну","ex":"집안일은 반반씩 나누어서 하고 있습니다.","exen":"We split the housework fifty-fifty.","exru":"Мы делим работу по дому пополам."},{"ko":"모집 공고","en":"recruitment notice, job posting","ru":"объявление о наборе (вакансии)","ex":"","exen":"","exru":""},{"ko":"직종","en":"type of job, occupation","ru":"вид профессии, род занятий","ex":"지혜 씨는 나중에 어떤 직종에서 일하고 싶어요?","exen":"What kind of job do you want to work in later, Jihye?","exru":"Чжихе, в какой сфере вы хотите работать в будущем?"},{"ko":"사무직","en":"office job, clerical work","ru":"офисная работа","ex":"저는 보고서를 작성하는 사무직이 적성에 맞는 것 같아요.","exen":"I think office work like writing reports suits me.","exru":"Мне, кажется, подходит офисная работа, например составление отчётов."},{"ko":"생산직","en":"production job","ru":"работа на производстве","ex":"","exen":"","exru":""},{"ko":"관리직","en":"managerial job","ru":"руководящая должность","ex":"경험을 더 쌓아서 관리직에서 일하고 싶다.","exen":"I want to gain more experience and work in management.","exru":"Я хочу набраться опыта и работать на руководящей должности."},{"ko":"영업직","en":"sales job (business sales)","ru":"работа в отделе продаж","ex":"","exen":"","exru":""},{"ko":"판매직","en":"retail sales job","ru":"работа продавцом","ex":"저는 성격이 활발한 편이어서 판매직에서 일하고 싶어요.","exen":"I'm outgoing, so I want to work in sales.","exru":"Я довольно общительный, поэтому хочу работать продавцом."},{"ko":"일용직","en":"day labor job","ru":"подённая работа","ex":"","exen":"","exru":""},{"ko":"급여","en":"pay, salary","ru":"заработная плата","ex":"","exen":"","exru":""},{"ko":"연봉","en":"annual salary","ru":"годовая зарплата","ex":"그 축구 선수는 팀을 옮겨서 높은 연봉을 받게 되었다.","exen":"That soccer player changed teams and got a high annual salary.","exru":"Этот футболист перешёл в другую команду и стал получать высокую годовую зарплату."},{"ko":"주급","en":"weekly wage","ru":"еженедельная оплата","ex":"","exen":"","exru":""},{"ko":"일당","en":"daily wage","ru":"подённая оплата, плата за день","ex":"나는 어제 하루 동안 일한 일당을 받았다.","exen":"I received my daily wage for working yesterday.","exru":"Я получил плату за вчерашний рабочий день."},{"ko":"시급","en":"hourly wage","ru":"почасовая оплата","ex":"나는 야간 아르바이트를 해서 최저 시급보다 돈을 더 많이 받는다.","exen":"I work a night part-time job, so I earn more than the minimum hourly wage.","exru":"Я подрабатываю ночью, поэтому получаю больше минимальной почасовой ставки."},{"ko":"수당","en":"allowance, extra pay","ru":"надбавка, доплата","ex":"야근이나 주말 근무를 하면 수당을 받는다.","exen":"You get extra pay for overtime or weekend work.","exru":"За сверхурочную работу или работу в выходные платят надбавку."},{"ko":"보너스","en":"bonus","ru":"премия, бонус","ex":"","exen":"","exru":""},{"ko":"해소하다","en":"to relieve, to resolve (stress)","ru":"снимать (стресс), устранять","ex":"힘들 때 어떤 방법으로 스트레스를 해소할까요?","exen":"How do people relieve stress when things are hard?","exru":"Как люди снимают стресс, когда им тяжело?"},{"ko":"성과","en":"results, achievement","ru":"результат, достижения","ex":"일에서 좋은 성과를 얻어야 하는 것이 힘들다.","exen":"Having to get good results at work is hard.","exru":"Тяжело, что нужно добиваться хороших результатов в работе."},{"ko":"피로","en":"fatigue","ru":"усталость","ex":"쉬지 못해 피로가 쌓이기 때문에 힘들다고 한다.","exen":"They say it's hard because they can't rest and fatigue builds up.","exru":"Говорят, что это тяжело, потому что нет отдыха и накапливается усталость."},{"ko":"정확하다","en":"to be exact, accurate","ru":"точный","ex":"업무 내용을 정확하게 파악해야 한다.","exen":"You must understand your duties accurately.","exru":"Нужно точно понимать содержание своей работы."},{"ko":"이겨 내다","en":"to overcome, to get through","ru":"преодолевать, справляться","ex":"직장 생활의 어려움을 이렇게 이겨 낸다.","exen":"This is how they overcome the difficulties of working life.","exru":"Вот как они преодолевают трудности работы."},{"ko":"상사","en":"boss, superior","ru":"начальник, вышестоящий","ex":"상사가 여러 명이라서 업무 보고를 누구에게 해야 하는지 모르겠다.","exen":"I have several bosses, so I don't know whom to report to.","exru":"У меня несколько начальников, и я не знаю, кому отчитываться."},{"ko":"상하 관계","en":"hierarchical relationship","ru":"отношения начальника и подчинённого","ex":"상사와의 상하 관계도 어렵다고 한다.","exen":"They say the hierarchy with superiors is also hard.","exru":"Говорят, что иерархические отношения с начальством тоже даются трудно."},{"ko":"재충전하다","en":"to recharge (oneself)","ru":"восстанавливать силы, перезаряжаться","ex":"취미 생활을 하면서 재충전을 한다고 했다.","exen":"They said they recharge through hobbies.","exru":"Они сказали, что восстанавливают силы с помощью хобби."},{"ko":"책임감","en":"sense of responsibility","ru":"чувство ответственности","ex":"하는 일에 책임감이 있어야 한다.","exen":"You must have a sense of responsibility for your work.","exru":"Нужно ответственно относиться к своей работе."},{"ko":"원만하다","en":"to be smooth, harmonious (relations)","ru":"ровный, гармоничный (об отношениях)","ex":"대인 관계가 원만해야 한다.","exen":"Your relationships with others should be harmonious.","exru":"Отношения с людьми должны быть ровными."}],"grammar":[{"g":"-게 하다","ko":"이 약을 식후에 아이에게 먹[[게 하세요]].","en":"Have your child take this medicine after meals.","ru":"Давайте ребёнку это лекарство после еды."},{"g":"-게 하다","ko":"아이에게 자기 방을 스스로 정리하[[게 하세요]].","en":"Have your child tidy their own room by themselves.","ru":"Пусть ребёнок сам убирает свою комнату."},{"g":"-게 하다","ko":"작업 일지를 작성하고 팀원들에게도 작성하[[게 하세요]].","en":"Fill in the work log and have the team members fill it in too.","ru":"Заполните рабочий журнал и велите членам команды тоже его заполнить."},{"g":"-게 하다","ko":"과장님이 이링 씨에게 회의를 준비하[[게 하셨어요]].","en":"The manager had Yiling prepare the meeting.","ru":"Начальник поручил Илин подготовить совещание."},{"g":"-게 하다","ko":"선생님이 학생들에게 책을 읽[[게 하셨어요]].","en":"The teacher had the students read the book.","ru":"Учитель велел ученикам читать книгу."},{"g":"-게 하다","ko":"김영욱 씨가 성민에게 따뜻한 옷을 입[[게 했어요]].","en":"Kim Yeong-uk had Seongmin wear warm clothes.","ru":"Ким Ёнъук велел Сонмину надеть тёплую одежду."},{"g":"-게 하다","ko":"반장님이 라흐만 씨에게 기계 작동을 확인하[[게 했어요]].","en":"The foreman had Rahman check the machine.","ru":"Бригадир велел Рахману проверить работу станка."},{"g":"-게 하다","ko":"과장님이 안젤라 씨에게 모레까지 보고서를 제출하[[게 했어요]].","en":"The manager had Angela submit the report by the day after tomorrow.","ru":"Начальник велел Анжеле сдать отчёт до послезавтра."},{"g":"-게 하다","ko":"아이가 며칠 동안 기침을 하면 빨리 병원에 가[[게 하세요]].","en":"If your child has been coughing for days, have them see a doctor quickly.","ru":"Если ребёнок кашляет несколько дней, скорее отведите его к врачу."},{"g":"-게 하다","ko":"아이가 스마트폰 게임을 오래 하면 숙제를 먼저 하[[게 하세요]].","en":"If your child plays phone games for long, make them do their homework first.","ru":"Если ребёнок долго играет в телефон, пусть сначала сделает домашнее задание."},{"g":"-어 가다","ko":"서류 번역이 이제 거의 다 끝[[나 가요]].","en":"The document translation is almost done now.","ru":"Перевод документов уже почти закончен."},{"g":"-어 가다","ko":"한국에 온 지 거의 3년이 되[[어 가요]].","en":"It's going on three years since I came to Korea.","ru":"Скоро будет три года, как я приехал в Корею."},{"g":"-어 가다","ko":"지금은 한국 사람들의 일하는 방식을 알[[아 가는]] 중이에요.","en":"I'm now getting to know how Koreans work.","ru":"Сейчас я постепенно узнаю, как работают корейцы."},{"g":"-어 가다","ko":"선배님들이 잘 가르쳐 주셔서 잘 적응[[해 가고]] 있어요.","en":"My seniors teach me well, so I'm adjusting well.","ru":"Старшие коллеги хорошо меня учат, и я понемногу привыкаю."},{"g":"-어 가다","ko":"이제 조금씩 직원들의 이름과 얼굴을 외[[워 가고]] 있습니다.","en":"I'm gradually memorizing my coworkers' names and faces.","ru":"Я понемногу запоминаю имена и лица сотрудников."},{"g":"-어 가다","ko":"지금 계약서 작성이 거의 되[[어 가요]]. 잠시만 기다리세요.","en":"The contract is almost ready. Please wait a moment.","ru":"Договор почти готов. Подождите немного."},{"g":"-어 가다","ko":"시험 시간이 15분 남았는데 시험 문제를 거의 풀[[어 가고]] 있어요.","en":"There are 15 minutes left and I've almost finished the questions.","ru":"До конца экзамена 15 минут, и я почти решил все задания."},{"g":"-어 가다","ko":"고천 씨와 김영욱 씨는 부부라서 점점 닮[[아 가고]] 있어요.","en":"Gaochen and Kim Yeong-uk are a couple, so they're growing more alike.","ru":"Гаочэнь и Ким Ёнъук — супруги, поэтому становятся всё больше похожи."},{"g":"-어 가다","ko":"안젤라 씨, 보고서를 다 [[써 가요]]?","en":"Angela, are you nearly done writing the report?","ru":"Анжела, вы уже почти дописали отчёт?"},{"g":"-어 가다","ko":"라흐만 씨, 작업이 거의 끝[[나 가요]]?","en":"Rahman, is the work almost finished?","ru":"Рахман, работа почти закончена?"}],"content":[{"q":"설문 조사에서 직장인들이 가장 힘들다고 한 것은 무엇입니까?","qen":"In the survey, what did office workers say was hardest?","qru":"Что, по опросу, работники назвали самым трудным?","t":"대인 관계 때문에 스트레스를 받는 것이 가장 힘들다고 했습니다.","en":"They said getting stressed because of relationships with people is the hardest.","ru":"Они сказали, что тяжелее всего стресс из-за отношений с людьми.","k":["대인 관계"]},{"q":"직장인들은 야근이나 주말 근무가 왜 힘들다고 합니까?","qen":"Why do workers say overtime or weekend work is hard?","qru":"Почему работники считают сверхурочную работу и работу в выходные тяжёлой?","t":"쉬지 못해서 피로가 쌓이기 때문입니다.","en":"Because they can't rest and fatigue builds up.","ru":"Потому что они не могут отдохнуть и накапливается усталость.","k":["피로"]},{"q":"직장인들이 스트레스를 푸는 최고의 방법은 무엇이라고 했습니까?","qen":"What did workers say is the best way to relieve stress?","qru":"Какой способ снять стресс работники назвали лучшим?","t":"아무것도 하지 않고 휴식을 하는 것이 최고의 방법이라고 했습니다.","en":"They said resting and doing nothing is the best way.","ru":"Они сказали, что лучший способ — отдыхать, ничего не делая.","k":["휴식"]},{"q":"안젤라 씨는 부장님께 어떤 서류를 냈습니까?","qen":"What document did Angela submit to the department head?","qru":"Какой документ Анжела подала начальнику отдела?","t":"휴가 신청서를 냈습니다.","en":"She submitted a leave request form.","ru":"Она подала заявление на отпуск.","k":["휴가 신청서"]},{"q":"선배는 휴가를 신청하기 전에 어떻게 하면 좋다고 했습니까?","qen":"What did the senior colleague say to do before requesting leave?","qru":"Что, по словам старшего коллеги, нужно сделать перед тем, как просить отпуск?","t":"상사에게 미리 허락을 받는 게 좋다고 했습니다.","en":"He said it's good to get permission from your boss in advance.","ru":"Он сказал, что лучше заранее получить разрешение начальника.","k":["허락"]},{"q":"'워라밸'은 무슨 뜻입니까?","qen":"What does 'worabal' mean?","qru":"Что означает слово «ворабэль»?","t":"일과 개인 생활의 균형이라는 뜻입니다.","en":"It means the balance between work and personal life.","ru":"Оно означает баланс между работой и личной жизнью.","k":["균형"]},{"q":"'소확행'은 무슨 뜻입니까?","qen":"What does 'sohwakhaeng' mean?","qru":"Что означает слово «сохвакхэн»?","t":"작지만 확실한 행복이라는 뜻입니다.","en":"It means small but certain happiness.","ru":"Оно означает маленькое, но настоящее счастье.","k":["행복"]},{"q":"정부는 근로자의 주당 근로 시간을 최대 몇 시간으로 줄였습니까?","qen":"To what maximum did the government cut workers' weekly hours?","qru":"До скольких часов максимум правительство сократило рабочую неделю?","t":"최대 52시간으로 줄였습니다.","en":"It reduced it to a maximum of 52 hours.","ru":"Оно сократило её максимум до 52 часов.","k":["52시간"]}]},{"n":14,"vocab":[{"ko":"정보를 검색하다","en":"to search for information","ru":"искать информацию","ex":"나는 아침마다 인터넷으로 날씨 정보를 검색한다.","exen":"Every morning I look up the weather on the internet.","exru":"Каждое утро я ищу в интернете прогноз погоды."},{"ko":"인터넷 뱅킹을 하다","en":"to do online banking","ru":"пользоваться интернет-банком","ex":"나는 다음 학기 한국어 수업료를 인터넷 뱅킹으로 보냈다.","exen":"I sent next semester's Korean tuition by online banking.","exru":"Я оплатил курс корейского на следующий семестр через интернет-банк."},{"ko":"인터넷 쇼핑을 하다","en":"to shop online","ru":"делать покупки в интернете","ex":"어제 인터넷 쇼핑으로 주문한 물건이 하루 만에 배송되었다.","exen":"What I ordered online yesterday was delivered in one day.","exru":"Товар, который я вчера заказал в интернете, доставили за один день."},{"ko":"이메일을 보내다","en":"to send an email","ru":"отправлять электронное письмо","ex":"","exen":"","exru":""},{"ko":"인터넷 강의를 듣다","en":"to take an online course","ru":"слушать онлайн-лекции","ex":"민수는 매일 인터넷 강의를 들으면서 혼자서 외국어를 공부한다.","exen":"Minsu studies a foreign language on his own with online lectures every day.","exru":"Минсу каждый день сам изучает иностранный язык по онлайн-лекциям."},{"ko":"영화를 감상하다","en":"to watch (enjoy) a movie","ru":"смотреть фильм","ex":"나는 영화관에 가는 것보다 집에서 영화 감상하는 것을 좋아한다.","exen":"I prefer watching movies at home to going to the cinema.","exru":"Я больше люблю смотреть фильмы дома, чем ходить в кино."},{"ko":"에스엔에스(SNS)를 하다","en":"to use social media","ru":"сидеть в соцсетях","ex":"나는 매일 에스엔에스(SNS)를 하면서 고향에 있는 가족들과 연락한다.","exen":"I keep in touch with my family back home through social media every day.","exru":"Я каждый день общаюсь с семьёй на родине через соцсети."},{"ko":"댓글을 남기다","en":"to leave a comment","ru":"оставлять комментарий","ex":"인터넷 게시판에서 다른 사람이 올린 글에 댓글을 남길 수 있다.","exen":"You can comment on others' posts on internet boards.","exru":"На интернет-форуме можно оставлять комментарии к чужим постам."},{"ko":"유튜브(Youtube)를 보다","en":"to watch YouTube","ru":"смотреть YouTube","ex":"요즘은 유튜브를 보는 사람이 정말 많아졌지요?","exen":"So many more people watch YouTube these days, right?","exru":"Сейчас очень много людей смотрят YouTube, правда?"},{"ko":"사진을 촬영하다","en":"to take photos","ru":"фотографировать","ex":"저는 스마트폰으로 사진을 촬영하거나 게임을 해요.","exen":"I take photos or play games on my smartphone.","exru":"Я фотографирую или играю в игры на смартфоне."},{"ko":"동영상을 촬영하다","en":"to shoot a video","ru":"снимать видео","ex":"","exen":"","exru":""},{"ko":"영상 통화를 하다","en":"to make a video call","ru":"звонить по видеосвязи","ex":"영상 통화를 하면 서로 얼굴을 보면서 이야기할 수 있다.","exen":"With a video call you can talk while seeing each other's faces.","exru":"По видеосвязи можно разговаривать, видя друг друга."},{"ko":"문자를 보내다","en":"to send a text message","ru":"отправлять сообщение (SMS)","ex":"친구가 나에게 약속 장소와 시간을 문자로 보내 주었다.","exen":"My friend texted me the meeting place and time.","exru":"Друг прислал мне сообщением место и время встречи."},{"ko":"어휘 뜻을 찾다","en":"to look up the meaning of a word","ru":"искать значение слова","ex":"모르는 단어가 있으면 사전으로 뜻을 찾아 보세요.","exen":"If there's a word you don't know, look it up in a dictionary.","exru":"Если встретите незнакомое слово, посмотрите его значение в словаре."},{"ko":"게임을 하다","en":"to play games","ru":"играть в игры","ex":"","exen":"","exru":""},{"ko":"앱(App)을 설치하다","en":"to install an app","ru":"устанавливать приложение","ex":"저는 한국어 어휘 앱을 설치해 놓고 심심할 때마다 공부해요.","exen":"I installed a Korean vocabulary app and study whenever I'm bored.","exru":"Я установил приложение для корейской лексики и занимаюсь, когда скучно."},{"ko":"최신","en":"the latest, newest","ru":"новейший, последний","ex":"최신 스마트폰으로 찍었잖아요.","exen":"You know, I took it with the latest smartphone.","exru":"Так я же снимал на новейший смартфон."},{"ko":"간편하다","en":"to be simple, convenient","ru":"простой, удобный","ex":"김밥은 바쁠 때 간편하게 먹을 수 있잖아요.","exen":"You know you can eat gimbap easily when you're busy.","exru":"Кимпаб ведь можно быстро съесть, когда занят."},{"ko":"세계적","en":"global, world-class","ru":"мировой, всемирный","ex":"케이팝이 세계적으로 인기 있는 이유가 뭐예요?","exen":"Why is K-pop popular worldwide?","exru":"Почему K-pop популярен во всём мире?"},{"ko":"출장을 가다","en":"to go on a business trip","ru":"ехать в командировку","ex":"드미트리 씨는 출장을 갔잖아요.","exen":"Dmitri went on a business trip, remember?","exru":"Дмитрий ведь уехал в командировку."},{"ko":"홈페이지","en":"website, homepage","ru":"веб-сайт","ex":"이 홈페이지에 회원 가입이 잘 안 되네요.","exen":"Signing up on this website isn't working.","exru":"На этом сайте никак не получается зарегистрироваться."},{"ko":"회원 가입을 하다","en":"to sign up (as a member)","ru":"регистрироваться (на сайте)","ex":"","exen":"","exru":""},{"ko":"회원으로 가입하다","en":"to join as a member","ru":"вступать в члены, регистрироваться","ex":"","exen":"","exru":""},{"ko":"본인 확인","en":"identity verification","ru":"подтверждение личности","ex":"휴대 전화로 본인 확인을 해야 가입이 돼요.","exen":"You can only sign up after verifying your identity by phone.","exru":"Зарегистрироваться можно только после подтверждения личности по телефону."},{"ko":"개통하다","en":"to activate (a phone line)","ru":"подключать (мобильную связь)","ex":"중학생은 혼자 스마트폰을 개통할 수 없어요?","exen":"Can't middle schoolers activate a smartphone on their own?","exru":"Школьники средних классов не могут сами подк
