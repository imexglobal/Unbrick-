the morning, but it has stopped now.","ru":"Утром шёл сильный дождь, а сейчас перестал."},{"g":"-다가","ko":"친구하고 놀[[다가]] 막차를 놓쳐서 늦었어요.","en":"I was hanging out with a friend, missed the last bus, and was late.","ru":"Я гулял с другом, опоздал на последний автобус и поэтому задержался."}],"content":[{"q":"후엔 씨는 처음에 어느 프로그램에 등록하고 싶었어요?","qen":"Which program did Huyen first want to register for?","qru":"На какую программу Хуен сначала хотела записаться?","t":"초급 컴퓨터 프로그램에 등록하고 싶었어요.","en":"She wanted to register for the beginner computer program.","ru":"Она хотела записаться на начальный компьютерный курс.","k":["초급","컴퓨터"]},{"q":"초급 컴퓨터 수업은 왜 등록할 수 없었어요?","qen":"Why couldn't she register for the beginner computer class?","qru":"Почему она не смогла записаться на начальный курс компьютера?","t":"초급 컴퓨터는 이미 마감이 됐기 때문이에요.","en":"Because the beginner computer class was already full.","ru":"Потому что набор на начальный курс уже закрыт.","k":["마감"]},{"q":"중급 컴퓨터 수업의 등록비와 수업 시간은 어떻게 돼요?","qen":"What are the fee and schedule of the intermediate computer class?","qru":"Сколько стоит курс компьютера среднего уровня и когда занятия?","t":"등록비는 3만 원이고 화요일과 목요일 오후 8시부터 9시까지예요.","en":"The fee is 30,000 won, and it's on Tuesdays and Thursdays from 8 to 9 p.m.","ru":"Стоит 30 000 вон, занятия по вторникам и четвергам с 8 до 9 вечера.","k":["3만 원","화요일"]},{"q":"새로 문을 연 복지 센터 1층은 어떻게 활용돼요?","qen":"How is the first floor of the newly opened welfare center used?","qru":"Как используется первый этаж нового центра соцподдержки?","t":"국가별 영화 상영과 전시로 세계 문화를 소개하는 사회 통합의 장으로 활용돼요.","en":"It's used as a place for social integration, introducing world cultures through film screenings and exhibitions by country.","ru":"Он используется как площадка социальной интеграции, где знакомят с мировыми культурами через показы фильмов и выставки разных стран.","k":["영화","전시"]},{"q":"글로벌 아동 센터는 누구를 대상으로 해요?","qen":"Who is the global children's center for?","qru":"Для кого предназначен глобальный детский центр?","t":"12세 이하 다문화 아동과 18세 이하 중도 입국 청소년을 대상으로 해요.","en":"It serves multicultural children aged 12 and under and immigrant teenagers aged 18 and under who came to Korea mid-childhood.","ru":"Для детей из многокультурных семей до 12 лет и подростков до 18 лет, приехавших в Корею в школьном возрасте.","k":["12세","18세"]},{"q":"다문화이주민플러스센터는 어떤 기관이에요?","qen":"What kind of institution is the Multicultural Immigrant Plus Center?","qru":"Что представляет собой Центр «Мультикультурные иммигранты плюс»?","t":"여러 부처에서 따로 제공하던 서비스를 통합하여 제공하는 복합 서비스 기관이에요.","en":"It's an integrated service institution that provides in one place services previously offered separately by various ministries.","ru":"Это единый сервисный центр, где объединены услуги, которые раньше отдельно предоставляли разные министерства.","k":["통합","서비스"]},{"q":"다문화이주민플러스센터에서는 어떤 서비스를 받을 수 있어요?","qen":"What services can you get at the Multicultural Immigrant Plus Center?","qru":"Какие услуги можно получить в Центре «Мультикультурные иммигранты плюс»?","t":"외국인 등록, 체류 기간 연장, 고용 허가, 가족 상담, 통역 서비스 등을 받을 수 있어요.","en":"You can get foreigner registration, stay extensions, employment permits, family counseling, interpretation and more.","ru":"Регистрацию иностранцев, продление срока пребывания, разрешение на работу, семейные консультации, услуги переводчика и т. д.","k":["외국인 등록","체류"]},{"q":"다문화이주민플러스센터는 처음에 몇 개 지역에서 운영되었어요?","qen":"In how many regions did the center first operate?","qru":"В скольких регионах центр сначала работал?","t":"처음에는 10개 지역에서 시범적으로 운영되었어요.","en":"At first it operated on a trial basis in 10 regions.","ru":"Сначала он работал в пробном режиме в 10 регионах.","k":["10개","시범"]}]},{"n":4,"vocab":[{"ko":"사이즈가 작다","en":"the size is small","ru":"размер маленький","ex":"사이즈가 작은 신발을 신고 걸어서 발이 아팠다.","exen":"My feet hurt because I walked in shoes that were too small.","exru":"У меня болели ноги, потому что я ходил в обуви не по размеру."},{"ko":"색상이 다르다","en":"the color is different","ru":"цвет отличается","ex":"인터넷에서 본 사진과 색상이 조금 달라서 환불하려고 한다.","exen":"The color is a bit different from the photo online, so I'm going to get a refund.","exru":"Цвет немного отличается от фото в интернете, поэтому я хочу вернуть деньги."},{"ko":"바지가 헐렁하다","en":"the pants are loose","ru":"брюки свободные (велики)","ex":"살이 많이 빠져서 작년에 산 바지가 헐렁해졌다.","exen":"I lost a lot of weight, so the pants I bought last year have become loose.","exru":"Я сильно похудел, и брюки, купленные в прошлом году, стали велики."},{"ko":"바지가 끼다","en":"the pants are tight","ru":"брюки жмут (тесные)","ex":"바지가 작아서 꽉 꼈습니다.","exen":"The pants were small, so they were very tight.","exru":"Брюки были малы и сильно жали."},{"ko":"얼룩이 있다","en":"there is a stain","ru":"есть пятно","ex":"얼룩이 있어 가지고 환불했어요.","exen":"There was a stain, so I got a refund.","exru":"Там было пятно, поэтому я вернул деньги."},{"ko":"단추가 떨어지다","en":"a button comes off","ru":"оторвалась пуговица","ex":"어제 산 건데 단추가 떨어져 가지고 교환하고 싶은데요.","exen":"I bought this yesterday, but a button came off, so I'd like to exchange it.","exru":"Я купил это вчера, но оторвалась пуговица, хочу обменять."},{"ko":"바느질이 잘못되다","en":"the stitching is faulty","ru":"плохо прошито, брак в шве","ex":"바지 밑 부분에 바느질이 잘못되어서 걸을 때 불편했습니다.","exen":"The stitching at the bottom of the pants was faulty, so it was uncomfortable to walk.","exru":"Внизу брюк был плохой шов, и ходить было неудобно."},{"ko":"디자인이 마음에 안 들다","en":"to not like the design","ru":"не нравится дизайн","ex":"","exen":"","exru":""},{"ko":"교환하다","en":"to exchange","ru":"обменивать","ex":"사이즈가 좀 작아 가지고 큰 사이즈로 교환하려고요.","exen":"The size is a bit small, so I'd like to exchange it for a bigger size.","exru":"Размер немного маловат, хочу обменять на больший."},{"ko":"환불하다","en":"to refund, to get a refund","ru":"возвращать деньги (за покупку)","ex":"티셔츠가 커 가지고 바로 환불했어요.","exen":"The T-shirt was too big, so I got a refund right away.","exru":"Футболка была велика, поэтому я сразу вернул деньги."},{"ko":"고객 센터에 문의하다","en":"to contact customer service","ru":"обратиться в службу поддержки клиентов","ex":"교환이나 환불을 하고 싶으면 고객 센터에 연락해서 신청하면 돼요.","exen":"If you want an exchange or refund, just contact customer service and apply.","exru":"Если хотите обменять или вернуть товар, просто свяжитесь со службой поддержки и подайте заявку."},{"ko":"소비자 상담 센터","en":"consumer counseling center","ru":"центр консультаций потребителей","ex":"소비자가 상담을 받고 싶으면 1372번으로 전화하면 된다.","exen":"Consumers who want counseling can call 1372.","exru":"Потребители, которым нужна консультация, могут позвонить по номеру 1372."},{"ko":"상담하다","en":"to consult, to counsel","ru":"консультировать(ся)","ex":"직원이 친절하게 상담해 주었습니다.","exen":"The employee kindly gave me advice.","exru":"Сотрудник любезно меня проконсультировал."},{"ko":"문의하다","en":"to inquire","ru":"обращаться с вопросом, запрашивать","ex":"매장에 전화로 문의해 봤어요.","exen":"I called the store to ask.","exru":"Я позвонил в магазин и спросил."},{"ko":"치수","en":"measurements, size","ru":"размер, мерка","ex":"","exen":"","exru":""},{"ko":"실수","en":"mistake","ru":"ошибка","ex":"회사의 실수일 경우는 무료예요.","exen":"If it's the company's mistake, it's free.","exru":"Если это ошибка компании, то бесплатно."},{"ko":"택배비","en":"delivery fee","ru":"плата за доставку","ex":"마음에 들지 않아서 교환이나 환불을 할 경우에는 택배비를 내야 해요.","exen":"If you exchange or return it because you don't like it, you have to pay the delivery fee.","exru":"Если вы обмениваете или возвращаете товар, потому что он не понравился, нужно оплатить доставку."},{"ko":"추천하다","en":"to recommend","ru":"рекомендовать","ex":"이번에 제가 추천하는 사이트에서 한번 쇼핑해 보세요.","exen":"Try shopping on the site I recommend.","exru":"Попробуйте купить что-нибудь на сайте, который я советую."},{"ko":"가능하다","en":"to be possible","ru":"возможный, можно","ex":"영수증을 가지고 한 달 이내로 오시면 교환, 환불이 가능합니다.","exen":"If you come within a month with the receipt, exchanges and refunds are possible.","exru":"Если придёте с чеком в течение месяца, обмен и возврат возможны."},{"ko":"불가능","en":"impossibility, not possible","ru":"невозможность, невозможно","ex":"세일 상품은 환불이 불가능합니다.","exen":"Sale items cannot be refunded.","exru":"Возврат денег за товары со скидкой невозможен."},{"ko":"개봉하다","en":"to open (a package)","ru":"вскрывать (упаковку)","ex":"박스를 개봉하면 교환, 환불이 불가능합니다.","exen":"If you open the box, exchange or refund is not possible.","exru":"Если коробка вскрыта, обмен и возврат невозможны."},{"ko":"미개봉","en":"unopened","ru":"невскрытый","ex":"박스 미개봉의 경우 1개월 이내 교환, 환불이 가능합니다.","exen":"If the box is unopened, exchanges and refunds are possible within one month.","exru":"Если коробка не вскрыта, обмен и возврат возможны в течение месяца."},{"ko":"훼손하다","en":"to damage","ru":"повреждать, портить","ex":"상품의 포장을 개봉, 훼손한 경우 교환, 환불이 불가능합니다.","exen":"If you open or damage the product packaging, exchanges and refunds are not possible.","exru":"Если упаковка вскрыта или повреждена, обмен и возврат невозможны."},{"ko":"구입하다","en":"to purchase","ru":"покупать, приобретать","ex":"3일 전 백화점 세일 기간에 청바지를 구입했습니다.","exen":"Three days ago I bought jeans during a department store sale.","exru":"Три дня назад я купил джинсы на распродаже в универмаге."},{"ko":"신선식품","en":"fresh food","ru":"свежие продукты","ex":"신선식품, 냉동식품의 경우 7일 이내","exen":"within 7 days for fresh and frozen foods","exru":"для свежих и замороженных продуктов — в течение 7 дней"},{"ko":"냉동식품","en":"frozen food","ru":"замороженные продукты","ex":"","exen":"","exru":""},{"ko":"파손","en":"damage, breakage","ru":"повреждение, поломка","ex":"박스 파손, 의류 수선 시 불가","exen":"not possible if the box is damaged or the clothing has been altered","exru":"невозможно при повреждении коробки или подгонке одежды"},{"ko":"수선하다","en":"to repair, to alter (clothes)","ru":"ремонтировать, подгонять (одежду)","ex":"","exen":"","exru":""},{"ko":"증정품","en":"free gift (with purchase)","ru":"подарок (к покупке)","ex":"증정품이 있을 경우 반납 후 가능","exen":"If there was a free gift, possible after returning it","exru":"Если был подарок, возможно после его возврата"},{"ko":"반납하다","en":"to return (something borrowed or given)","ru":"возвращать, сдавать обратно","ex":"","exen":"","exru":""},{"ko":"구매점","en":"store of purchase","ru":"магазин, где совершена покупка","ex":"교환/환불은 구매점에서만 가능합니다.","exen":"Exchanges and refunds are only possible at the store of purchase.","exru":"Обмен и возврат возможны только в магазине, где была покупка."},{"ko":"포장하다","en":"to wrap, to package","ru":"упаковывать","ex":"","exen":"","exru":""},{"ko":"보통","en":"usually, normally","ru":"обычно","ex":"보통 영수증을 가지고 한 달 이내로 오시면 교환, 환불이 가능합니다.","exen":"Usually, if you come within a month with the receipt, you can exchange or get a refund.","exru":"Обычно, если прийти с чеком в течение месяца, можно обменять товар или вернуть деньги."},{"ko":"판매자","en":"seller","ru":"продавец","ex":"매장에서 판매자로부터 특별한 내용을 안내받았다면 그 내용에 따라야 합니다.","exen":"If the seller informed you of special terms at the store, you must follow them.","exru":"Если продавец в магазине сообщил особые условия, нужно им следовать."},{"ko":"특별하다","en":"to be special","ru":"особый, специальный","ex":"","exen":"","exru":""},{"ko":"세일 상품","en":"sale item","ru":"товар со скидкой","ex":"세일 상품은 환불 불가, 교환은 3일 이내입니다.","exen":"Sale items cannot be refunded; exchanges within 3 days.","exru":"Товары со скидкой не возвращаются, обмен — в течение 3 дней."},{"ko":"소비자","en":"consumer","ru":"потребитель","ex":"소비자 분께서는 환불 및 교환을 받으실 수 없습니다.","exen":"The consumer cannot get a refund or exchange.","exru":"Потребитель не может получить ни возврат денег, ни обмен."},{"ko":"영수증","en":"receipt","ru":"чек","ex":"결제하신 카드하고 영수증은 가지고 오셨지요?","exen":"You brought the card you paid with and the receipt, right?","exru":"Вы принесли карту, которой платили, и чек?"},{"ko":"가격표","en":"price tag","ru":"ценник","ex":"일주일 이내에 가격표 제거하지 마시고 가져오세요.","exen":"Bring it within a week without removing the price tag.","exru":"Принесите в течение недели, не снимая ценник."}],"grammar":[{"g":"-을 만하다","ko":"2단계보다 어렵지만 공부[[할 만해요]].","en":"It's harder than level 2, but it's manageable to study.","ru":"Сложнее, чем второй уровень, но учиться вполне можно."},{"g":"-을 만하다","ko":"물냉면은 맵지 않아서 먹[[을 만해요]].","en":"Mul-naengmyeon isn't spicy, so it's easy enough to eat.","ru":"Холодная лапша в бульоне не острая, так что её вполне можно есть."},{"g":"-을 만하다","ko":"요즘 [[볼 만한]] 영화가 있으면 소개해 주세요.","en":"If there are any movies worth watching these days, please recommend them.","ru":"Если сейчас есть фильмы, которые стоит посмотреть, посоветуйте."},{"g":"-을 만하다","ko":"오래됐지만 아직 튼튼해서 [[쓸 만해요]].","en":"It's old, but it's still sturdy, so it's still usable.","ru":"Он старый, но ещё крепкий, так что им вполне можно пользоваться."},{"g":"-을 만하다","ko":"바지가 짧지만 입[[을 만해요]].","en":"The pants are short, but they're still wearable.","ru":"Брюки коротковаты, но носить их можно."},{"g":"-을 만하다","ko":"작년에 산 운동화가 아직 신[[을 만한데]] 새 디자인으로 또 사고 싶어요.","en":"The sneakers I bought last year are still wearable, but I want to buy a new design.","ru":"Кроссовки, купленные в прошлом году, ещё можно носить, но хочется купить новую модель."},{"g":"-을 만하다","ko":"이 옷은 따뜻해서 환절기에 입[[을 만해요]].","en":"These clothes are warm, so they're good to wear between seasons.","ru":"Эта одежда тёплая, её вполне можно носить в межсезонье."},{"g":"-을 만하다","ko":"한국 소설 중에서 읽[[을 만한]] 책 좀 소개해 주세요.","en":"Please recommend a Korean novel worth reading.","ru":"Посоветуйте, пожалуйста, корейский роман, который стоит прочитать."},{"g":"-을 만하다","ko":"한강 공원이 경치가 좋아서 걸[[을 만해요]].","en":"Hangang Park has nice scenery, so it's worth walking there.","ru":"В парке на реке Хан красивые виды, там приятно гулять."},{"g":"-을 만하다","ko":"알랭 씨는 약속을 잘 지켜서 믿[[을 만해요]].","en":"Alain keeps his promises well, so he's trustworthy.","ru":"Ален держит слово, ему можно доверять."},{"g":"-을 만하다","ko":"요즘 주말에 하는 드라마가 내용이 재미있어서 [[볼 만해요]].","en":"The weekend drama these days has an interesting story, so it's worth watching.","ru":"Сериал, который сейчас идёт по выходным, интересный, его стоит посмотреть."},{"g":"-을 만하다","ko":"인터넷으로 쇼핑[[할 만하네요]].","en":"Shopping online is worth it.","ru":"Покупать в интернете вполне стоит."},{"g":"-어 가지고","ko":"고향 친구가 [[와 가지고]] 집에 일찍 갔어요.","en":"A friend from my hometown came, so I went home early.","ru":"Приехал друг с родины, поэтому я рано ушёл домой."},{"g":"-어 가지고","ko":"사이즈가 좀 작[[아 가지고]] 큰 사이즈로 교환하려고요.","en":"The size is a bit small, so I'd like to exchange it for a bigger size.","ru":"Размер маловат, поэтому хочу обменять на больший."},{"g":"-어 가지고","ko":"얼룩이 있[[어 가지고]] 환불했어요.","en":"There was a stain, so I got a refund.","ru":"Было пятно, поэтому я вернул деньги."},{"g":"-어 가지고","ko":"어제 산 건데 단추가 떨어[[져 가지고]] 교환하고 싶은데요.","en":"I bought this yesterday, but a button came off, so I'd like to exchange it.","ru":"Я купил это вчера, но оторвалась пуговица, хочу обменять."},{"g":"-어 가지고","ko":"음식을 많이 먹[[어 가지고]] 소화제를 먹었어요.","en":"I ate a lot, so I took a digestive.","ru":"Я много съел, поэтому выпил средство для пищеварения."},{"g":"-어 가지고","ko":"바지가 헐렁[[해 가지고]] 교환했어요.","en":"The pants were loose, so I exchanged them.","ru":"Брюки были велики, поэтому я их обменял."},{"g":"-어 가지고","ko":"딸이 아[[파 가지고]] 병원에 가는 길이에요.","en":"My daughter is sick, so I'm on my way to the hospital.","ru":"Дочь заболела, поэтому я еду в больницу."},{"g":"-어 가지고","ko":"립스틱 색깔이 너무 예[[뻐 가지고]] 안 살 수가 없었어요.","en":"The lipstick color was so pretty that I couldn't help buying it.","ru":"Цвет помады был такой красивый, что я не смогла не купить."},{"g":"-어 가지고","ko":"지갑을 잃어버[[려 가지고]] 속상해요.","en":"I lost my wallet, so I'm upset.","ru":"Я потерял кошелёк, поэтому расстроен."},{"g":"-어 가지고","ko":"어제 매운 음식을 먹[[어 가지고]] 배가 아파요.","en":"I ate spicy food yesterday, so my stomach hurts.","ru":"Вчера я поел острого, поэтому болит живот."},{"g":"-어 가지고","ko":"맞는 사이즈가 없[[어 가지고]] 그냥 왔어요.","en":"They didn't have my size, so I just came back.","ru":"Подходящего размера не было, поэтому я просто ушёл."}],"content":[{"q":"라민 씨는 쇼핑을 어디에서 자주 해요?","qen":"Where does Ramin usually shop?","qru":"Где Рамин обычно делает покупки?","t":"라민 씨는 인터넷 쇼핑을 자주 하는 편이에요.","en":"Ramin tends to shop online often.","ru":"Рамин часто делает покупки в интернете.","k":["인터넷 쇼핑"]},{"q":"이링 씨는 무엇을 가장 걱정했어요?","qen":"What was Yiling most worried about?","qru":"О чём больше всего беспокоилась Илин?","t":"인터넷 쇼핑으로 물건을 사면 교환이나 환불을 못 받을 것 같아서 걱정했어요.","en":"She worried that if she bought things online, she couldn't get an exchange or refund.","ru":"Она боялась, что при покупке в интернете не сможет обменять товар или вернуть деньги.","k":["교환","환불"]},{"q":"인터넷 쇼핑에서 교환이나 환불은 모두 무료예요?","qen":"Are all exchanges and refunds free in online shopping?","qru":"В интернет-магазине обмен и возврат всегда бесплатны?","t":"아니요. 회사의 실수일 경우는 무료이지만 마음에 들지 않을 경우에는 택배비를 내야 해요.","en":"No. It's free if it's the company's mistake, but if you just don't like it, you have to pay the delivery fee.","ru":"Нет. Если ошибка компании — бесплатно, а если товар просто не понравился, нужно оплатить доставку.","k":["택배비"]},{"q":"질문을 쓴 사람은 왜 청바지를 환불하고 싶었어요?","qen":"Why did the person who wrote the question want a refund for the jeans?","qru":"Почему автор вопроса хотел вернуть джинсы?","t":"집에 와서 다시 입어 보니 사이즈가 좀 작은 것 같았기 때문이에요.","en":"Because when he tried them on again at home, they seemed a bit small.","ru":"Потому что дома он снова примерил их, и они показались маловаты.","k":["사이즈","작다"]},{"q":"이 사람은 왜 교환도 환불도 받을 수 없었어요?","qen":"Why couldn't this person get either an exchange or a refund?","qru":"Почему этот человек не смог ни обменять товар, ни вернуть деньги?","t":"영수증에 세일 상품은 환불 불가, 교환은 3일 이내라고 안내되어 있었기 때문이에요.","en":"Because the receipt stated that sale items can't be refunded and exchanges are only within 3 days.","ru":"Потому что в чеке было указано: товары со скидкой не возвращаются, обмен — только в течение 3 дней.","k":["세일 상품","영수증"]},{"q":"옷 가게 직원은 교환이나 환불을 하려면 어떻게 하라고 했어요?","qen":"What did the clothing store employee say to do for an exchange or refund?","qru":"Что сказал продавец магазина одежды о том, как обменять или вернуть товар?","t":"일주일 이내에 가격표를 제거하지 말고 가져오라고 했어요.","en":"He said to bring it within a week without removing the price tag.","ru":"Он сказал принести товар в течение недели, не снимая ценник.","k":["가격표","일주일"]},{"q":"소비자 상담 센터는 무슨 일을 해요?","qen":"What does the consumer counseling center do?","qru":"Чем занимается центр консультаций потребителей?","t":"소비자의 고충을 들어주고 피해를 구제받을 수 있도록 도와줘요.","en":"It listens to consumers' grievances and helps them get relief for damages.","ru":"Он выслушивает жалобы потребителей и помогает им получить возмещение ущерба.","k":["고충","피해"]},{"q":"소비자 상담 센터를 이용하려면 어떻게 해야 해요?","qen":"How can you use the consumer counseling center?","qru":"Как воспользоваться услугами центра консультаций потребителей?","t":"국번 없이 1372번으로 전화하거나 인터넷 홈페이지를 이용하면 돼요.","en":"You can call 1372 without an area code or use its website.","ru":"Нужно позвонить по номеру 1372 без кода или воспользоваться сайтом.","k":["1372"]}]},{"n":5,"vocab":[{"ko":"지출","en":"expenditure, spending","ru":"расходы, траты","ex":"생활비 지출이 많아서 걱정이에요.","exen":"I'm worried because my living expenses are high.","exru":"Я переживаю, потому что у меня большие расходы на жизнь."},{"ko":"지출 항목","en":"expense category","ru":"статья расходов","ex":"","exen":"","exru":""},{"ko":"식비","en":"food expenses","ru":"расходы на питание","ex":"나는 이번 달 식비로 60만 원을 썼다.","exen":"I spent 600,000 won on food this month.","exru":"В этом месяце я потратил на еду 600 000 вон."},{"ko":"통신비","en":"phone and internet bills","ru":"расходы на связь","ex":"이번 달에는 통신비가 27,000원밖에 안 나왔어요.","exen":"My phone bill this month was only 27,000 won.","exru":"В этом месяце счёт за связь составил всего 27 000 вон."},{"ko":"교육비","en":"education expenses","ru":"расходы на образование","ex":"저는 한 달에 교육비로 45만 원 정도 써요.","exen":"I spend about 450,000 won a month on education.","exru":"Я трачу на образование около 450 000 вон в месяц."},{"ko":"의료비","en":"medical expenses","ru":"медицинские расходы","ex":"","exen":"","exru":""},{"ko":"경조사비","en":"money for weddings, funerals and other family occasions","ru":"расходы на свадьбы, похороны и другие семейные события","ex":"","exen":"","exru":""},{"ko":"공과금","en":"utility bills","ru":"коммунальные платежи","ex":"","exen":"","exru":""},{"ko":"교통비","en":"transportation costs","ru":"транспортные расходы","ex":"이번 달에 교통비로 12만 원을 썼어요.","exen":"I spent 120,000 won on transportation this month.","exru":"В этом месяце я потратил на транспорт 120 000 вон."},{"ko":"문화생활비","en":"spending on cultural activities","ru":"расходы на культурный досуг","ex":"이번 달에 문화생활비로 30만 원이나 썼어요.","exen":"I spent as much as 300,000 won on cultural activities this month.","exru":"В этом месяце я потратил на культурный досуг целых 300 000 вон."},{"ko":"축의금","en":"congratulatory money (wedding gift)","ru":"денежный подарок на свадьбу","ex":"","exen":"","exru":""},{"ko":"난방비","en":"heating bill","ru":"плата за отопление","ex":"이번 달 난방비가 29만 원이나 나왔어요.","exen":"This month's heating bill came to as much as 290,000 won.","exru":"В этом месяце счёт за отопление составил целых 290 000 вон."},{"ko":"살 것을 미리 메모하다","en":"to write down what to buy in advance","ru":"заранее записывать, что купить","ex":"쇼핑을 하기 전에 살 것을 미리 메모하는 게 좋아요.","exen":"It's good to write down what to buy before shopping.","exru":"Перед покупками лучше заранее записать, что нужно купить."},{"ko":"가계부","en":"household account book","ru":"книга учёта домашних расходов","ex":"가계부를 쓰니까 무엇에 지출이 많은지 한눈에 알 수 있다.","exen":"Keeping an account book shows at a glance where I spend a lot.","exru":"Когда ведёшь учёт расходов, сразу видно, на что уходит больше всего."},{"ko":"결제하다","en":"to pay","ru":"оплачивать","ex":"카페에 갈 때 할인 카드로 결제해요.","exen":"When I go to a cafe, I pay with a discount card.","exru":"Когда я хожу в кафе, я плачу скидочной картой."},{"ko":"할인 카드","en":"discount card","ru":"скидочная карта","ex":"물건을 살 때 할인 카드를 잘 이용하면 비싼 상품도 저렴하게 살 수 있다.","exen":"If you use a discount card well, you can buy even expensive items cheaply.","exru":"Если правильно пользоваться скидочной картой, даже дорогие товары можно купить дёшево."},{"ko":"포인트","en":"reward points","ru":"бонусные баллы","ex":"","exen":"","exru":""},{"ko":"쿠폰","en":"coupon","ru":"купон","ex":"이 카페는 적립 쿠폰을 모아서 가면 무료로 커피를 준다.","exen":"At this cafe, if you collect stamp coupons, they give you a free coffee.","exru":"В этом кафе, если собрать купоны, дают бесплатный кофе."},{"ko":"적립하다","en":"to accumulate (points)","ru":"накапливать (баллы)","ex":"포인트와 쿠폰을 적립하면 돈을 아낄 수 있어요.","exen":"If you collect points and coupons, you can save money.","exru":"Если копить баллы и купоны, можно сэкономить деньги."},{"ko":"충동구매","en":"impulse buying","ru":"импульсивная покупка","ex":"사람들은 보통 충동구매를 한 후에 구매한 것을 후회한다.","exen":"People usually regret what they bought after an impulse purchase.","exru":"Обычно люди жалеют о покупке, сделанной импульсивно."},{"ko":"수리하다","en":"to repair","ru":"ремонтировать","ex":"직접 수리하면 비용을 아낄 수 있어요.","exen":"If you repair it yourself, you can save money.","exru":"Если ремонтировать самому, можно сэкономить."},{"ko":"중고차","en":"used car","ru":"подержанный автомобиль","ex":"중고차를 구입하면 싸요.","exen":"Buying a used car is cheap.","exru":"Подержанная машина обходится дёшево."},{"ko":"물려받다","en":"to receive as a hand-me-down, to inherit","ru":"получать по наследству (вещи от других)","ex":"이웃에게 아이의 교복을 물려받으면 좋아요.","exen":"It's good to get a child's school uniform handed down from a neighbor.","exru":"Хорошо получить от соседей школьную форму для ребёнка."},{"ko":"보일러","en":"boiler (home heating)","ru":"котёл отопления","ex":"한국 겨울 날씨가 너무 추워서 계속 보일러를 틀었거든요.","exen":"Korean winters are so cold that I kept the heating on.","exru":"Зимой в Корее так холодно, что я всё время включал отопление."},{"ko":"틀다","en":"to turn on (heating, music, etc.)","ru":"включать (отопление, музыку)","ex":"","exen":"","exru":""},{"ko":"온도","en":"temperature","ru":"температура","ex":"온도를 조금 내리고 옷을 따뜻하게 입으세요.","exen":"Lower the temperature a little and dress warmly.","exru":"Немного понизьте температуру и оденьтесь потеплее."},{"ko":"통신사","en":"mobile carrier, telecom company","ru":"оператор связи","ex":"가족들의 통신사를 같은 것으로 하면 통신비를 아낄 수 있어요.","exen":"If your family uses the same carrier, you can save on phone bills.","exru":"Если у всей семьи один оператор, можно сэкономить на связи."},{"ko":"장을 보다","en":"to go grocery shopping","ru":"ходить за продуктами","ex":"필요한 것만 메모해서 장을 봐요.","exen":"I write down only what I need and go grocery shopping.","exru":"Я записываю только нужное и иду за продуктами."},{"ko":"공유","en":"sharing","ru":"совместное использование, шеринг","ex":"가까운 거리는 공유 자전거를 이용해요.","exen":"For short distances, I use shared bikes.","exru":"На короткие расстояния я езжу на прокатных велосипедах."},{"ko":"전시 상품","en":"display item","ru":"выставочный образец","ex":"전시 상품은 새 상품보다 가격이 싸다.","exen":"Display items are cheaper than new ones.","exru":"Выставочные образцы дешевле новых товаров."},{"ko":"이월 상품","en":"last season's stock","ru":"товар прошлого сезона","ex":"계절과 반대되는 이월 상품은 저렴하게 살 수 있다.","exen":"You can buy off-season, last-season goods cheaply.","exru":"Товары прошлого сезона можно купить недорого."},{"ko":"합리적이다","en":"to be rational, sensible","ru":"быть разумным, рациональным","ex":"합리적으로 소비를 하는 문화가 늘어나고 있습니다.","exen":"A culture of sensible spending is growing.","exru":"Культура разумного потребления распространяется всё шире."},{"ko":"비용이 들다","en":"to cost money","ru":"требовать затрат","ex":"가족 여행을 가고 싶은데 비용이 많이 들 것 같아요.","exen":"I want to take a family trip, but it seems it will cost a lot.","exru":"Хочу поехать в семейное путешествие, но, кажется, это обойдётся дорого."},{"ko":"비용이 부담되다","en":"the cost is a burden","ru":"расходы обременительны","ex":"집을 수리해야 하는데 전셋집이라서 비용이 부담돼요.","exen":"I need to repair the house, but since it's a jeonse rental, the cost is a burden.","exru":"Нужно ремонтировать дом, но он съёмный (чонсе), и расходы мне в тягость."},{"ko":"비용이 부담스럽다","en":"to find the cost burdensome","ru":"расходы тяжелы","ex":"외국어를 배우고 싶은데 비용이 조금 부담스러워요.","exen":"I want to learn a foreign language, but the cost is a bit much.","exru":"Хочу изучать иностранный язык, но это для меня дороговато."},{"ko":"비용을 줄이다","en":"to reduce costs","ru":"сокращать расходы","ex":"어떻게 하면 비용을 줄일 수 있을까요?","exen":"How can I reduce the costs?","exru":"Как можно сократить расходы?"},{"ko":"공동 구매","en":"group buying","ru":"совместная покупка","ex":"공동 구매를 이용한다.","exen":"Use group buying.","exru":"Пользоваться совместными покупками."},{"ko":"벼룩시장","en":"flea market","ru":"блошиный рынок","ex":"집 주변의 벼룩시장에서 필요한 물건을 고른다.","exen":"Pick out what you need at a flea market near your home.","exru":"Выбирать нужные вещи на блошином рынке рядом с домом."},{"ko":"정반대","en":"the exact opposite","ru":"полная противоположность","ex":"정반대 계절의 이월 상품을 이용한다.","exen":"Buy last-season goods for the opposite season.","exru":"Покупать товары прошлого сезона для противоположного времени года."},{"ko":"흠집","en":"scratch, flaw","ru":"царапина, дефект","ex":"가구나 가전제품은 흠집이 난 상품을 구입한다.","exen":"For furniture or appliances, buy items with scratches.","exru":"Мебель и бытовую технику покупать с небольшими царапинами."},{"ko":"육아용품","en":"childcare products, baby goods","ru":"товары для ухода за детьми","ex":"많은 부모들이 중고 육아용품을 구입한다.","exen":"Many parents buy second-hand baby goods.","exru":"Многие родители покупают подержанные детские товары."},{"ko":"설문 조사","en":"survey","ru":"опрос","ex":"부모 1,000명을 대상으로 설문 조사를 실시했다.","exen":"A survey was conducted of 1,000 parents.","exru":"Был проведён опрос среди 1000 родителей."},{"ko":"실시하다","en":"to conduct, carry out","ru":"проводить","ex":"","exen":"","exru":""},{"ko":"차지하다","en":"to account for, take up","ru":"составлять, занимать","ex":"다시 구입할 생각이 있다는 대답이 40%를 차지했다.","exen":"Answers saying they would buy again accounted for 40%.","exru":"Ответы о готовности купить снова составили 40%."},{"ko":"한편","en":"meanwhile, on the other hand","ru":"с другой стороны, между тем","ex":"","exen":"","exru":""},{"ko":"적금","en":"installment savings account","ru":"накопительный вклад","ex":"월급을 모아 큰돈을 모으고 싶다면 정기 적금에 가입하는 것이 좋다.","exen":"If you want to save a large sum from your salary, a fixed installment savings account is good.","exru":"Если хотите накопить крупную сумму из зарплаты, лучше открыть регулярный накопительный вклад."}],"grammar":[{"g":"이나/밖에","ko":"산 지 1년[[밖에]] 안 됐는데 벌써 고장 난 거예요?","en":"It's only been a year since you bought it, and it's already broken?","ru":"Прошёл всего год с покупки, а он уже сломался?"},{"g":"이나/밖에","ko":"저는 하루에 커피를 다섯 잔[[이나]] 마셔요.","en":"I drink as many as five cups of coffee a day.","ru":"Я выпиваю целых пять чашек кофе в день."},{"g":"이나/밖에","ko":"이번 달에는 통신비가 27,000원[[밖에]] 안 나왔어요.","en":"This month the phone bill was only 27,000 won.","ru":"В этом месяце счёт за связь составил всего 27 000 вон."},{"g":"이나/밖에","ko":"12만 원[[이나]] 썼어요? 왜 그렇게 많이 썼어요?","en":"You spent as much as 120,000 won? Why did you spend so much?","ru":"Вы потратили целых 120 000 вон? Почему так много?"},{"g":"이나/밖에","ko":"이번 달 난방비가 29만 원[[이나]] 나왔어요.","en":"This month's heating bill came to as much as 290,000 won.","ru":"В этом месяце за отопление пришло целых 290 000 вон."},{"g":"이나/밖에","ko":"지하철역에서 친구를 한 시간[[이나]] 기다렸어요.","en":"I waited for my friend at the subway station for a whole hour.","ru":"Я ждал друга на станции метро целый час."},{"g":"이나/밖에","ko":"요즘 바빠서 한국어 공부를 두 시간[[밖에]] 못 해요.","en":"I'm busy these days, so I can only study Korean for two hours.","ru":"Сейчас я занят и могу заниматься корейским только два часа."},{"g":"이나/밖에","ko":"늦잠을 자서 바나나 한 개[[밖에]] 못 먹었어요.","en":"I overslept, so I only ate one banana.","ru":"Я проспал и успел съесть только один банан."},{"g":"이나/밖에","ko":"어제 생일 파티에 친구가 열 명[[이나]] 왔어요.","en":"As many as ten friends came to the birthday party yesterday.","ru":"Вчера на день рождения пришло целых десять друзей."},{"g":"이나/밖에","ko":"저는 동생이 한 명[[밖에]] 없어요.","en":"I have only one younger sibling.","ru":"У меня только один младший брат или сестра."},{"g":"-는다고 하다","ko":"물건을 사기 전에 인터넷으로 가격 비교를 하는 게 좋[[다고 해요]].","en":"They say it's good to compare prices online before buying things.","ru":"Говорят, перед покупкой лучше сравнить цены в интернете."},{"g":"-는다고 하다","ko":"중고 매장에 가면 필요한 물건을 싸게 살 수 있[[다고 해요]].","en":"They say you can buy what you need cheaply at a second-hand store.","ru":"Говорят, в комиссионном магазине можно дёшево купить нужные вещи."},{"g":"-는다고 하다","ko":"은행에서 매년 고객에게 선물을 주는데 이번에는 가계부[[라고 해요]].","en":"The bank gives customers a gift every year, and they say this time it's an account book.","ru":"Банк каждый год дарит клиентам подарки, и говорят, в этот раз это книга учёта расходов."},{"g":"-는다고 하다","ko":"오늘부터 항공권 할인 행사가 시작된[[다고 해요]].","en":"They say an airfare sale starts today.","ru":"Говорят, с сегодняшнего дня начинается распродажа авиабилетов."},{"g":"-는다고 하다","ko":"잠시드 씨가 직접 수리하면 비용을 아낄 수 있[[다고 해요]].","en":"Jamshid says you can save money if you repair it yourself.","ru":"Джамшид говорит, что если ремонтировать самому, можно сэкономить."},{"g":"-는다고 하다","ko":"옷을 따뜻하게 입는 게 난방비를 절약할 수 있는 방법이[[라고 해요]].","en":"They say dressing warmly is a way to save on heating.","ru":"Говорят, тёплая одежда помогает сэкономить на отоплении."},{"g":"-는다고 하다","ko":"성민이가 어제 아파서 학교에 못 갔[[다고 했어요]].","en":"Seongmin said he couldn't go to school yesterday because he was sick.","ru":"Сонмин сказал, что вчера не пошёл в школу, потому что заболел."},{"g":"-는다고 하다","ko":"이링 씨가 매일 뉴스에서 생활 정보를 듣[[는다고 했어요]].","en":"Yiling said she listens to everyday tips on the news every day.","ru":"Илин сказала, что каждый день слушает в новостях полезную бытовую информацию."},{"g":"-는다고 하다","ko":"이링 씨는 새 제품보다 중고 제품을 찾아서 구매한[[다고 했어요]].","en":"Yiling said she looks for used products rather than new ones.","ru":"Илин сказала, что ищет и покупает подержанные вещи, а не новые."},{"g":"-는다고 하다","ko":"후엔 씨는 살 것을 미리 메모하면 충동구매를 하지 않는[[다고 했어요]].","en":"Huyen said that if you write down what to buy in advance, you don't buy on impulse.","ru":"Хуен сказала, что если заранее записать покупки, то не будешь покупать импульсивно."}],"content":[{"q":"신문 기사는 무엇에 대해 설문 조사한 내용입니까?","qen":"What was the survey in the newspaper article about?","qru":"О чём был опрос в газетной статье?","t":"중고 육아용품 구입 경험에 대해 설문 조사했습니다.","en":"It surveyed people's experience of buying second-hand baby goods.","ru":"Это был опрос об опыте покупки подержанных детских товаров.","k":["중고","육아용품"]},{"q":"부모들이 중고 육아용품을 구입하는 가장 큰 이유는 무엇입니까?","qen":"What is the main reason parents buy second-hand baby goods?","qru":"Какова главная причина, по которой родители покупают подержанные детские товары?","t":"비용을 줄일 수 있어서입니다.","en":"Because they can reduce costs.","ru":"Потому что так можно сократить расходы.","k":["비용","줄일"]},{"q":"뉴스에서 주부 김미진 씨는 어떻게 소파를 저렴하게 샀습니까?","qen":"In the news, how did housewife Kim Mijin buy a sofa cheaply?","qru":"Как, по новостям, домохозяйка Ким Миджин дёшево купила диван?","t":"가구 매장에서 잠깐 전시한 가구를 사서 저렴하게 샀습니다.","en":"She bought furniture that had been briefly on display in a furniture store.","ru":"Она купила мебель, которая недолго стояла на витрине мебельного магазина.","k":["전시"]},{"q":"뉴스에 나온 20대 남자는 물건을 사기 전에 무엇을 합니까?","qen":"What does the man in his twenties in the news do before buying things?","qru":"Что делает мужчина двадцати с лишним лет из новостей перед покупкой?","t":"인터넷에서 가격을 비교해 봅니다.","en":"He compares prices online.","ru":"Он сравнивает цены в интернете.","k":["가격","비교"]},{"q":"적금은 무엇입니까?","qen":"What is an installment savings account (jeokgeum)?","qru":"Что такое накопительный вклад (чокгым)?","t":"일정 기간 동안 정해진 금액을 은행에 맡기는 것입니다.","en":"It is depositing a fixed amount at a bank over a set period.","ru":"Это когда в течение определённого срока вносят в банк установленную сумму.","k":["은행","맡기"]},{"q":"정기 적금과 자유 적금은 어떻게 다릅니까?","qen":"How do a fixed installment savings account and a free installment savings account differ?","qru":"Чем регулярный накопительный вклад отличается от свободного?","t":"정기 적금은 정해진 날짜에 정해진 금액을 넣고, 자유 적금은 넣고 싶을 때 넣고 싶은 금액을 넣습니다.","en":"With a fixed account you deposit a set amount on a set date; with a free account you deposit any amount whenever you want.","ru":"В регулярный вклад вносят установленную сумму в установленный день, а в свободный — любую сумму, когда захочется.","k":["정해진","넣고 싶은"]},{"q":"적금에 가입하려면 무엇을 가지고 은행에 가야 합니까?","qen":"What should you take to the bank to open an installment savings account?","qru":"Что нужно взять с собой в банк, чтобы открыть накопительный вклад?","t":"여권이나 외국인 등록증을 가지고 가야 합니다.","en":"You should take your passport or alien registration card.","ru":"Нужно взять паспорт или карту регистрации иностранца.","k":["여권","외국인 등록증"]}]},{"n":6,"vocab":[{"ko":"빌딩 숲","en":"forest of tall buildings","ru":"лес небоскрёбов","ex":"도심 속의 높은 건물들이 빌딩 숲을 만들었다.","exen":"The tall buildings downtown formed a forest of buildings.","exru":"Высокие здания в центре города образовали каменный лес."},{"ko":"산업 단지","en":"industrial complex","ru":"промышленная зона","ex":"여러 공장과 함께 산업 단지가 들어서기 시작했다.","exen":"An industrial complex began to appear along with many factories.","exru":"Вместе с множеством заводов начала появляться промышленная зона."},{"ko":"안전하다","en":"to be safe","ru":"быть безопасным","ex":"","exen":"","exru":""},{"ko":"소음이 심하다","en":"to be very noisy","ru":"сильно шуметь (о месте)","ex":"","exen":"","exru":""},{"ko":"공기가 탁하다","en":"the air is polluted","ru":"воздух грязный","ex":"도시는 공기가 탁해서 사람들의 건강에 안 좋다.","exen":"The city air is polluted, so it's bad for people's health.","exru":"В городе грязный воздух, и это вредно для здоровья."},{"ko":"산책로가 있다","en":"there is a walking trail","ru":"есть прогулочная дорожка","ex":"","exen":"","exru":""},{"ko":"거리가 깨끗하다","en":"the streets are clean","ru":"улицы чистые","ex":"","exen":"","exru":""},{"ko":"문화 시설이 많다","en":"there are many cultural facilities","ru":"много учреждений культуры","ex":"주변에 문화 시설이 없어서 영화관에 가는 것이 불편하다.","exen":"There are no cultural facilities nearby, so going to the cinema is inconvenient.","exru":"Поблизости нет учреждений культуры, поэтому ходить в кино неудобно."},{"ko":"걸어서 공원에 갈 수 있다","en":"you can walk to a park","ru":"можно дойти до парка пешком","ex":"아파트 후문으로 나가면 걸어서 공원에 갈 수 있어요.","exen":"If you go out the back gate of the apartment, you can walk to the park.","exru":"Если выйти через задние ворота дома, до парка можно дойти пешком."},{"ko":"논","en":"rice paddy","ru":"рисовое поле","ex":"","exen":"","exru":""},{"ko":"밭","en":"field (for vegetables or crops)","ru":"поле, огород","ex":"","exen":"","exru":""},{"ko":"과수원","en":"orchard","ru":"фруктовый сад","ex":"부모님은 농사도 지으시고 과수원도 하세요.","exen":"My parents farm and also run an orchard.","exru":"Мои родители занимаются земледелием и держат фруктовый сад."},{"ko":"비닐하우스","en":"plastic greenhouse","ru":"теплица (плёночная)","ex":"비닐하우스 재배 덕분에 계절과 상관없이 여러 가지 과일을 먹을 수 있다.","exen":"Thanks to greenhouse farming, we can eat many fruits regardless of the season.","exru":"Благодаря тепличному выращиванию можно есть разные фрукты в любое время года."},{"ko":"한적하다","en":"to be quiet and secluded","ru":"тихий, уединённый","ex":"저는 공기가 맑고 한적한 곳에서 살고 싶어요.","exen":"I want to live in a quiet place with clean air.","exru":"Я хочу жить в тихом месте с чистым воздухом."},{"ko":"공기가 맑다","en":"the air is clean","ru":"воздух чистый","ex":"","exen":"","exru":""},{"ko":"직접 농사를 짓다","en":"to farm by oneself","ru":"самому заниматься земледелием","ex":"","exen":"","exru":""},{"ko":"하천이 흐르다","en":"a stream flows","ru":"течёт река","ex":"우리 마을 근처에는 하천이 흐르고 있다.","exen":"A stream flows near our village.","exru":"Рядом с нашей деревней течёт река."},{"ko":"경치가 좋다","en":"the scenery is beautiful","ru":"красивый вид","ex":"시골이면 주변 경치가 좋겠네요.","exen":"If it's the countryside, the scenery must be nice.","exru":"Раз это деревня, там, наверное, красивые виды."},{"ko":"자연환경이 좋다","en":"the natural environment is good","ru":"хорошая природная среда","ex":"자연환경이 좋은 곳에서 살면 좋지요.","exen":"It's nice to live where the natural environment is good.","exru":"Хорошо жить там, где хорошая природа."},{"ko":"비명 소리","en":"scream","ru":"крик","ex":"저쪽에서 비명 소리가 들려요.","exen":"I can hear a scream from over there.","exru":"Оттуда слышен крик."},{"ko":"지역","en":"region, area","ru":"регион, район","ex":"강원 지역은 밤사이에 눈이 많이 쌓였어요.","exen":"A lot of snow piled up overnight in the Gangwon region.","exru":"За ночь в регионе Канвон выпало много снега."},{"ko":"범인","en":"criminal, culprit","ru":"преступник","ex":"3개월 만에 범인이 잡혔어요.","exen":"The culprit was caught after three months.","exru":"Спустя три месяца преступника поймали."},{"ko":"놀이터","en":"playground","ru":"детская площадка","ex":"105동 앞에 놀이터가 있어요.","exen":"There's a playground in front of Building 105.","exru":"Перед корпусом 105 есть детская площадка."},{"ko":"여쭤보다","en":"to ask (humble/honorific)","ru":"спрашивать (вежл.)","ex":"정말 감사합니다. 여쭤보길 잘했네요.","exen":"Thank you so much. I'm glad I asked.","exru":"Большое спасибо. Хорошо, что я спросил."},{"ko":"체육 센터","en":"sports center","ru":"спортивный центр","ex":"근처에 체육 센터가 있어요.","exen":"There's a sports center nearby.","exru":"Поблизости есть спортивный центр."},{"ko":"정문","en":"main gate","ru":"главный вход, главные ворота","ex":"","exen":"","exru":""},{"ko":"풍경화","en":"landscape painting","ru":"пейзаж (картина)","ex":"계절마다 바뀌는 풍경화!","exen":"A landscape painting that changes with every season!","exru":"Пейзаж, который меняется с каждым сезоном!"},{"ko":"풍경","en":"scenery, landscape","ru":"пейзаж, вид","ex":"한국에 있는 동안 한국의 풍경을 많이 보려고 합니다.","exen":"While I'm in Korea, I plan to see a lot of Korean scenery.","exru":"Пока я в Корее, хочу увидеть как можно больше корейских пейзажей."},{"ko":"자연 경관","en":"natural scenery","ru":"природный ландшафт","ex":"그림 같은 풍경과 최고의 자연 경관!","exen":"Picturesque views and the finest natural scenery!","exru":"Живописные виды и великолепный природный ландшафт!"},{"ko":"최고급","en":"top-class, luxury","ru":"высшего класса","ex":"","exen":"","exru":""},{"ko":"실크 로드","en":"the Silk Road","ru":"Шёлковый путь","ex":"사마르칸트는 실크 로드의 역사를 간직하고 있어서 유명합니다.","exen":"Samarkand is famous because it preserves the history of the Silk Road.","exru":"Самарканд знаменит тем, что хранит историю Шёлкового пути."},{"ko":"현장","en":"site, the actual place","ru":"место (событий)","ex":"실크 로드 역사의 현장으로 가는 시간 여행","exen":"A time trip to the historic sites of the Silk Road","exru":"Путешествие во времени к местам истории Шёлкового пути"},{"ko":"옛날","en":"the old days, the past","ru":"старые времена, прошлое","ex":"도시 곳곳에는 옛날 건축물이 많습니다.","exen":"There are many old buildings all over the city.","exru":"По всему городу много старинных зданий."},{"ko":"건축물","en":"building, structure","ru":"здание, сооружение","ex":"","exen":"","exru":""},{"ko":"간직하다","en":"to keep, preserve","ru":"хранить, сохранять","ex":"옛날 건축물을 간직하고 있는 역사의 도시에 여러분을 초대합니다.","exen":"We invite you to a historic city that preserves its old buildings.","exru":"Приглашаем вас в исторический город, сохранивший старинные здания."},{"ko":"평지","en":"flat land, plain","ru":"равнина","ex":"사마르칸트는 넓은 평지 위에 펼쳐진 도시입니다.","exen":"Samarkand is a city spread out on a wide plain.","exru":"Самарканд — город, раскинувшийся на широкой равнине."},{"ko":"펼쳐지다","en":"to spread out, unfold","ru":"раскидываться, простираться","ex":"넓은 평지 위에 펼쳐진 도시를 보실 수 있습니다.","exen":"You can see a city spread out on a wide plain.","exru":"Вы увидите город, раскинувшийся на широкой равнине."},{"ko":"언덕","en":"hill","ru":"холм","ex":"주변에 낮은 언덕이 있습니다.","exen":"There are low hills around it.","exru":"Вокруг есть невысокие холмы."},{"ko":"일정","en":"schedule, itinerary","ru":"расписание, программа поездки","ex":"","exen":"","exru":""},{"ko":"포함되다","en":"to be included","ru":"включаться","ex":"박물관 관람도 일정에 포함됩니다.","exen":"A museum visit is also included in the itinerary.","exru":"Посещение музея тоже включено в программу."},{"ko":"건조하다","en":"to be dry","ru":"сухой","ex":"건조한 날씨 때문에 언덕에 나무는 많지 않습니다.","exen":"Because of the dry weather, there aren't many trees on the hills.","exru":"Из-за сухой погоды на холмах мало деревьев."},{"ko":"염소","en":"goat","ru":"коза","ex":"언덕에서는 염소들이 풀을 먹습니다.","exen":"Goats eat grass on the hills.","exru":"На холмах козы щиплют траву."},{"ko":"풀","en":"grass","ru":"трава","ex":"","exen":"","exru":""},{"ko":"명당","en":"auspicious site (ideal place for a house)","ru":"благоприятное место (для дома)","ex":"집 뒤에 산이 있고 집 앞에 물이 흐르면 명당이라고 했다.","exen":"A place with a mountain behind the house and water flowing in front was called a myeongdang.","exru":"Место, где за домом гора, а перед домом течёт вода, называли мёндан."},{"ko":"남향집","en":"south-facing house","ru":"дом, обращённый на юг","ex":"이러한 전통은 현대까지 내려와 남향집이 인기가 있다.","exen":"This tradition has continued to modern times, so south-facing houses are popular.","exru":"Эта традиция дошла до наших дней, поэтому дома с южной ориентацией популярны."}],"grammar":[{"g":"피동","ko":"퇴근 시간이라서 길이 많이 [[막혔어요]].","en":"It was rush hour, so the roads were really jammed.","ru":"Был час пик, поэтому на дорогах были большие пробки."},{"g":"피동","ko":"자는 동안 모기한테 팔을 [[물려서]] 너무 가렵다.","en":"I got bitten on the arm by a mosquito while sleeping, and it's really itchy.","ru":"Пока я спал, меня укусил в руку комар, и теперь ужасно чешется."},{"g":"피동","ko":"친구와 전화를 하는 중에 갑자기 전화가 [[끊겼다]].","en":"While I was on the phone with a friend, the call suddenly got cut off.","ru":"Когда я разговаривал с другом, звонок внезапно оборвался."},{"g":"피동","ko":"와, 방 안에서 산이 [[보이네요]]?","en":"Wow, you can see the mountain from inside the room?","ru":"Ого, из комнаты видно гору?"},{"g":"피동","ko":"갑자기 엘리베이터가 [[흔들렸어요]].","en":"The elevator suddenly shook.","ru":"Лифт вдруг затрясся."},{"g":"피동","ko":"3개월 만에 범인이 [[잡혔어요]].","en":"The culprit was caught after three months.","ru":"Спустя три месяца преступник был пойман."},{"g":"피동","ko":"강원 지역은 밤사이에 눈이 많이 [[쌓였어요]].","en":"A lot of snow piled up overnight in the Gangwon region.","ru":"За ночь в регионе Канвон намело много снега."},{"g":"피동","ko":"지난달 유럽 시장에서 한국 자동차가 많이 [[팔렸어요]].","en":"Many Korean cars were sold in the European market last month.","ru":"В прошлом месяце на европейском рынке было продано много корейских автомобилей."},{"g":"피동","ko":"창문 밖으로 산이 [[보여서]] 경치가 정말 좋아요.","en":"You can see the mountain out the window, so the view is really nice.","ru":"Из окна видно гору, поэтому вид просто прекрасный."},{"g":"피동","ko":"아기가 엄마에게 [[안겼어요]].","en":"The baby was held in its mother's arms.","ru":"Малыш оказался на руках у мамы."},{"g":"피동","ko":"바람이 불어서 창문이 [[열렸어요]].","en":"The wind blew and the window opened.","ru":"Подул ветер, и окно открылось."},{"g":"-자고 하다","ko":"과장님이 내일 다시 회의하[[자고 하셨어요]].","en":"The manager suggested we meet again tomorrow.","ru":"Начальник отдела предложил завтра снова провести совещание."},{"g":"-자고 하다","ko":"친구가 만나[[자고 해서]] 약속 장소에 나갔다.","en":"My friend suggested we meet, so I went out to the meeting place.","ru":"Друг предложил встретиться, и я пошёл на место встречи."},{"g":"-자고 하다","ko":"아내가 같이 저녁을 먹[[자고 해서]] 기다리는 중이다.","en":"My wife suggested we have dinner together, so I'm waiting.","ru":"Жена предложила поужинать вместе, поэтому я жду."},{"g":"-자고 하다","ko":"남편이 직장 근처로 이사 가[[자고 해요]].","en":"My husband suggests we move near his workplace.","ru":"Муж предлагает переехать поближе к его работе."},{"g":"-자고 하다","ko":"라흐만 씨는 다 같이 노래방에 가[[자고 했어요]].","en":"Rahman suggested we all go to a karaoke room together.","ru":"Рахман предложил всем вместе пойти в караоке."},{"g":"-자고 하다","ko":"남자 친구가 내년에 꼭 결혼하[[자고 했어요]].","en":"My boyfriend said we should definitely get married next year.","ru":"Мой парень предложил обязательно пожениться в следующем году."},{"g":"-자고 하다","ko":"이링 씨가 한적하고 공기가 맑은 곳으로 이사를 가[[자고 했어요]].","en":"Yiling suggested moving to a quiet place with clean air.","ru":"Илин предложила переехать в тихое место с чистым воздухом."},{"g":"-자고 하다","ko":"사무실 안에서 음식을 먹지 말[[자고 했어요]].","en":"We agreed not to eat food inside the office.","ru":"Предложили не есть в офисе."},{"g":"-자고 하다","ko":"아이가 놀러 가[[자고 해서]] 그러는데 동네에 놀 만한 곳이 있나요?","en":"My child wants to go out and play, so is there a good place to play in the neighborhood?","ru":"Ребёнок просится погулять — есть ли в районе место, где можно поиграть?"}],"content":[{"q":"과장님은 주말에 무엇을 할 겁니까?","qen":"What is the manager going to do on the weekend?","qru":"Что начальник отдела будет делать на выходных?","t":"부모님 댁에 갈 겁니다.","en":"He is going to his parents' house.","ru":"Он поедет к родителям.","k":["부모님"]},{"q":"과장님의 부모님은 어떤 일을 하십니까?","qen":"What do the manager's parents do?","qru":"Чем занимаются родители начальника отдела?","t":"농사를 지으시고 과수원도 하십니다.","en":"They farm and also run an orchard.","ru":"Они занимаются земледелием и держат фруктовый сад.","k":["농사"]},{"q":"과장님은 퇴직하면 어디에서 살고 싶어 합니까?","qen":"Where does the manager want to live after he retires?","qru":"Где начальник отдела хочет жить после выхода на пенсию?","t":"시골에서 살고 싶어 합니다.","en":"He wants to live in the countryside.","ru":"Он хочет жить в деревне.","k":["시골"]},{"q":"사마르칸트에는 왜 나무가 많지 않습니까?","qen":"Why aren't there many trees in Samarkand?","qru":"Почему в Самарканде мало деревьев?","t":"건조한 날씨 때문에 나무가 많지 않습니다.","en":"Because of the dry weather, there aren't many trees.","ru":"Из-за сухой погоды деревьев там немного.","k":["건조"]},{"q":"사마르칸트는 무엇으로 유명합니까?","qen":"What is Samarkand famous for?","qru":"Чем знаменит Самарканд?","t":"실크 로드의 역사를 간직하고 있어서 유명합니다.","en":"It is famous because it preserves the history of the Silk Road.","ru":"Он знаменит тем, что хранит историю Шёлкового пути.","k":["실크 로드"]},{"q":"과거에 한국에서는 어떤 곳을 명당이라고 했습니까?","qen":"In the past, what kind of place was called a myeongdang in Korea?","qru":"Какое место в прошлом в Корее называли мёндан?","t":"집 뒤에 산이 있고 집 앞에 물이 흐르는 곳을 명당이라고 했습니다.","en":"A place with a mountain behind the house and water flowing in front was called a myeongdang.","ru":"Мёнданом называли место, где за домом гора, а перед домом течёт вода.","k":["산","물"]},{"q":"한국 사람들은 왜 남향집을 좋아했습니까?","qen":"Why did Koreans like south-facing houses?","qru":"Почему корейцы любили дома, обращённые на юг?","t":"겨울이 길고 추워서 활동 공간이 남쪽을 향해 있으면 생활이 편리하기 때문입니다.","en":"Because winters are long and cold, life is more convenient when the living space faces south.","ru":"Потому что зима долгая и холодная, и жить удобнее, когда жилые помещения обращены на юг.","k":["남쪽"]},{"q":"최근에는 좋은 집의 조건에 무엇이 추가되었습니까?","qen":"What has recently been added to the conditions for a good house?","qru":"Что недавно добавилось к условиям хорошего дома?","t":"학군과 교통이 추가되었습니다.","en":"School district and transportation have been added.","ru":"Добавились школьный округ и транспорт.","k":["학군","교통"]}]},{"n":7,"vocab":[{"ko":"공연","en":"performance, show","ru":"выступление, спектакль","ex":"곧 공연이 시작됩니다.","exen":"The performance will begin soon.","exru":"Скоро начнётся представление."},{"ko":"뮤지컬","en":"musical","ru":"мюзикл","ex":"배우들이 무대에서 노래하고 연기도 하는 뮤지컬을 관람하고 싶다.","exen":"I want to see a musical where actors sing and act on stage.","exru":"Хочу посмотреть мюзикл, где актёры поют и играют на сцене."},{"ko":"연극","en":"play (theater)","ru":"пьеса, спектакль","ex":"오늘 본 연극 어땠어요?","exen":"How was the play we saw today?","exru":"Как вам спектакль, который мы сегодня смотрели?"},{"ko":"연주회","en":"recital, instrumental concert","ru":"концерт (инструментальный)","ex":"친구와 함께 오랜만에 피아노 연주회를 다녀왔다.","exen":"I went to a piano recital with a friend for the first time in a while.","exru":"Впервые за долгое время я сходил с другом на фортепианный концерт."},{"ko":"난타","en":"Nanta (non-verbal percussion show)","ru":"«Нанта» (шоу без слов с ударными)","ex":"저는 난타 공연을 보는 게 처음이에요.","exen":"This is my first time seeing the Nanta show.","exru":"Я впервые смотрю шоу «Нанта»."},{"ko":"사물놀이","en":"samulnori (traditional four-instrument percussion)","ru":"самульнори (традиционный ансамбль из четырёх ударных)","ex":"한국의 전통 악기로 연주하는 사물놀이를 볼 것이다.","exen":"I'm going to see samulnori, played on Korean traditional instruments.","exru":"Я пойду смотреть самульнори — игру на корейских традиционных инструментах."},{"ko":"길거리 공연","en":"street performance","ru":"уличное выступление","ex":"","exen":"","exru":""},{"ko":"버스킹","en":"busking","ru":"баскинг, уличное выступление","ex":"","exen":"","exru":""},{"ko":"전시회","en":"exhibition","ru":"выставка","ex":"저는 학생들의 미술 전시회에 가 봤어요.","exen":"I went to a student art exhibition.","exru":"Я ходил на выставку студенческих работ."},{"ko":"미술","en":"fine art","ru":"изобразительное искусство","ex":"","exen":"","exru":""},{"ko":"사진","en":"photograph, photography","ru":"фотография","ex":"서울 역사 박물관에서는 서울의 옛날 사진 전시회가 열리고 있다.","exen":"An exhibition of old photos of Seoul is being held at the Seoul Museum of History.","exru":"В Музее истории Сеула проходит выставка старых фотографий города."},{"ko":"공예","en":"crafts","ru":"ремёсла, прикладное искусство","ex":"","exen":"","exru":""},{"ko":"콘서트","en":"concert","ru":"концерт","ex":"","exen":"","exru":""},{"ko":"케이팝(K-pop)","en":"K-pop","ru":"кей-поп","ex":"친구가 저에게 케이팝을 좋아하냐고 했어요.","exen":"My friend asked me if I like K-pop.","exru":"Друг спросил меня, люблю ли я кей-поп."},{"ko":"재즈(Jazz) 콘서트","en":"jazz concert","ru":"джазовый концерт","ex":"이번 달에는 재즈 콘서트 티켓을 예매했다.","exen":"This month I booked a ticket for a jazz concert.","exru":"В этом месяце я заранее купил билет на джазовый концерт."},{"ko":"토크 콘서트","en":"talk concert (talk show event)","ru":"ток-концерт","ex":"","exen":"","exru":""},{"ko":"강연","en":"lecture, talk","ru":"лекция, выступление","ex":"","exen":"","exru":""},{"ko":"정보를 검색하다","en":"to search for information","ru":"искать информацию","ex":"그 배우에 대해 더 알고 싶어서 인터넷에서 정보를 검색했다.","exen":"I wanted to know more about that actor, so I searched online.","exru":"Я хотел больше узнать об этом актёре и поискал информацию в интернете."},{"ko":"예매하다","en":"to buy tickets in advance","ru":"покупать билеты заранее","ex":"사진 전시회를 보려면 미리 티켓을 예매해야 한다.","exen":"To see the photo exhibition, you must buy tickets in advance.","exru":"Чтобы попасть на фотовыставку, нужно заранее купить билеты."},{"ko":"수령하다","en":"to receive, pick up","ru":"получать","ex":"","exen":"","exru":""},{"ko":"좌석","en":"seat","ru":"место (в зале)","ex":"","exen":"","exru":""},{"ko":"찾다","en":"to find (e.g. one's seat)","ru":"находить (например, своё место)","ex":"","exen":"","exru":""},{"ko":"관람하다","en":"to watch, view (a show)","ru":"смотреть (спектакль, выставку)","ex":"지난 주말에 뮤지컬 '오페라의 유령'을 관람했습니다.","exen":"Last weekend I saw the musical 'The Phantom of the Opera'.","exru":"В прошлые выходные я посмотрел мюзикл «Призрак оперы»."},{"ko":"감상 소감","en":"impressions (after seeing something)","ru":"впечатления от просмотра","ex":"","exen":"","exru":""},{"ko":"기대하다","en":"to look forward to, expect","ru":"с нетерпением ждать, ожидать","ex":"고천 씨가 기대하는 것만큼 재미있으면 좋겠어요.","exen":"I hope it's as fun as you're expecting, Gaocheng.","exru":"Надеюсь, будет так же интересно, как вы ожидаете, Гаочэн."},{"ko":"기대되다","en":"to be looked forward to","ru":"вызывать ожидание","ex":"공연이 기대돼요.","exen":"I'm looking forward to the show.","exru":"Жду не дождусь спектакля."},{"ko":"감동적이다","en":"to be moving, touching","ru":"трогательный","ex":"배우분들의 노래와 연기가 정말 감동적이었어요.","exen":"The actors' singing and acting were really moving.","exru":"Пение и игра актёров были очень трогательными."},{"ko":"인상적이다","en":"to be impressive, memorable","ru":"впечатляющий","ex":"어떤 장면이 가장 인상적이었어요?","exen":"Which scene was the most memorable?","exru":"Какая сцена произвела на вас самое сильное впечатление?"},{"ko":"안내 방송","en":"announcement (over the PA)","ru":"объявление (по громкой связи)","ex":"지금 안내 방송에서 뭐라고 했어요?","exen":"What did the announcement just say?","exru":"Что сейчас сказали в объявлении?"},{"ko":"전원을 끄다","en":"to turn off the power","ru":"выключить (питание)","ex":"휴대 전화의 전원을 모두 꺼 주시기 바랍니다.","exen":"Please turn off all mobile phones.","exru":"Просим всех выключить мобильные телефоны."},{"ko":"입장하다","en":"to enter (a venue)","ru":"входить (в зал)","ex":"직원이 관객들에게 지금 공연장에 입장하라고 했어요.","exen":"The staff told the audience to enter the hall now.","exru":"Сотрудник сказал зрителям сейчас проходить в зал."},{"ko":"택배","en":"parcel delivery, package","ru":"посылка, курьерская доставка","ex":"택배는 문 앞에 놓아 주세요.","exen":"Please leave the package in front of the door.","exru":"Оставьте посылку у двери, пожалуйста."},{"ko":"참석하다","en":"to attend","ru":"присутствовать, участвовать","ex":"내일 회의가 있으니까 모두 참석하세요.","exen":"There's a meeting tomorrow, so everyone please attend.","exru":"Завтра совещание, поэтому, пожалуйста, приходите все."},{"ko":"유창하다","en":"to be fluent","ru":"беглый (о речи)","ex":"미호 씨는 한국 사람만큼 한국어가 유창해요.","exen":"Miho speaks Korean as fluently as a Korean.","exru":"Михо говорит по-корейски так же бегло, как кореец."},{"ko":"작가","en":"artist, author","ru":"автор, художник","ex":"프로 작가의 미술 전시회만큼 아주 멋있었어요.","exen":"It was as wonderful as a professional artist's exhibition.","exru":"Было так же здорово, как на выставке профессионального художника."},{"ko":"장면","en":"scene","ru":"сцена (эпизод)","ex":"마지막에 배우들이 모두 같이 춤추는 장면이 기억에 남아요.","exen":"The scene at the end where all the actors dance together stays in my memory.","exru":"Мне запомнилась сцена в конце, где все актёры танцуют вместе."},{"ko":"표정","en":"facial expression","ru":"выражение лица","ex":"저는 배우들의 표정까지 다 볼 수 있어서 좋았어요.","exen":"I liked that I could see even the actors' facial expressions.","exru":"Мне понравилось, что было видно даже выражения лиц актёров."},{"ko":"헤어지다","en":"to be separated, part","ru":"расставаться","ex":"주인공이 헤어진 가족을 찾는 장면이 감동적이었어요.","exen":"The scene where the hero finds his separated family was moving.","exru":"Сцена, где главный герой находит потерянную семью, была трогательной."},{"ko":"추천하다","en":"to recommend","ru":"рекомендовать","ex":"제 친구가 이 연극을 추천할 때 꼭 앞좌석에서 보라고 했거든요.","exen":"When my friend recommended this play, he told me to sit in the front seats.","exru":"Друг, советуя этот спектакль, сказал обязательно сесть в первых рядах."},{"ko":"입장권","en":"admission ticket","ru":"входной билет","ex":"공연 입장권을 보여 주세요.","exen":"Please show your ticket for the performance.","exru":"Покажите, пожалуйста, билет на спектакль."},{"ko":"초대권","en":"complimentary ticket, invitation ticket","ru":"пригласительный билет","ex":"초대권이 한 장 더 있는데 같이 가고 싶은 친구 있어요?","exen":"I have one more complimentary ticket. Is there a friend you'd like to bring?","exru":"У меня есть ещё один пригласительный. Хотите позвать кого-нибудь из друзей?"},{"ko":"예약 번호","en":"reservation number","ru":"номер бронирования","ex":"티켓 예매를 취소하려면 예약 번호를 알아야 한다.","exen":"To cancel a ticket booking, you need to know the reservation number.","exru":"Чтобы отменить бронь билета, нужно знать номер бронирования."},{"ko":"할인","en":"discount","ru":"скидка","ex":"오후 4시 이후 입장 시에는 관람료가 20% 할인됩니다.","exen":"Admission after 4 p.m. is discounted by 20%.","exru":"При входе после 16:00 на билет действует скидка 20%."},{"ko":"연령","en":"age","ru":"возраст","ex":"이 연극의 관람 연령은 만 7세 이상이다.","exen":"This play is for ages 7 and up.","exru":"Этот спектакль предназначен для зрителей от 7 лет."},{"ko":"유의 사항","en":"notes, things to keep in mind","ru":"примечания, важная информация","ex":"","exen":"","exru":""},{"ko":"무료","en":"free of charge","ru":"бесплатно","ex":"요즘 무료 공연도 괜찮네요.","exen":"Free performances are pretty good these days.","exru":"Сейчас и бесплатные концерты неплохие."},{"ko":"부담이 없다","en":"to be no burden, easy on the wallet","ru":"не обременительно","ex":"그래서 부담 없이 문화생활을 즐길 수 있다.","exen":"So you can enjoy cultural activities without the burden.","exru":"Поэтому можно наслаждаться культурной жизнью без лишних затрат."},{"ko":"할인을 받다","en":"to get a discount","ru":"получать скидку","ex":"이 연극을 인터넷으로 예매하면 할인을 받을 수 있다.","exen":"If you book this play online, you can get a discount.","exru":"Если забронировать этот спектакль через интернет, можно получить скидку."},{"ko":"행사","en":"event","ru":"мероприятие","ex":"박물관에도 재미있는 행사가 많다.","exen":"Museums also have many interesting events.","exru":"В музеях тоже много интересных мероприятий."},{"ko":"박물관","en":"museum","ru":"музей","ex":"다음 달에는 박물관에 가 보고 싶다.","exen":"Next month I want to go to a museum.","exru":"В следующем месяце хочу сходить в музей."},{"ko":"경험이 쌓이다","en":"experience builds up","ru":"накапливается опыт","ex":"경험이 쌓이는 것만큼 한국 생활에도 점점 익숙해지고 있다.","exen":"As my experience builds up, I'm getting more used to life in Korea.","exru":"По мере того как растёт опыт, я всё больше привыкаю к жизни в Корее."},{"ko":"무대","en":"stage","ru":"сцена (подмостки)","ex":"이번만큼 무대 가까이에서 연극을 본 적이 없어요.","exen":"I've never watched a play as close to the stage as this time.","exru":"Я никогда ещё не смотрел спектакль так близко к сцене, как в этот раз."},{"ko":"앞좌석","en":"front seats","ru":"места в первых рядах","ex":"앞좌석에 앉아 있어요.","exen":"I'm sitting in the front seats.","exru":"Я сижу в первых рядах."}],"grammar":[{"g":"-으라고 하다, -냐고 하다","ko":"한국 친구들이 처음 만나면 한국어를 얼마나 공부했[[냐고 해요]].","en":"When Korean friends first meet me, they ask how long I've studied Korean.","ru":"При первой встрече корейские друзья спрашивают, сколько я учил корейский."},{"g":"-으라고 하다, -냐고 하다","ko":"친구가 저에게 케이팝을 좋아하[[냐고 했어요]].","en":"My friend asked me if I like K-pop.","ru":"Друг спросил меня, люблю ли я кей-поп."},{"g":"-으라고 하다, -냐고 하다","ko":"직원이 관객들에게 지금 공연장에 입장하[[라고 했어요]].","en":"The staff told the audience to enter the hall now.","ru":"Сотрудник сказал зрителям сейчас проходить в зал."},{"g":"-으라고 하다, -냐고 하다","ko":"곧 공연이 시작되니까 휴대 전화를 끄[[라고 했어요]].","en":"They said to turn off your phones because the show is about to start.","ru":"Сказали выключить телефоны, потому что спектакль скоро начнётся."},{"g":"-으라고 하다, -냐고 하다","ko":"라민 씨가 공연이 몇 시에 시작하[[냐고 했어요]].","en":"Ramin asked what time the performance starts.","ru":"Рамин спросил, во сколько начинается спектакль."},{"g":"-으라고 하다, -냐고 하다","ko":"부모님께서 저한테 자주 연락하[[라고 해요]].","en":"My parents tell me to keep in touch often.","ru":"Родители говорят мне почаще выходить на связь."},{"g":"-으라고 하다, -냐고 하다","ko":"고향 친구가 저한테 고향에 언제 오[[냐고 해요]].","en":"My friend back home asks me when I'm coming home.","ru":"Друг с родины спрашивает меня, когда я приеду домой."},{"g":"-으라고 하다, -냐고 하다","ko":"선생님께서 수업에 늦지 말[[라고 하셨어요]].","en":"The teacher told us not to be late for class.","ru":"Учитель сказал не опаздывать на урок."},{"g":"-으라고 하다, -냐고 하다","ko":"엄마가 집에 올 때 우유를 사 오[[라고 하셨어]].","en":"Mom told me to buy milk on the way home.","ru":"Мама сказала купить молока по дороге домой."},{"g":"-으라고 하다, -냐고 하다","ko":"잠시드 씨가 밖에 비가 오[[냐고]] 물어봤어요.","en":"Jamshid asked whether it's raining outside.","ru":"Джамшид спросил, идёт ли на улице дождь."},{"g":"-으라고 하다, -냐고 하다","ko":"제 친구가 이 연극을 추천할 때 꼭 앞좌석에서 보[[라고 했거든요]].","en":"When my friend recommended this play, he told me to watch it from the front seats.","ru":"Друг, советуя этот спектакль, сказал обязательно смотреть с первых рядов."},{"g":"만큼","ko":"잘 찾아보면 무료 공연도 유료 공연[[만큼]] 좋은 게 많아요.","en":"If you look carefully, many free shows are as good as paid ones.","ru":"Если хорошо поискать, среди бесплатных концертов много таких же хороших, как платные."},{"g":"만큼","ko":"회사 앞 식당은 고향 음식[[만큼]] 맛있어서 자주 간다.","en":"The restaurant in front of the office is as tasty as food from home, so I go often.","ru":"Ресторан напротив офиса такой же вкусный, как еда на родине, поэтому я часто туда хожу."},{"g":"만큼","ko":"평일은 주말[[만큼]] 시내에 사람이 많지 않다.","en":"On weekdays, downtown isn't as crowded as on weekends.","ru":"В будни в центре не так многолюдно, как в выходные."},{"g":"만큼","ko":"저번에 본 영화[[만큼]] 아주 재미있었어요.","en":"It was as much fun as the movie we saw last time.","ru":"Было так же интересно, как фильм, который мы смотрели в прошлый раз."},{"g":"만큼","ko":"안젤라 씨는 가수[[만큼]] 노래를 잘해요.","en":"Angela sings as well as a singer.","ru":"Анжела поёт так же хорошо, как певица."},{"g":"만큼","ko":"하노이도 겨울에 서울[[만큼]] 추워요.","en":"Hanoi is also as cold as Seoul in winter.","ru":"В Ханое зимой так же холодно, как в Сеуле."},{"g":"만큼","ko":"민수 씨는 아내[[만큼]] 요리를 잘해요.","en":"Minsu cooks as well as his wife.","ru":"Минсу готовит так же хорошо, как его жена."},{"g":"만큼","ko":"방이 손바닥[[만큼]] 작아요.","en":"The room is as small as the palm of a hand.","ru":"Комната крошечная, с ладонь."},{"g":"만큼","ko":"그 사람의 마음이 바다[[만큼]] 넓어요.","en":"That person's heart is as big as the sea.","ru":"У этого человека душа широкая, как море."},{"g":"만큼","ko":"한국어를 공부한 지 1년 되었는데 아직 한국인[[만큼]] 잘하지 못해요.","en":"I've studied Korean for a year, but I'm not as good as a Korean yet.","ru":"Я учу корейский год, но пока говорю не так хорошо, как корейцы."}],"content":[{"q":"고천 씨와 후엔 씨는 무슨 공연을 보려고 합니까?","qen":"What performance are Gaocheng and Huyen going to see?","qru":"Какое представление собираются смотреть Гаочэн и Хуен?","t":"난타 공연을 보려고 합니다.","en":"They are going to see the Nanta show.","ru":"Они собираются смотреть шоу «Нанта».","k":["난타"]},{"q":"고천 씨는 친한 친구에게 무엇을 물어볼 겁니까?","qen":"What is Gaocheng going to ask her close friend?","qru":"О чём Гаочэн собирается спросить близкую подругу?","t":"공연에 올 수 있냐고 물어볼 겁니다.","en":"She's going to ask whether her friend can come to the show.","ru":"Она спросит, сможет ли подруга прийти на представление.","k":["올 수 있냐고"]},{"q":"'문화가 있는 날'은 언제입니까?","qen":"When is 'Culture Day' (Munhwa-ga inneun nal)?","qru":"Когда проходит «День культуры»?","t":"매월 마지막 주 수요일입니다.","en":"It's the Wednesday of the last week of every month.","ru":"В среду последней недели каждого месяца.","k":["마지막 주","수요일"]},{"q":"'문화가 있는 날'에 전시회나 공연을 보면 좋은 점은 무엇입니까?","qen":"What is good about seeing exhibitions or shows on 'Culture Day'?","qru":"Чем хорошо ходить на выставки и спектакли в «День культуры»?","t":"보통 때보다 싼 가격이나 무료로 문화생활을 할 수 있습니다.","en":"You can enjoy cultural activities at lower prices than usual or for free.","ru":"Можно приобщиться к культуре дешевле обычного или бесплатно.","k":["무료"]},{"q":"글쓴이는 이번 달 '문화가 있는 날'에 무엇을 예매했습니까?","qen":"What did the writer book for this month's 'Culture Day'?","qru":"Что автор забронировал на «День культуры» в этом месяце?","t":"재즈 콘서트 티켓을 50% 할인을 받아서 예매했습니다.","en":"The writer booked a jazz concert ticket at a 50% discount.","ru":"Автор забронировал билет на джазовый концерт со скидкой 50%.","k":["재즈 콘서트"]},{"q":"'문화포털'에서는 어떤 정보를 제공합니까?","qen":"What information does 'Culture Portal' provide?","qru":"Какую информацию предоставляет «Культурный портал»?","t":"공연, 전시, 콘서트 정보와 국내외 문화 관련 영상, 도서 정보를 제공합니다.","en":"It provides information on shows, exhibitions and concerts, plus domestic and international culture videos and book information.","ru":"Он даёт информацию о спектаклях, выставках и концертах, а также видео о культуре в Корее и за рубежом и сведения о книгах.","k":["공연","전시"]},{"q":"'문화포털'의 공연 후기는 어떤 점에서 도움이 됩니까?","qen":"How are the performance reviews on 'Culture Portal' helpful?","qru":"Чем полезны отзывы о спектаклях на «Культурном портале»?","t":"어떤 공연을 볼지 선택할 때 참고가 됩니다.","en":"They help as a reference when choosing which show to see.","ru":"Они помогают при выборе, какой спектакль посмотреть.","k":["선택","참고"]}]},{"n":8,"vocab":[{"ko":"고추장","en":"red chili pepper paste (gochujang)","ru":"острая перцовая паста кочхуджан","ex":"","exen":"","exru":""},{"ko":"간장","en":"soy sauce","ru":"соевый соус","ex":"저는 간장 양념된 고기를 좋아하거든요.","exen":"I like meat marinated in soy sauce.","exru":"Я люблю мясо в соевом маринаде."},{"ko":"된장","en":"soybean paste (doenjang)","ru":"соевая паста твенджан","ex":"","exen":"","exru":""},{"ko":"참기름","en":"sesame oil","ru":"кунжутное масло","ex":"참기름을 조금 뿌리면 더 맛있게 즐길 수 있습니다.","exen":"If you sprinkle on a little sesame oil, you can enjoy it even more.","exru":"Если сбрызнуть немного кунжутным маслом, будет ещё вкуснее."},{"ko":"식초","en":"vinegar","ru":"уксус","ex":"","exen":"","exru":""},{"ko":"고춧가루","en":"red chili pepper powder","ru":"молотый красный перец","ex":"","exen":"","exru":""},{"ko":"깨","en":"sesame seeds","ru":"кунжут","ex":"참기름, 깨를 뿌린다.","exen":"Sprinkle on sesame oil and sesame seeds.","exru":"Посыпать кунжутом и сбрызнуть кунжутным маслом."},{"ko":"후추","en":"black pepper","ru":"чёрный перец","ex":"완성된 볶음밥 위에 후추를 뿌려서 맛을 더했다.","exen":"I sprinkled pepper over the finished fried rice to add flavor.","exru":"Я посыпал готовый жареный рис перцем для вкуса."},{"ko":"당근을 씻다","en":"to wash carrots","ru":"мыть морковь","ex":"","exen":"","exru":""},{"ko":"양파 껍질을 벗기다","en":"to peel an onion","ru":"очищать лук от шелухи","ex":"제이슨 씨가 양파 껍질을 벗겨요.","exen":"Jason is peeling an onion.","exru":"Джейсон чистит лук."},{"ko":"감자를 칼로 썰다","en":"to cut potatoes with a knife","ru":"резать картофель ножом","ex":"","exen":"","exru":""},{"ko":"마늘을 다지다","en":"to mince garlic","ru":"измельчать чеснок","ex":"간장에 고춧가루, 참기름, 다진 마늘을 넣고 양념을 만들었다.","exen":"I made a sauce by adding chili powder, sesame oil and minced garlic to soy sauce.","exru":"Я сделал соус, добавив в соевый соус молотый перец, кунжутное масло и измельчённый чеснок."},{"ko":"물을 끓이다","en":"to boil water","ru":"кипятить воду","ex":"그럼 제가 물을 끓일게요.","exen":"Then I'll boil the water.","exru":"Тогда я вскипячу воду."},{"ko":"기름에 튀기다","en":"to deep-fry in oil","ru":"жарить во фритюре","ex":"소화가 안 될 때는 기름에 튀긴 음식을 피해야 한다.","exen":"When you have indigestion, you should avoid deep-fried food.","exru":"При плохом пищеварении нужно избегать жареной во фритюре еды."},{"ko":"만두를 찌다","en":"to steam dumplings","ru":"готовить пельмени на пару","ex":"어머니께서는 구운 만두보다는 찐 만두를 더 좋아하신다.","exen":"My mother prefers steamed dumplings to fried ones.","exru":"Мама больше любит пельмени на пару, чем жареные."},{"ko":"계란을 삶다","en":"to boil eggs","ru":"варить яйца","ex":"계란을 뜨거운 물에 너무 오래 삶으면 껍질이 터진다.","exen":"If you boil eggs in hot water too long, the shells crack.","exru":"Если слишком долго варить яйца, скорлупа лопается."},{"ko":"밥을 볶다","en":"to stir-fry rice","ru":"жарить рис","ex":"","exen":"","exru":""},{"ko":"나물을 무치다","en":"to season vegetables (namul) by mixing","ru":"заправлять зелень (намуль)","ex":"새콤한 양념에 무친 나물 반찬이 입맛에 맞았다.","exen":"The namul side dish mixed with a tangy sauce suited my taste.","exru":"Закуска из зелени с кисловатой заправкой пришлась мне по вкусу."},{"ko":"고기를 굽다","en":"to grill meat","ru":"жарить мясо (на гриле)","ex":"","exen":"","exru":""},{"ko":"시금치를 데치다","en":"to blanch spinach","ru":"бланшировать шпинат","ex":"","exen":"","exru":""},{"ko":"토끼","en":"rabbit","ru":"кролик","ex":"성민이 토끼한테 당근을 먹이고 있어요.","exen":"Seongmin is feeding carrots to the rabbit.","exru":"Сонмин кормит кролика морковкой."},{"ko":"유모차","en":"baby stroller","ru":"детская коляска","ex":"엄마가 아기를 유모차에 태워요.","exen":"The mother puts the baby in the stroller.","exru":"Мама сажает малыша в коляску."},{"ko":"냉동실","en":"freezer","ru":"морозильная камера","ex":"냉동실에 넣어서 얼리세요.","exen":"Put it in the freezer to freeze it.","exru":"Положите в морозилку и заморозьте."},{"ko":"죽","en":"rice porridge","ru":"рисовая каша (чук)","ex":"소화가 잘 되는 야채죽은 어때요?","exen":"How about vegetable porridge, which is easy to digest?","exru":"Как насчёт овощной каши? Она легко усваивается."},{"ko":"익다","en":"to be cooked, to ripen","ru":"свариться, приготовиться; созреть","ex":"큰 채소가 익을 때까지 끓이면 돼요.","exen":"Just boil it until the big vegetables are cooked.","exru":"Варите, пока крупные овощи не сварятся."},{"ko":"믹서기","en":"blender","ru":"блендер","ex":"채소를 씻어 삶은 다음 믹서기에 넣고 갈아요.","exen":"Wash and boil the vegetables, then grind them in the blender.","exru":"Овощи моют, отваривают, а потом измельчают в блендере."},{"ko":"환자","en":"patient, sick person","ru":"больной, пациент","ex":"의사가 환자를 살렸어요.","exen":"The doctor saved the patient.","exru":"Врач спас пациента."},{"ko":"이유식","en":"baby food (weaning food)","ru":"детский прикорм","ex":"","exen":"","exru":""},{"ko":"뷔페","en":"buffet","ru":"шведский стол","ex":"회사 앞에 새로 생긴 고기 뷔페에서 회식을 했어요.","exen":"We had our company dinner at the new meat buffet in front of the office.","exru":"Мы устроили корпоративный ужин в новом мясном ресторане со шведским столом напротив офиса."},{"ko":"군침이 돌다","en":"one's mouth waters","ru":"слюнки текут","ex":"생각만 해도 군침이 도네요.","exen":"Just thinking about it makes my mouth water.","exru":"От одной мысли слюнки текут."},{"ko":"뿌리다","en":"to sprinkle","ru":"посыпать, сбрызгивать","ex":"참기름을 조금 뿌리세요.","exen":"Sprinkle on a little sesame oil.","exru":"Сбрызните немного кунжутным маслом."},{"ko":"채를 썰다","en":"to julienne (cut into thin strips)","ru":"нарезать соломкой","ex":"잡채에 넣을 여러 가지 야채를 가늘게 채를 썰었다.","exen":"I cut various vegetables for japchae into thin strips.","exru":"Я нарезал тонкой соломкой разные овощи для чапчхэ."},{"ko":"얇게 썰다","en":"to slice thinly","ru":"тонко нарезать","ex":"김치와 양파는 얇게 썰어 준비하세요.","exen":"Slice the kimchi and onion thinly.","exru":"Тонко нарежьте кимчи и лук."},{"ko":"깍둑썰다","en":"to dice, cut into cubes","ru":"нарезать кубиками","ex":"양파, 당근은 작게 깍둑썰기를 한다.","exen":"Dice the onion and carrot into small cubes.","exru":"Лук и морковь нарезать мелкими кубиками."},{"ko":"절이다","en":"to pickle, cure (in salt, sugar, etc.)","ru":"засаливать, мариновать","ex":"레몬을 설탕에 절여서 차로 만들어 마시면 목감기에 좋다.","exen":"Lemon preserved in sugar and made into tea is good for a sore throat.","exru":"Лимон, засахаренный и заваренный как чай, помогает при простуженном горле."},{"ko":"담다","en":"to put into (a container), to serve","ru":"класть (в посуду)","ex":"완성되면 그릇에 담으세요.","exen":"When it's done, put it in a bowl.","exru":"Когда будет готово, выложите в миску."},{"ko":"간을 맞추다","en":"to season to taste","ru":"доводить до вкуса (солью, соусом)","ex":"국이 싱거워서 간장을 넣어 간을 맞췄다.","exen":"The soup was bland, so I added soy sauce to season it.","exru":"Суп был пресным, и я добавил соевый соус по вкусу."},{"ko":"양을 맞추다","en":"to match the quantity","ru":"соблюдать пропорции","ex":"준비된 재료의 양에 맞춰 부침 가루를 넣으세요.","exen":"Add pancake mix to match the amount of prepared ingredients.","exru":"Добавьте смесь для оладий в соответствии с количеством ингредиентов."},{"ko":"시간을 맞추다","en":"to time (something) correctly","ru":"рассчитывать время","ex":"","exen":"","exru":""},{"ko":"부침 가루","en":"Korean pancake mix","ru":"смесь для корейских оладий","ex":"","exen":"","exru":""},{"ko":"부치다","en":"to pan-fry (pancakes)","ru":"жарить (оладьи, лепёшки)","ex":"프라이팬에 부치고 접시에 예쁘게 담으세요.","exen":"Fry it in a pan and arrange it nicely on a plate.","exru":"Обжарьте на сковороде и красиво выложите на тарелку."},{"ko":"둘이 먹다가 하나가 죽어도 모르다","en":"so delicious you wouldn't notice if your companion died (idiom: extremely tasty)","ru":"так вкусно, что не заметишь, если сосед по столу умрёт (идиома: очень вкусно)","ex":"둘이 먹다가 하나가 죽어도 모르는 김치볶음밥!","exen":"Kimchi fried rice so good you wouldn't notice if your companion died!","exru":"Жареный рис с кимчи — пальчики оближешь!"},{"ko":"식용유를 두르다","en":"to coat (a pan) with cooking oil","ru":"смазать (сковороду) растительным маслом","ex":"프라이팬에 식용유를 두르고 돼지고기를 먼저 볶는다.","exen":"Coat the pan with oil and stir-fry the pork first.","exru":"Смажьте сковороду маслом и сначала обжарьте свинину."},{"ko":"유통 기한","en":"sell-by date","ru":"срок реализации","ex":"","exen":"","exru":""},{"ko":"소비 기한","en":"use-by date","ru":"срок годности (употребления)","ex":"","exen":"","exru":""}],"grammar":[{"g":"사동①","ko":"날씨가 좀 추우니까 옷을 따뜻하게 [[입히세요]].","en":"It's a bit cold, so dress the baby warmly.","ru":"На улице прохладно, оденьте малыша потеплее."},{"g":"사동①","ko":"겨울 코트 세탁은 세탁소에 [[맡기세요]].","en":"Leave your winter coat with the dry cleaner.","ru":"Зимнее пальто отдайте в химчистку."},{"g":"사동①","ko":"저는 아이를 자동차 뒷자리에 [[태워요]].","en":"I put my child in the back seat of the car.","ru":"Я сажаю ребёнка на заднее сиденье машины."},{"g":"사동①","ko":"채소로 볶음밥을 만들어서 아이한테 [[먹여요]].","en":"I make fried rice with vegetables and feed it to my child.","ru":"Я готовлю жареный рис с овощами и кормлю им ребёнка."},{"g":"사동①","ko":"성민이 토끼한테 당근을 [[먹이고]] 있어요.","en":"Seongmin is feeding carrots to the rabbit.","ru":"Сонмин кормит кролика морковкой."},{"g":"사동①","ko":"엄마가 아이에게 모자를 [[씌워요]].","en":"The mother puts a hat on the child.","ru":"Мама надевает ребёнку шапку."},{"g":"사동①","ko":"선생님이 학생들에게 책을 [[읽혀요]].","en":"The teacher has the students read the book.","ru":"Учитель заставляет учеников читать книгу."},{"g":"사동①","ko":"엄마가 아기에게 양말을 [[신겨요]].","en":"The mother puts socks on the baby.","ru":"Мама надевает малышу носки."},{"g":"사동①","ko":"제이슨 씨가 안젤라 씨에게 가방을 [[맡겨요]].","en":"Jason leaves his bag with Angela.","ru":"Джейсон оставляет сумку Анжеле на хранение."},{"g":"사동①","ko":"부모님께서 라흐만 씨에게 고향 소식을 [[알려요]].","en":"Rahman's parents tell him the news from home.","ru":"Родители сообщают Рахману новости с родины."},{"g":"사동①","ko":"슬기가 인형에게 예쁜 옷을 [[입혀요]].","en":"Seulgi dresses her doll in pretty clothes.","ru":"Сыльги наряжает куклу в красивую одежду."},{"g":"사동②","ko":"남은 고기는 냉동실에 넣어서 [[얼리세요]].","en":"Put the leftover meat in the freezer to freeze it.","ru":"Оставшееся мясо положите в морозилку и заморозьте."},{"g":"사동②","ko":"음악 소리가 너무 크니까 소리를 좀 [[줄여]] 주시겠어요?","en":"The music is too loud. Could you turn it down a bit?","ru":"Музыка слишком громкая, не могли бы вы сделать потише?"},{"g":"사동②","ko":"음식이 맛있어서 [[남기지]] 않고 다 먹었어요.","en":"The food was delicious, so I ate it all without leaving any.","ru":"Еда была вкусной, и я съел всё без остатка."},{"g":"사동②","ko":"그럼 제가 물을 [[끓일게요]].","en":"Then I'll boil the water.","ru":"Тогда я вскипячу воду."},{"g":"사동②","ko":"제이슨 씨가 양파 껍질을 [[벗겨요]].","en":"Jason is peeling the onion.","ru":"Джейсон чистит лук."},{"g":"사동②","ko":"후엔 씨가 아이를 [[깨워요]].","en":"Huyen wakes up her child.","ru":"Хуен будит ребёнка."},{"g":"사동②","ko":"엄마가 아기를 [[재워요]].","en":"The mother puts the baby to sleep.","ru":"Мама укладывает малыша спать."},{"g":"사동②","ko":"의사가 환자를 [[살렸어요]].","en":"The doctor saved the patient.","ru":"Врач спас пациента."},{"g":"사동②","ko":"돼지고기는 잘 [[익혀서]] 먹어야 해요.","en":"Pork must be cooked thoroughly before eating.","ru":"Свинину нужно хорошо прожаривать, прежде чем есть."},{"g":"사동②","ko":"과장님께서 회의 시간을 30분 [[늦추셨어요]].","en":"The manager pushed the meeting back by 30 minutes.","ru":"Начальник отдела перенёс совещание на 30 минут позже."},{"g":"사동②","ko":"라민 씨가 사람들을 [[웃겨요]].","en":"Ramin makes people laugh.","ru":"Рамин смешит людей."}],"content":[{"q":"제이슨 씨는 어제 어디에서 회식을 했습니까?","qen":"Where did Jason have his company dinner yesterday?","qru":"Где Джейсон вчера был на корпоративном ужине?","t":"회사 앞에 새로 생긴 고기 뷔페에서 했습니다.","en":"At the new meat buffet in front of his company.","ru":"В новом мясном ресторане со шведским столом напротив компании.","k":["고기 뷔페"]},{"q":"제이슨 씨가 만드는 소스에는 어떤 양념이 필요합니까?","qen":"What seasonings does Jason's sauce need?","qru":"Какие приправы нужны для соуса Джейсона?","t":"고추장, 된장, 다진 마늘, 고춧가루가 필요합니다.","en":"It needs gochujang, doenjang, minced garlic and red pepper powder.","ru":"Нужны кочхуджан, твенджан, измельчённый чеснок и молотый красный перец.","k":["고추장","된장"]},{"q":"후엔 씨는 어떤 고기를 좋아합니까?","qen":"What kind of meat does Huyen like?","qru":"Какое мясо любит Хуен?","t":"간장 양념된 고기를 좋아합니다.","en":"She likes meat marinated in soy sauce.","ru":"Она любит мясо в соевом маринаде.","k":["간장"]},{"q":"김치볶음밥 글에서 '정말 맛있다'를 어떻게 표현했습니까?","qen":"In the kimchi fried rice post, how is 'really delicious' expressed?","qru":"Как в статье о жареном рисе с кимчи выражено «очень вкусно»?","t":"둘이 먹다가 하나가 죽어도 모른다고 표현했습니다.","en":"It's expressed as 'you wouldn't notice even if one of the two people eating died.'","ru":"Сказано: «так вкусно, что не заметишь, если один из двоих едящих умрёт».","k":["죽어도 모른다"]},{"q":"김치볶음밥을 만들 때 프라이팬에 식용유를 두르고 무엇을 먼저 볶습니까?","qen":"When making kimchi fried rice, what do you stir-fry first after oiling the pan?","qru":"Что сначала обжаривают на смазанной маслом сковороде, готовя жареный рис с кимчи?","t":"돼지고기를 먼저 볶습니다.","en":"You stir-fry the pork first.","ru":"Сначала обжаривают свинину.","k":["돼지고기"]},{"q":"'유통 기한'은 무엇을 말합니까?","qen":"What does 'sell-by date' (yutong gihan) mean?","qru":"Что означает «срок реализации»?","t":"판매자가 식품을 소비자에게 팔 수 있는 날짜를 말합니다.","en":"It is the date until which a seller can sell food to consumers.","ru":"Это дата, до которой продавец может продавать продукт покупателям.","k":["팔 수 있는","날짜"]},{"q":"'소비 기한'은 무엇을 말합니까?","qen":"What does 'use-by date' (sobi gihan) mean?","qru":"Что означает «срок употребления»?","t":"유통 기한이 지나도 음식을 먹을 수 있는 날짜를 말합니다.","en":"It is the date until which food can still be eaten even after the sell-by date.","ru":"Это дата, до которой продукт можно есть даже после истечения срока реализации.","k":["먹을 수 있는"]},{"q":"식품 보관 방법을 잘 지켜야 하는 이유는 무엇입니까?","qen":"Why should you follow food storage instructions carefully?","qru":"Почему нужно соблюдать правила хранения продуктов?","t":"올바르게 보관하지 않으면 유통 기한 이내에도 식품이 변할 수 있기 때문입니다.","en":"Because if food is not stored properly, it can go bad even before the sell-by date.","ru":"Потому что при неправильном хранении продукт может испортиться даже до истечения срока реализации.","k":["보관","변할"]}]},{"n":9,"vocab":[{"ko":"고장이 나다","en":"to break down, to be out of order","ru":"сломаться, выйти из строя","ex":"노트북이 고장 나서 서비스 센터에 방문하려고 해요.","exen":"My laptop broke, so I'm going to visit the service center.","exru":"У меня сломался ноутбук, поэтому я собираюсь в сервисный центр."},{"ko":"하수구가 막히다","en":"the drain is clogged","ru":"засорилась канализация (слив)","ex":"머리카락이 들어가서 그런지 하수구가 막힌 것 같아요.","exen":"Maybe because hair got in, the drain seems to be clogged.","exru":"Наверное, туда попали волосы, похоже, слив засорился."},{"ko":"변기가 막히다","en":"the toilet is clogged","ru":"засорился унитаз","ex":"저희 집 변기가 자주 막혀요.","exen":"Our toilet clogs often.","exru":"У нас часто засоряется унитаз."},{"ko":"물이 안 나오다","en":"there is no water (water doesn't come out)","ru":"нет воды (вода не идёт)","ex":"오늘 물이 안 나와서 샤워를 못 했어요.","exen":"There was no water today, so I couldn't shower.","exru":"Сегодня не было воды, и я не смог принять душ."},{"ko":"물이 새다","en":"water leaks","ru":"протекает вода","ex":"비가 많이 오는 날에는 창문 주변 벽에서 물이 새요.","exen":"On very rainy days, water leaks from the wall ar
