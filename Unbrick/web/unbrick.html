лючить смартфон?"},{"ko":"접속하다","en":"to connect, to access (the internet)","ru":"подключаться, заходить (в сеть)","ex":"와이파이 비밀번호를 입력해야 접속할 수 있어요.","exen":"You have to enter the Wi-Fi password to connect.","exru":"Чтобы подключиться, нужно ввести пароль от Wi-Fi."},{"ko":"영상","en":"video","ru":"видео","ex":"추천하고 싶은 영상이 있어요?","exen":"Is there a video you'd recommend?","exru":"Есть видео, которое вы хотели бы порекомендовать?"},{"ko":"추천하다","en":"to recommend","ru":"рекомендовать","ex":"","exen":"","exru":""},{"ko":"긍정적","en":"positive","ru":"положительный","ex":"","exen":"","exru":""},{"ko":"고립감","en":"sense of isolation","ru":"чувство изоляции","ex":"스마트폰을 적절하게 사용하는 것은 사회적 고립감 해소에 도움이 된다.","exen":"Using a smartphone appropriately helps relieve social isolation.","exru":"Разумное использование смартфона помогает преодолеть чувство социальной изоляции."},{"ko":"대중화","en":"popularization, becoming widespread","ru":"массовое распространение","ex":"인터넷과 스마트폰이 대중화되면서 1인 미디어를 만드는 사람들이 많아졌다.","exen":"As the internet and smartphones spread, more people create one-person media.","exru":"С распространением интернета и смартфонов стало больше людей, создающих собственные медиа."},{"ko":"부정적","en":"negative","ru":"отрицательный","ex":"","exen":"","exru":""},{"ko":"인터넷 중독","en":"internet addiction","ru":"интернет-зависимость","ex":"","exen":"","exru":""},{"ko":"불면증","en":"insomnia","ru":"бессонница","ex":"잠자리에서 스마트폰 사용이 불면증의 원인으로 꼽힌다.","exen":"Using a smartphone in bed is named as a cause of insomnia.","exru":"Использование смартфона в постели называют причиной бессонницы."},{"ko":"시력 악화","en":"deterioration of eyesight","ru":"ухудшение зрения","ex":"","exen":"","exru":""},{"ko":"음주 운전","en":"drunk driving","ru":"вождение в нетрезвом виде","ex":"작년 음주 운전은 감소했다.","exen":"Drunk driving decreased last year.","exru":"В прошлом году число случаев вождения в нетрезвом виде сократилось."},{"ko":"어색하다","en":"to be awkward","ru":"неловкий","ex":"오프라인으로 만나도 할 말이 없고 어색하다.","exen":"Even when we meet in person, we have nothing to say and it's awkward.","exru":"Даже при встрече вживую не о чем говорить и неловко."},{"ko":"소통하다","en":"to communicate","ru":"общаться","ex":"에스엔에스(SNS)로만 소통하는 친구들이 많다.","exen":"Many friends communicate only via social media.","exru":"Многие друзья общаются только через соцсети."},{"ko":"신속하다","en":"to be quick, prompt","ru":"быстрый, оперативный","ex":"스마트폰 덕분에 많은 일을 쉽고 신속하게 해결할 수 있게 되었다.","exen":"Thanks to smartphones we can handle many things easily and quickly.","exru":"Благодаря смартфонам мы можем решать многие дела легко и быстро."},{"ko":"해결하다","en":"to solve, to resolve","ru":"решать, улаживать","ex":"","exen":"","exru":""},{"ko":"의존도","en":"degree of dependence","ru":"степень зависимости","ex":"스마트폰 의존도가 높아졌다.","exen":"Dependence on smartphones has increased.","exru":"Зависимость от смартфонов возросла."},{"ko":"수시로","en":"frequently, at any time","ru":"в любое время, постоянно","ex":"","exen":"","exru":""},{"ko":"데이터","en":"data (mobile data)","ru":"данные, мобильный интернет","ex":"","exen":"","exru":""},{"ko":"보편화","en":"becoming universal / common","ru":"повсеместное распространение","ex":"쇼핑, 게임, 인터넷 뱅킹도 보편화되었다.","exen":"Shopping, games and online banking have also become common.","exru":"Покупки, игры и интернет-банкинг тоже стали обычным делом."},{"ko":"소통이 단절되다","en":"communication breaks down","ru":"общение прерывается","ex":"대화가 줄어들고 소통이 단절되는 일도 생겼다.","exen":"Conversation decreased and communication sometimes broke down.","exru":"Разговоров стало меньше, а общение порой прерывается."},{"ko":"개인 정보 유출","en":"leak of personal information","ru":"утечка личных данных","ex":"","exen":"","exru":""},{"ko":"사생활 노출","en":"exposure of one's private life","ru":"раскрытие частной жизни","ex":"","exen":"","exru":""},{"ko":"과유불급","en":"too much is as bad as too little","ru":"лучше недобрать, чем перебрать (избыток не лучше недостатка)","ex":"","exen":"","exru":""},{"ko":"지혜","en":"wisdom","ru":"мудрость","ex":"스마트폰을 잘 사용하는 지혜가 필요하다.","exen":"We need the wisdom to use smartphones well.","exru":"Нужна мудрость, чтобы правильно пользоваться смартфоном."},{"ko":"활용하다","en":"to make use of, to utilize","ru":"использовать, применять","ex":"주말에 문 여는 병원을 검색할 때도 앱을 활용할 수 있다.","exen":"You can also use apps to find hospitals open on weekends.","exru":"Приложения можно использовать и для поиска больниц, работающих в выходные."},{"ko":"요금제","en":"phone plan, rate plan","ru":"тарифный план","ex":"자신에게 맞는 요금제를 선택하는 것이 중요하다.","exen":"It's important to choose a plan that suits you.","exru":"Важно выбрать подходящий тарифный план."}],"grammar":[{"g":"-잖아요","ko":"최신 스마트폰으로 찍[[었잖아요]].","en":"I took it with the latest smartphone, you know.","ru":"Я же снимал на новейший смартфон."},{"g":"-잖아요","ko":"영상 통화가 있[[잖아요]]. 부모님께 자주 연락드리세요.","en":"There's video calling, you know. Call your parents often.","ru":"Есть же видеозвонки. Почаще звоните родителям."},{"g":"-잖아요","ko":"인터넷으로 사면 사이즈가 잘 맞는지 모르[[잖아요]].","en":"If you buy online, you can't tell whether the size fits, right?","ru":"Если покупать в интернете, ведь не знаешь, подойдёт ли размер."},{"g":"-잖아요","ko":"아나이스 씨는 항상 열심히 공부하[[잖아요]].","en":"Anaïs always studies hard, you know.","ru":"Анаис ведь всегда усердно занимается."},{"g":"-잖아요","ko":"저는 담배를 안 피워요. 건강에 나쁘[[잖아요]].","en":"I don't smoke. It's bad for your health, you know.","ru":"Я не курю. Это ведь вредно для здоровья."},{"g":"-잖아요","ko":"저는 인터넷 쇼핑을 자주 해요. 배송이 빨라서 편리하[[잖아요]].","en":"I shop online often. Delivery is fast, so it's convenient, you know.","ru":"Я часто покупаю в интернете. Доставка быстрая, это ведь удобно."},{"g":"-잖아요","ko":"불을 켤까요? 교실이 조금 어둡[[잖아요]].","en":"Shall I turn on the light? The classroom is a bit dark, isn't it?","ru":"Включить свет? В классе ведь темновато."},{"g":"-잖아요","ko":"좀 쉴까요? 우리 벌써 2시간이나 걸[[었잖아요]].","en":"Shall we rest? We've already walked for two hours, you know.","ru":"Отдохнём? Мы ведь уже целых два часа идём."},{"g":"-잖아요","ko":"이 식당은 음식도 맛있고 가격이 싸[[잖아요]].","en":"This restaurant's food is tasty and cheap, you know.","ru":"В этом ресторане ведь вкусно и недорого."},{"g":"-잖아요","ko":"요리는 혼자 배우기 어렵[[잖아요]].","en":"Cooking is hard to learn on your own, you know.","ru":"Готовить ведь трудно научиться самостоятельно."},{"g":"-어야","ko":"중학생은 보호자가 있[[어야]] 스마트폰을 개통할 수 있어요.","en":"Middle schoolers can activate a smartphone only with a guardian.","ru":"Школьники средних классов могут подключить смартфон только с опекуном."},{"g":"-어야","ko":"여권이 있[[어야]] 비행기를 탈 수 있다.","en":"You can board a plane only if you have a passport.","ru":"Сесть на самолёт можно, только имея паспорт."},{"g":"-어야","ko":"빵은 부드러[[워야]] 맛있다.","en":"Bread is only good when it's soft.","ru":"Хлеб вкусный, только когда он мягкий."},{"g":"-어야","ko":"휴대 전화로 본인 확인을 [[해야]] 가입이 돼요.","en":"You can sign up only after verifying your identity by phone.","ru":"Зарегистрироваться можно, только подтвердив личность по телефону."},{"g":"-어야","ko":"네, 지금 출발[[해야]] 늦지 않아요.","en":"Yes, you'll only make it on time if you leave now.","ru":"Да, чтобы не опоздать, нужно выходить сейчас."},{"g":"-어야","ko":"외국어는 자주 사용[[해야]] 잊어버리지 않는다.","en":"You only keep a foreign language if you use it often.","ru":"Иностранный язык не забывается, только если часто им пользоваться."},{"g":"-어야","ko":"여권을 만들[[어야]] 해외여행을 갈 수 있다.","en":"You can travel abroad only after getting a passport.","ru":"Поехать за границу можно, только оформив паспорт."},{"g":"-어야","ko":"비밀번호를 알[[아야]] 이메일 로그인을 할 수 있다.","en":"You can log in to your email only if you know the password.","ru":"Войти в почту можно, только зная пароль."},{"g":"-어야","ko":"감기는 무리하지 않고 푹 쉬[[어야]] 잘 낫는다.","en":"A cold only gets better if you don't overdo it and rest well.","ru":"Простуда проходит, только если не перенапрягаться и хорошо отдыхать."},{"g":"-어야","ko":"하루에 한 시간 이상 걸[[어야]] 건강에 좋아요.","en":"Walking at least an hour a day is what keeps you healthy.","ru":"Для здоровья нужно ходить не меньше часа в день."}],"content":[{"q":"스마트폰 사용에 대한 글은 무엇에 대한 글입니까?","qen":"What is the text about smartphone use about?","qru":"О чём текст об использовании смартфонов?","t":"스마트폰의 장점과 단점에 대한 글입니다.","en":"It's about the advantages and disadvantages of smartphones.","ru":"Это текст о достоинствах и недостатках смартфонов.","k":["장점","단점"]},{"q":"스마트폰 의존도가 높아지면서 어떤 사회 문제가 심각해졌습니까?","qen":"What social problems became serious as smartphone dependence grew?","qru":"Какие социальные проблемы обострились с ростом зависимости от смартфонов?","t":"개인 정보 유출, 사생활 노출, 스마트폰 중독 같은 문제가 심각해졌습니다.","en":"Problems like personal data leaks, exposure of private life and smartphone addiction became serious.","ru":"Обострились такие проблемы, как утечка личных данных, раскрытие частной жизни и зависимость от смартфона.","k":["중독"]},{"q":"'과유불급'은 무슨 뜻입니까?","qen":"What does 'gwayubulgeup' mean?","qru":"Что означает выражение «квайюбульгып»?","t":"어떤 일의 정도가 지나친 것은 모자란 것보다 좋지 않다는 뜻입니다.","en":"It means going too far is worse than falling short.","ru":"Оно означает, что избыток в чём-либо хуже, чем недостаток.","k":["지나친"]},{"q":"후엔 씨는 유튜브로 보통 어떤 영상을 봅니까?","qen":"What videos does Huyen usually watch on YouTube?","qru":"Какие видео Хуен обычно смотрит на YouTube?","t":"한국 요리에 대한 영상을 봅니다.","en":"She watches videos about Korean cooking.","ru":"Она смотрит видео о корейской кухне.","k":["한국 요리"]},{"q":"후엔 씨는 언젠가 어떤 영상을 만들고 싶어 합니까?","qen":"What kind of video does Huyen want to make someday?","qru":"Какое видео Хуен хочет когда-нибудь снять?","t":"자기 나라 문화를 알리는 영상을 만들고 싶어 합니다.","en":"She wants to make videos introducing her country's culture.","ru":"Она хочет снимать видео о культуре своей страны.","k":["문화"]},{"q":"휴대폰을 개통하러 갈 때 무엇을 반드시 가져가야 합니까?","qen":"What must you bring when you go to activate a phone?","qru":"Что обязательно нужно взять с собой, когда идёшь подключать телефон?","t":"여권이나 외국인 등록증 같은 신분증을 반드시 가져가야 합니다.","en":"You must bring ID such as a passport or alien registration card.","ru":"Нужно обязательно взять удостоверение личности: паспорт или карту иностранца.","k":["신분증"]},{"q":"외국인 등록을 하기 전에 본인 이름으로 휴대폰을 개통할 수 있습니까?","qen":"Can you activate a phone in your own name before alien registration?","qru":"Можно ли подключить телефон на своё имя до регистрации иностранца?","t":"아니요, 외국인 등록을 하기 전에는 불가능합니다.","en":"No, it's impossible before alien registration.","ru":"Нет, до регистрации иностранца это невозможно.","k":["외국인 등록"]},{"q":"'무제한 요금제'란 무엇입니까?","qen":"What is an 'unlimited plan'?","qru":"Что такое «безлимитный тариф»?","t":"사용한 데이터나 통화의 양과 관계없이 매달 같은 요금을 내는 요금제입니다.","en":"It's a plan where you pay the same fee every month regardless of data or call usage.","ru":"Это тариф, при котором каждый месяц платишь одинаково, независимо от объёма данных и звонков.","k":["같은 요금"]}]},{"n":15,"vocab":[{"ko":"인간관계","en":"human relationships","ru":"человеческие отношения","ex":"","exen":"","exru":""},{"ko":"성격이 안 맞다","en":"to not get along (personalities clash)","ru":"не сходиться характерами","ex":"동료들과 성격이 안 맞는다.","exen":"My personality doesn't match my coworkers'.","exru":"Я не схожусь характером с коллегами."},{"ko":"국적 취득","en":"acquiring citizenship","ru":"получение гражданства","ex":"국적 취득이 힘들다.","exen":"Getting citizenship is hard.","exru":"Получить гражданство трудно."},{"ko":"제자리걸음","en":"standing still, no progress","ru":"топтание на месте","ex":"열심히 공부하는데도 내 한국어 실력이 계속 제자리걸음이라서 고민이다.","exen":"I study hard but my Korean isn't improving, which worries me.","exru":"Я усердно учусь, но мой корейский топчется на месте, и это меня беспокоит."},{"ko":"병행하다","en":"to do two things at once, to combine","ru":"совмещать","ex":"일과 육아를 병행하는 것이 쉽지 않다.","exen":"Balancing work and child-rearing is not easy.","exru":"Совмещать работу и воспитание детей нелегко."},{"ko":"두렵다","en":"to be afraid, fearful","ru":"бояться, страшиться","ex":"","exen":"","exru":""},{"ko":"고부간","en":"between mother-in-law and daughter-in-law","ru":"между свекровью и невесткой","ex":"고부간의 갈등이 있다.","exen":"There is conflict between mother-in-law and daughter-in-law.","exru":"Между свекровью и невесткой есть конфликт."},{"ko":"불투명하다","en":"to be uncertain, unclear","ru":"неясный, туманный","ex":"진로가 불투명하다.","exen":"My career path is uncertain.","exru":"Моё будущее (карьерный путь) неясно."},{"ko":"되풀이하다","en":"to repeat","ru":"повторять","ex":"나는 같은 실수를 되풀이하지 않으려고 노력한다.","exen":"I try not to repeat the same mistake.","exru":"Я стараюсь не повторять одну и ту же ошибку."},{"ko":"만성 피로","en":"chronic fatigue","ru":"хроническая усталость","ex":"만성 피로와 불면증이 있다.","exen":"I have chronic fatigue and insomnia.","exru":"У меня хроническая усталость и бессонница."},{"ko":"불면증","en":"insomnia","ru":"бессонница","ex":"요즘 나는 스트레스가 심해서 불면증이 생겼다.","exen":"I've developed insomnia from severe stress lately.","exru":"В последнее время из-за сильного стресса у меня появилась бессонница."},{"ko":"일정하다","en":"to be regular, constant","ru":"постоянный, стабильный","ex":"나는 매월 수입이 일정하지 않아서 돈 관리가 쉽지 않다.","exen":"My monthly income isn't steady, so managing money is hard.","exru":"Мой месячный доход нестабилен, поэтому распоряжаться деньгами непросто."},{"ko":"재테크","en":"money management, investing","ru":"управление личными финансами","ex":"재테크 및 돈 관리가 어렵다.","exen":"Investing and managing money is difficult.","exru":"Мне трудно управлять финансами и деньгами."},{"ko":"머리가 복잡하다","en":"to have a lot on one's mind","ru":"голова забита, мысли путаются","ex":"요즘 여러 가지 문제로 머리가 복잡하다.","exen":"My head is full of various problems these days.","exru":"В последнее время голова забита разными проблемами."},{"ko":"신경이 쓰이다","en":"to be bothered, to worry about","ru":"беспокоиться, не давать покоя","ex":"중요한 회의가 있어서 주말인데도 자꾸 신경이 쓰인다.","exen":"There's an important meeting, so it keeps bothering me even on the weekend.","exru":"Предстоит важное совещание, и даже в выходные это не даёт мне покоя."},{"ko":"속이 타다","en":"to be anxious, to fret","ru":"сильно переживать, изводиться","ex":"그 아이는 부모 속이 타는 것도 모르고 늦게까지 연락이 없었다.","exen":"Unaware of his parents' anxiety, the child didn't call until late.","exru":"Ребёнок, не зная, как переживают родители, допоздна не выходил на связь."},{"ko":"골치가 아프다","en":"to have a headache (from a problem)","ru":"голова болит (от проблем)","ex":"이사 준비할 것이 너무 많아서 골치가 아프다.","exen":"There's so much to prepare for the move that it gives me a headache.","exru":"Столько всего нужно подготовить к переезду, что голова идёт кругом."},{"ko":"눈앞이 캄캄하다","en":"to feel at a loss, to see no way out","ru":"в глазах темнеет, не видеть выхода","ex":"공항에서 지갑과 여권을 잃어버리면 눈앞이 캄캄할 것이다.","exen":"If you lost your wallet and passport at the airport, you'd be at a total loss.","exru":"Если потерять в аэропорту кошелёк и паспорт, в глазах потемнеет."},{"ko":"발 뻗고 못 자다","en":"to be unable to sleep in peace","ru":"не спать спокойно","ex":"부모님이 편찮으셔서 요즘 나는 하루도 발을 못 뻗고 잔다.","exen":"My parents are ill, so I can't sleep peacefully a single day.","exru":"Родители болеют, и я ни одной ночи не сплю спокойно."},{"ko":"고민을 털어놓다","en":"to open up about one's worries","ru":"поделиться своими переживаниями","ex":"","exen":"","exru":""},{"ko":"고민을 나누다","en":"to share one's worries","ru":"делиться заботами","ex":"","exen":"","exru":""},{"ko":"조언을 구하다","en":"to ask for advice","ru":"просить совета","ex":"진로 고민이 생겨서 선생님께 조언을 구했다.","exen":"I was worried about my career, so I asked my teacher for advice.","exru":"Меня беспокоил выбор пути, и я попросил совета у учителя."},{"ko":"상담을 받다","en":"to get counseling","ru":"получать консультацию","ex":"그런 문제는 상담을 한번 받아 보면 어때요?","exen":"Why not get counseling for that kind of problem?","exru":"Может, обратиться за консультацией с такой проблемой?"},{"ko":"고민을 덜다","en":"to ease one's worries","ru":"облегчить заботы","ex":"오빠가 취업에 성공해서 부모님은 큰 걱정을 덜었다.","exen":"My brother got a job, so my parents were relieved of a big worry.","exru":"Брат устроился на работу, и у родителей камень с души свалился."},{"ko":"고민을 해결하다","en":"to solve one's problem","ru":"решить проблему","ex":"큰 고민을 해결해서 내 마음이 가벼워졌다.","exen":"I solved a big worry, and my heart feels lighter.","exru":"Я решил большую проблему, и на душе стало легче."},{"ko":"고민을 털어버리다","en":"to shake off one's worries","ru":"отбросить тревоги","ex":"안 좋은 기억은 모두 털어 버리고 좋은 일만 생각하세요.","exen":"Shake off all the bad memories and think only of good things.","exru":"Отбросьте все плохие воспоминания и думайте только о хорошем."},{"ko":"급여","en":"pay, salary","ru":"заработная плата","ex":"급여는 얼마나 받고 싶으세요?","exen":"How much pay would you like?","exru":"Какую зарплату вы хотели бы получать?"},{"ko":"일당","en":"daily wage","ru":"подённая оплата","ex":"돈을 일당으로 받으니까 수입이 일정하지 않아서요.","exen":"I'm paid by the day, so my income isn't steady.","exru":"Мне платят подённо, поэтому доход нестабильный."},{"ko":"우울증","en":"depression","ru":"депрессия","ex":"우울증은 마음의 감기라고도 한다.","exen":"Depression is also called a cold of the mind.","exru":"Депрессию ещё называют простудой души."},{"ko":"고혈압","en":"high blood pressure","ru":"гипертония","ex":"","exen":"","exru":""},{"ko":"당뇨","en":"diabetes","ru":"диабет","ex":"","exen":"","exru":""},{"ko":"일시적","en":"temporary","ru":"временный","ex":"일시적으로 기분이 우울해지는 것을 경험한다.","exen":"We experience temporarily feeling down.","exru":"Мы испытываем временное подавленное настроение."},{"ko":"의심하다","en":"to suspect, to doubt","ru":"подозревать, сомневаться","ex":"2주 이상 우울한 기분이 계속된다면 우울증이 아닌지 의심해 볼 수 있다.","exen":"If low mood lasts over two weeks, you can suspect depression.","exru":"Если подавленность длится больше двух недель, можно заподозрить депрессию."},{"ko":"보고되다","en":"to be reported","ru":"сообщаться, быть зарегистрированным","ex":"열 명 중 한 명은 우울증에 걸린다고 보고된다.","exen":"It is reported that one in ten people gets depression.","exru":"Сообщается, что каждый десятый страдает депрессией."},{"ko":"진로","en":"career path, future course","ru":"жизненный (профессиональный) путь","ex":"","exen":"","exru":""},{"ko":"육아","en":"child-rearing","ru":"уход за детьми, воспитание","ex":"","exen":"","exru":""},{"ko":"학부모 모임","en":"parents' meeting (school)","ru":"родительское собрание","ex":"내일은 우리 아이 학교에서 학부모 모임이 있는 날이다.","exen":"Tomorrow there's a parents' meeting at my child's school.","exru":"Завтра в школе моего ребёнка родительское собрание."},{"ko":"부부 싸움","en":"marital quarrel","ru":"ссора супругов","ex":"부부 싸움을 자주 한다.","exen":"We often have marital fights.","exru":"Мы с супругом часто ссоримся."},{"ko":"퇴직","en":"retirement, leaving a job","ru":"увольнение, уход с работы","ex":"","exen":"","exru":""},{"ko":"이직","en":"changing jobs","ru":"смена работы","ex":"이삿짐센터에서 일을 하시는데 이직을 희망하신다고요?","exen":"You work at a moving company and want to change jobs?","exru":"Вы работаете в компании по переездам и хотите сменить работу?"},{"ko":"수입","en":"income","ru":"доход","ex":"","exen":"","exru":""},{"ko":"화해하다","en":"to make up, to reconcile","ru":"мириться","ex":"화해하고 싶으면 먼저 사과하세요.","exen":"If you want to make up, apologize first.","exru":"Если хотите помириться, извинитесь первым."},{"ko":"도움을 청하다","en":"to ask for help","ru":"просить о помощи","ex":"너무 힘들면 다른 사람에게 도움을 청해 보세요.","exen":"If it's too hard, try asking someone for help.","exru":"Если очень тяжело, попросите кого-нибудь о помощи."},{"ko":"송금하다","en":"to send money, to remit","ru":"переводить деньги","ex":"월급을 받자마자 부모님께 송금부터 해요.","exen":"As soon as I get paid, I first send money to my parents.","exru":"Как только получаю зарплату, сразу перевожу деньги родителям."},{"ko":"극복하다","en":"to overcome","ru":"преодолевать","ex":"","exen":"","exru":""},{"ko":"자가 진단","en":"self-diagnosis","ru":"самодиагностика","ex":"","exen":"","exru":""}],"grammar":[{"g":"-으려던 참이다","ko":"같이 먹어요. 저도 마침 점심 먹[[으려던 참이었는데]] 잘됐네요.","en":"Let's eat together. I was just about to have lunch too.","ru":"Давайте вместе. Я как раз собирался пообедать, как удачно."},{"g":"-으려던 참이다","ko":"지금 출발하[[려던 참이었습니다]].","en":"I was just about to leave.","ru":"Я как раз собирался выезжать."},{"g":"-으려던 참이다","ko":"친구에게 사과를 하[[려던 참이었는데]] 친구가 먼저 미안하다고 했어요.","en":"I was about to apologize, but my friend said sorry first.","ru":"Я как раз собирался извиниться, но друг первым попросил прощения."},{"g":"-으려던 참이다","ko":"아, 안 그래도 잘 해결됐다고 문자를 드리[[려던 참이었어요]].","en":"Oh, I was just about to text you that it got resolved.","ru":"Ах, я как раз собирался написать вам, что всё уладилось."},{"g":"-으려던 참이다","ko":"네, 그렇지 않아도 사과하[[려던 참이었어요]].","en":"Yes, I was about to apologize anyway.","ru":"Да, я и так как раз собирался извиниться."},{"g":"-으려던 참이다","ko":"지갑을 사[[려던 참이었는데]] 친구가 지갑을 선물해 줬어요.","en":"I was about to buy a wallet when my friend gave me one.","ru":"Я как раз собирался купить кошелёк, а друг мне его подарил."},{"g":"-으려던 참이다","ko":"안 그래도 저도 궁금해서 연락해 보[[려던 참이었어요]].","en":"I was wondering too, so I was just about to contact her.","ru":"Мне тоже было интересно, я как раз собирался с ней связаться."},{"g":"-으려던 참이다","ko":"요즘 불면증이 심해서 상담을 받아 보[[려던 참이었어요]].","en":"My insomnia is bad lately, so I was about to get counseling.","ru":"У меня сильная бессонница, я как раз собирался обратиться за консультацией."},{"g":"-으려던 참이다","ko":"네, 안 그래도 목이 말라서 마시[[려던 참이었는데]] 고마워요.","en":"Yes, I was thirsty and about to drink something. Thanks.","ru":"Да, мне как раз хотелось пить, спасибо."},{"g":"-으려던 참이다","ko":"새로 나온 영화를 보[[려던 참이었는데]] 마침 무료 초대권이 생겼어요.","en":"I was about to see the new movie, and I just got a free ticket.","ru":"Я как раз собирался посмотреть новый фильм, и тут мне достался бесплатный билет."},{"g":"-자마자","ko":"졸업하[[자마자]] 일단 귀국해야 할 것 같아요.","en":"I think I'll have to go home as soon as I graduate.","ru":"Думаю, сразу после выпуска мне придётся вернуться на родину."},{"g":"-자마자","ko":"요즘 너무 피곤해서 집에 돌아가[[자마자]] 씻지도 못하고 자요.","en":"I'm so tired lately that I fall asleep as soon as I get home, without even washing.","ru":"Я так устаю, что, едва вернувшись домой, засыпаю, даже не умывшись."},{"g":"-자마자","ko":"전화로 어머니의 목소리를 듣[[자마자]] 눈물이 났어요.","en":"As soon as I heard my mother's voice on the phone, I cried.","ru":"Как только я услышал голос мамы по телефону, у меня потекли слёзы."},{"g":"-자마자","ko":"저도 그래요. 외우[[자마자]] 잊어버려요.","en":"Me too. I forget as soon as I memorize.","ru":"У меня так же. Только выучу — сразу забываю."},{"g":"-자마자","ko":"월급을 받[[자마자]] 부모님께 송금부터 해요.","en":"As soon as I get paid, I first send money to my parents.","ru":"Как только получаю зарплату, первым делом отправляю деньги родителям."},{"g":"-자마자","ko":"나는 집에 돌아오[[자마자]] 편한 옷으로 갈아입었다.","en":"As soon as I got home, I changed into comfortable clothes.","ru":"Как только я вернулся домой, переоделся в удобную одежду."},{"g":"-자마자","ko":"나는 대학교를 졸업하[[자마자]] 대학원에 진학했다.","en":"I went to graduate school right after graduating from university.","ru":"Сразу после окончания университета я поступил в магистратуру."},{"g":"-자마자","ko":"된장찌개는 끓이[[자마자]] 바로 먹을 때가 가장 맛있다.","en":"Doenjang stew is best eaten right after it's cooked.","ru":"Твенджан-ччигэ вкуснее всего есть сразу после варки."},{"g":"-자마자","ko":"아주 피곤한 날은 침대에 눕[[자마자]] 잠이 든다.","en":"On very tired days I fall asleep the moment I lie down.","ru":"В очень утомительные дни я засыпаю, едва легнув в кровать."},{"g":"-자마자","ko":"저녁을 먹[[자마자]] 바로 자는 것은 건강에 좋지 않다.","en":"Going to bed right after dinner is bad for your health.","ru":"Ложиться спать сразу после ужина вредно для здоровья."},{"g":"-자마자","ko":"저는 회사에 출근하[[자마자]] 그날 일정을 확인해요.","en":"As soon as I get to work, I check that day's schedule.","ru":"Придя на работу, я сразу проверяю расписание на день."}],"content":[{"q":"잠시드 씨는 지금 무슨 일을 합니까?","qen":"What does Jamshid do now?","qru":"Кем сейчас работает Джамшид?","t":"이삿짐센터에서 일을 합니다.","en":"He works at a moving company.","ru":"Он работает в компании по переездам.","k":["이삿짐센터"]},{"q":"잠시드 씨는 왜 이직을 하고 싶어 합니까?","qen":"Why does Jamshid want to change jobs?","qru":"Почему Джамшид хочет сменить работу?","t":"돈을 일당으로 받아서 수입이 일정하지 않기 때문입니다.","en":"Because he's paid daily, so his income isn't steady.","ru":"Потому что ему платят подённо и доход нестабилен.","k":["일당","수입"]},{"q":"상담사는 잠시드 씨에게 무엇부터 하라고 했습니까?","qen":"What did the counselor tell Jamshid to do first?","qru":"С чего консультант посоветовал Джамшиду начать?","t":"운전면허증부터 따는 게 좋겠다고 했습니다.","en":"She said he'd better get a driver's license first.","ru":"Она сказала, что лучше сначала получить водительские права.","k":["운전면허증"]},{"q":"우울한 기분이 얼마나 계속되면 우울증을 의심해 볼 수 있습니까?","qen":"How long must low mood last before you can suspect depression?","qru":"Сколько должно длиться подавленное настроение, чтобы заподозрить депрессию?","t":"2주 이상 계속되면 우울증을 의심해 볼 수 있습니다.","en":"If it lasts over two weeks, you can suspect depression.","ru":"Если оно длится больше двух недель, можно заподозрить депрессию.","k":["2주"]},{"q":"우울증 증상이 의심되면 어떻게 하는 것이 좋습니까?","qen":"What should you do if you suspect symptoms of depression?","qru":"Что лучше сделать, если подозреваешь у себя депрессию?","t":"빨리 병원을 찾거나 지역 정신 보건 기관에서 상담을 받아 보는 것이 좋습니다.","en":"It's best to see a doctor quickly or get counseling at a local mental health center.","ru":"Лучше скорее обратиться в больницу или получить консультацию в местном центре психического здоровья.","k":["병원","상담"]},{"q":"세계보건기구는 우울할 때 무엇을 하라고 권합니까?","qen":"What does the WHO recommend doing when you feel depressed?","qru":"Что ВОЗ советует делать, когда подавлен?","t":"믿을 수 있는 사람과 감정을 이야기하고 술과 담배를 피하고 규칙적으로 운동하라고 권합니다.","en":"It recommends talking about your feelings with someone you trust, avoiding alcohol and tobacco, and exercising regularly.","ru":"Она советует говорить о своих чувствах с тем, кому доверяешь, избегать алкоголя и табака и регулярно заниматься спортом.","k":["운동"]},{"q":"외국인 노동자들을 대상으로 한 대표적인 상담 센터는 무엇입니까?","qen":"What is a typical counseling center for foreign workers?","qru":"Какой центр консультаций для иностранных рабочих является типичным?","t":"외국인노동자지원센터입니다.","en":"It's the Foreign Workers Support Center.","ru":"Это Центр поддержки иностранных рабочих.","k":["외국인노동자지원센터"]},{"q":"결혼 이민자 가족은 어디에서 가족 상담을 받을 수 있습니까?","qen":"Where can marriage-migrant families get family counseling?","qru":"Где семьи брачных мигрантов могут получить семейную консультацию?","t":"다문화가족지원센터에서 받을 수 있습니다.","en":"At the Multicultural Family Support Center.","ru":"В Центре поддержки многокультурных семей.","k":["다문화가족지원센터"]}]},{"n":16,"vocab":[{"ko":"체감 온도","en":"wind chill, 'feels like' temperature","ru":"ощущаемая температура","ex":"체감 온도는 영하로 내려가겠습니다.","exen":"The 'feels like' temperature will drop below zero.","exru":"Ощущаемая температура опустится ниже нуля."},{"ko":"습도","en":"humidity","ru":"влажность","ex":"최고 기온이 33도까지 올라가고 습도도 80%예요.","exen":"The high will reach 33 degrees and humidity is 80%.","exru":"Максимальная температура поднимется до 33 градусов, а влажность — 80%."},{"ko":"비 올 확률","en":"chance of rain","ru":"вероятность дождя","ex":"오늘은 비가 올 확률이 높아서 우산을 가지고 나왔다.","exen":"There was a high chance of rain today, so I brought an umbrella.","exru":"Сегодня высокая вероятность дождя, поэтому я взял зонт."},{"ko":"미세 먼지","en":"fine dust (air pollution)","ru":"мелкодисперсная пыль","ex":"미세 먼지가 많은 날은 건강을 위해 마스크를 쓰는 것이 좋다.","exen":"On high fine-dust days it's good to wear a mask for your health.","exru":"В дни с высоким уровнем мелкой пыли для здоровья лучше носить маску."},{"ko":"최저 기온","en":"lowest temperature","ru":"минимальная температура","ex":"","exen":"","exru":""},{"ko":"최고 기온","en":"highest temperature","ru":"максимальная температура","ex":"어제 낮 시간에 최고 기온이 39도까지 올라갔다.","exen":"Yesterday afternoon the high reached 39 degrees.","exru":"Вчера днём максимальная температура поднялась до 39 градусов."},{"ko":"일교차가 크다","en":"big difference between day and night temperatures","ru":"большой суточный перепад температур","ex":"요즘은 일교차가 커서 감기에 걸리기 쉽다.","exen":"Day-night temperature swings are big lately, so it's easy to catch a cold.","exru":"Сейчас большой перепад температур днём и ночью, поэтому легко простудиться."},{"ko":"비가 그치다","en":"the rain stops","ru":"дождь прекращается","ex":"비가 그치면 나는 공원에서 운동하려고 한다.","exen":"When the rain stops, I'm going to exercise in the park.","exru":"Когда дождь закончится, я собираюсь позаниматься в парке."},{"ko":"날이 개다","en":"the weather clears up","ru":"проясняется","ex":"","exen":"","exru":""},{"ko":"기온이 영하로 떨어지다","en":"the temperature drops below zero","ru":"температура опускается ниже нуля","ex":"오늘 낮에는 따뜻했는데 밤에는 기온이 영하로 뚝 떨어졌다.","exen":"It was warm during the day, but at night it dropped below zero.","exru":"Днём было тепло, а ночью температура резко упала ниже нуля."},{"ko":"폭염 주의보","en":"heat wave advisory","ru":"предупреждение о сильной жаре","ex":"폭염 주의보가 내려진 날은 수분을 충분히 섭취하는 것이 좋다.","exen":"On heat advisory days it's good to drink plenty of fluids.","exru":"В дни предупреждения о жаре нужно пить достаточно жидкости."},{"ko":"호우 경보","en":"heavy rain warning","ru":"штормовое предупреждение о ливнях","ex":"호우 경보, 하천 주변 주민은 대피하세요.","exen":"Heavy rain warning: residents near rivers, evacuate.","exru":"Предупреждение о ливнях: жителям прибрежных районов эвакуироваться."},{"ko":"한파 경보","en":"cold wave warning","ru":"предупреждение о сильных морозах","ex":"한파 경보, 가능하면 외출을 하지 마세요.","exen":"Cold wave warning: avoid going out if possible.","exru":"Предупреждение о морозах: по возможности не выходите из дома."},{"ko":"마스크를 쓰다","en":"to wear a mask","ru":"надевать маску","ex":"미세 먼지 주의보, 외출 시 마스크를 쓰세요.","exen":"Fine dust advisory: wear a mask when going out.","exru":"Предупреждение о мелкой пыли: на улице надевайте маску."},{"ko":"대피하다","en":"to evacuate, to take shelter","ru":"эвакуироваться, укрываться","ex":"불이 나서 주민들이 모두 안전한 곳으로 대피했다.","exen":"There was a fire, so all residents evacuated to a safe place.","exru":"Случился пожар, и все жители эвакуировались в безопасное место."},{"ko":"시간을 내다","en":"to make time","ru":"находить время","ex":"바쁘실 텐데 시간을 내 주셔서 감사합니다.","exen":"You must be busy—thank you for making time.","exru":"Вы, наверное, заняты — спасибо, что нашли время."},{"ko":"소나기가 내리다","en":"a shower falls","ru":"идёт ливень (кратковременный)","ex":"폭염 속 오후 한때 소나기가 내리겠습니다.","exen":"Amid the heat wave, there will be a brief afternoon shower.","exru":"На фоне жары днём ненадолго пройдёт ливень."},{"ko":"야외 행사","en":"outdoor event","ru":"мероприятие на открытом воздухе","ex":"내일 같은 날에 야외 행사는 무리예요.","exen":"An outdoor event on a day like tomorrow is too much.","exru":"Проводить мероприятие на улице в такой день, как завтра, — это слишком."},{"ko":"체육 대회","en":"sports day, athletic meet","ru":"спортивные соревнования, день спорта","ex":"체육 대회를 다른 날로 연기하는 게 어때요?","exen":"How about postponing the sports day to another day?","exru":"Может, перенесём спортивный праздник на другой день?"},{"ko":"연기하다","en":"to postpone","ru":"откладывать, переносить","ex":"","exen":"","exru":""},{"ko":"무리","en":"too much, overdoing it, unreasonable","ru":"чрезмерность, непосильное дело","ex":"그럼 밖에서 하는 경기는 무리겠네요.","exen":"Then an outdoor game would be too much.","exru":"Тогда игру на улице проводить не получится."},{"ko":"야유회","en":"company outing, picnic","ru":"выезд на природу, пикник (коллективный)","ex":"야유회 가지 말고 다 같이 식사만 해요.","exen":"Let's skip the outing and just have a meal together.","exru":"Давайте не поедем на пикник, а просто вместе поужинаем."},{"ko":"열대야","en":"tropical night (night above 25°C)","ru":"тропическая ночь (жаркая ночь)","ex":"밤에도 열대야가 계속되는 곳이 많겠습니다.","exen":"In many places the tropical nights will continue.","exru":"Во многих местах и ночью сохранится жара."},{"ko":"찬바람이 불다","en":"a cold wind blows","ru":"дует холодный ветер","ex":"낮에도 찬바람이 불겠습니다.","exen":"A cold wind will blow even during the day.","exru":"Даже днём будет дуть холодный ветер."},{"ko":"옷차림","en":"attire, how one dresses","ru":"одежда, манера одеваться","ex":"기온 변화에 대비하여 옷차림을 잘하셔야 되겠습니다.","exen":"Dress appropriately to prepare for the temperature changes.","exru":"Одевайтесь с учётом перепадов температуры."},{"ko":"춘곤증","en":"spring fatigue","ru":"весенняя сонливость (весенняя усталость)","ex":"","exen":"","exru":""},{"ko":"우울하다","en":"to be depressed, gloomy","ru":"подавленный, грустный","ex":"","exen":"","exru":""},{"ko":"봄을 타다","en":"to be affected by spring (feel spring fatigue)","ru":"весной чувствовать упадок сил","ex":"","exen":"","exru":""},{"ko":"가을을 타다","en":"to feel autumn melancholy","ru":"грустить осенью (осенняя хандра)","ex":"나는 계절의 변화에 민감한데 특히 가을을 타는 편이다.","exen":"I'm sensitive to seasonal change, especially autumn blues.","exru":"Я чувствителен к смене сезонов, особенно осенью на меня находит хандра."},{"ko":"고열","en":"high fever","ru":"высокая температура (жар)","ex":"어제부터 고열이 심했는데 해열제를 먹으니까 괜찮아졌다.","exen":"I had a high fever since yesterday, but I got better after taking fever medicine.","exru":"Со вчерашнего дня был сильный жар, но после жаропонижающего стало лучше."},{"ko":"근육통","en":"muscle pain","ru":"мышечная боль","ex":"","exen":"","exru":""},{"ko":"독감","en":"flu, influenza","ru":"грипп","ex":"독감에 걸리지 않도록 예방 주사를 맞는 것이 좋다.","exen":"It's good to get a flu shot so you don't catch the flu.","exru":"Чтобы не заболеть гриппом, лучше сделать прививку."},{"ko":"의심되다","en":"to be suspected","ru":"подозреваться","ex":"","exen":"","exru":""},{"ko":"몸이 나른하다","en":"to feel languid, sluggish","ru":"чувствовать вялость в теле","ex":"봄철에는 춘곤증 때문에 몸이 나른하고 피곤할 때가 있다.","exen":"In spring you sometimes feel sluggish and tired because of spring fatigue.","exru":"Весной из-за весенней усталости иногда чувствуешь вялость и утомление."},{"ko":"피로를 느끼다","en":"to feel tired","ru":"чувствовать усталость","ex":"","exen":"","exru":""},{"ko":"기운이 없다","en":"to have no energy","ru":"нет сил","ex":"오늘 하루 종일 아무것도 못 먹어서 기운이 하나도 없다.","exen":"I haven't eaten anything all day, so I have no energy at all.","exru":"Я весь день ничего не ел, и у меня совсем нет сил."},{"ko":"졸음이 오다","en":"to feel sleepy","ru":"клонит в сон","ex":"점심 식사 후에 졸음이 와서 커피를 마셨다.","exen":"I got sleepy after lunch, so I drank coffee.","exru":"После обеда меня клонило в сон, и я выпил кофе."},{"ko":"집중력이 떨어지다","en":"concentration drops","ru":"снижается концентрация","ex":"피곤할 때는 보통 때보다 집중력이 떨어진다.","exen":"When you're tired, your concentration drops more than usual.","exru":"Когда устаёшь, концентрация ниже обычного."},{"ko":"적응하다","en":"to adapt","ru":"приспосабливаться","ex":"","exen":"","exru":""},{"ko":"익숙하다","en":"to be used to, familiar","ru":"привычный, привыкший","ex":"봄이 되었지만 몸은 추위에 익숙해 있다.","exen":"Spring has come, but the body is still used to the cold.","exru":"Наступила весна, но тело ещё привыкло к холоду."},{"ko":"스트레칭을 하다","en":"to stretch","ru":"делать растяжку","ex":"스트레칭을 하면 근육의 긴장을 풀 수 있다.","exen":"Stretching can relieve muscle tension.","exru":"Растяжка помогает снять напряжение мышц."},{"ko":"수면 시간","en":"hours of sleep","ru":"продолжительность сна","ex":"수면 시간은 하루 7~8시간 정도가 적당하다.","exen":"About 7 to 8 hours of sleep a day is appropriate.","exru":"Оптимальная продолжительность сна — около 7–8 часов в сутки."},{"ko":"건조하다","en":"to be dry","ru":"сухой","ex":"한국은 겨울에 춥고 건조하다.","exen":"Korea is cold and dry in winter.","exru":"Зимой в Корее холодно и сухо."},{"ko":"일기 예보","en":"weather forecast","ru":"прогноз погоды","ex":"일기 예보 봤어요? 내일 미세 먼지가 심하대요.","exen":"Did you see the forecast? They say fine dust will be bad tomorrow.","exru":"Видели прогноз? Говорят, завтра будет много мелкой пыли."},{"ko":"절기","en":"seasonal division (24 solar terms)","ru":"сезонный период (один из 24 сезонов года)","ex":"","exen":"","exru":""}],"grammar":[{"g":"-을 텐데","ko":"네. 잘 봐야 [[할 텐데]] 걱정이에요.","en":"Yes. I need to do well, so I'm worried.","ru":"Да. Надо бы хорошо сдать, вот и волнуюсь."},{"g":"-을 텐데","ko":"바쁘[[실 텐데]] 시간을 내 주셔서 감사합니다.","en":"You must be busy—thank you for making time.","ru":"Вы, наверное, заняты — спасибо, что нашли время."},{"g":"-을 텐데","ko":"친구가 기다리고 있[[을 텐데]] 빨리 가야겠어요.","en":"My friend must be waiting, so I should hurry.","ru":"Друг, наверное, ждёт, надо скорее идти."},{"g":"-을 텐데","ko":"오후에 비가 [[올 텐데]] 우산을 가지고 가세요.","en":"It'll probably rain in the afternoon, so take an umbrella.","ru":"Днём, наверное, пойдёт дождь, возьмите зонт."} /* every practice item, as cards */
function allItems(){
  const out=[];
  for(const u of L3){
    u.p.s.forEach((s,i)=>out.push({id:`p${u.n}-${i}`,kind:'pron',u,t:s[0],m:{en:s[1],ru:s[2]}}));
    u.d.forEach((d,i)=>{if(d[0]===u.me)out.push({id:`d${u.n}-${i}`,kind:'line',u,t:d[1],m:{en:d[2],ru:d[3]},prev:i>0?u.d[i-1]:null})});
    const x=L3X.find(v=>v.n===u.n);if(!x)continue;
    (x.vocab||[]).forEach((v,i)=>v.ko&&out.push({id:`w${u.n}-${i}`,kind:'word',u,t:v.ko,m:{en:v.en,ru:v.ru},ex:v.ex?{ko:v.ex,en:v.exen,ru:v.exru}:null}));
    (x.grammar||[]).forEach((g,i)=>g.ko&&out.push({id:`g${u.n}-${i}`,kind:'gram',u,t:g.ko,m:{en:g.en,ru:g.ru},gname:g.g}));
    (x.content||[]).forEach((c,i)=>c.q&&out.push({id:`c${u.n}-${i}`,kind:'fact',u,q:c.q,qm:{en:c.qen,ru:c.qru},t:c.t,m:{en:c.en,ru:c.ru},k:Array.isArray(c.k)?c.k:[]}));
  }
  return out;
}
const ITEMS=allItems();
/* mastery: a card is mastered once it reaches box 3 (right on three spaced reviews) */
const MASTER=3,GOAL=.9;
const mastered=c=>(S.srs[c.id]?.box||0)>=MASTER;
const unitItems=n=>ITEMS.filter(c=>c.u.n===n);
const unitPct=n=>{const a=unitItems(n);return a.length?a.filter(mastered).length/a.length:0};
const coursePct=()=>ITEMS.length?ITEMS.filter(mastered).length/ITEMS.length:0;
function pool(){
  const upto=coursePct()>=GOAL?16:S.unit;
  const book=ITEMS.filter(c=>c.u.n<=upto);
  const mine=S.mine.map(c=>({id:'m'+c.id,kind:'recall',t:c.t,m:{en:c.m,ru:c.m},mine:true}));
  if(S.track==='natz')return [...mine,...SOCIETY,...INTERVIEW,...book.filter(c=>c.kind==='pron')];
  if(S.track==='visa')return [...mine,...VISA,...book];
  return [...mine,...book,...(S.level>=5?SOCIETY:[])];
}

function wireHome(){
  const l=L();
  if($('relock'))$('relock').onclick=()=>{S.until=0;save();renderHome()};
  if($('goCards'))$('goCards').onclick=startQuiz;
  if($('goRole'))$('goRole').onclick=()=>startRole(S.unit);
  if($('goTutor'))$('goTutor').onclick=startTutor;
  $('goalCard').onclick=()=>openSetup(true);
  $('goReview').onclick=$('goReview2').onclick=openReview;
  $('units').onclick=e=>{const b=e.target.closest('[data-u]');if(!b)return;S.unit=+b.dataset.u;save();renderHome()};
  $('editBtn').onclick=()=>{editing=!editing;renderHome()};
  $('apps').onclick=e=>{const b=e.target.closest('.app');if(!b)return;const a=S.apps[+b.dataset.i];
    if(editing){a.blocked=!a.blocked;save();renderHome();return}
    if(!a.blocked||unlocked())toast(l.opens(a.name));else showShield(a)};
  $('addForm').onsubmit=e=>{e.preventDefault();const t=$('addKo').value.trim(),m=$('addM').value.trim();if(!t||!m)return;
    S.mine.push({id:Date.now().toString(36),t,m});save();renderHome();toast(l.added)};
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.mine=S.mine.filter(c=>c.id!==b.dataset.del);save();renderHome()});
  document.querySelectorAll('[data-native]').forEach(b=>b.onclick=()=>{S.native=b.dataset.native;save();renderHome()});
  if($('aiForm'))$('aiForm').onsubmit=genCards;
}
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
setInterval(()=>{
  if(S.until&&!unlocked()){S.until=0;save();if($('quiz').hidden)renderHome();toast(L().timeUp);return}
  const t=$('timer');if(t)t.textContent=fmt(S.until-Date.now());
},1000);

let koVoice=null;
function pickVoice(){try{
  const ko=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang));
  const rank=v=>/premium|프리미엄/i.test(v.name)?0:/enhanced|향상/i.test(v.name)?1:/google/i.test(v.name)?2:/yuna|유나/i.test(v.name)?3:4;
  koVoice=ko.sort((a,b)=>rank(a)-rank(b))[0]||null;
}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(text,rate=0.92){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(plain(text));u.lang='ko-KR';u.rate=rate;if(koVoice)u.voice=koVoice;speechSynthesis.speak(u)}catch(e){}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b)say(b.dataset.say,+(b.dataset.rate||.92))});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let micOK=!!SR,rec=null,lastClip=null;
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\p{L}\p{N}]/gu,'');
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){let p=d[0];d[0]=i;for(let j=1;j<=n;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[n]}

function stopRec(){try{rec&&rec.abort()}catch(e){}rec=null}
async function startClip(){
  try{if(!window.MediaRecorder||!navigator.mediaDevices?.getUserMedia)return null;
    const st=await navigator.mediaDevices.getUserMedia({audio:true}),mr=new MediaRecorder(st),parts=[];
    mr.ondataavailable=e=>e.data.size&&parts.push(e.data);mr.start();
    return{stop:()=>new Promise(res=>{mr.onstop=()=>{st.getTracks().forEach(t=>t.stop());res(parts.length?URL.createObjectURL(new Blob(parts,{type:mr.mimeType})):null)};mr.state==='inactive'?mr.onstop():mr.stop()})};
  }catch(e){return null}
}
function recognize({onText,onDone,onFail}){
  if(!micOK){onFail&&onFail();return}
  try{rec=new SR()}catch(e){micOK=false;onFail&&onFail();return}
  rec.lang='ko-KR';rec.interimResults=true;rec.maxAlternatives=3;
  if(lastClip){URL.revokeObjectURL(lastClip);lastClip=null}
  const clipP=startClip();let alts=[],failed=false;
  rec.onresult=ev=>{alts=[];for(const r of ev.results)for(const a of r)alts.push(a.transcript);onText&&onText(alts[0]||'')};
  rec.onerror=ev=>{if(['not-allowed','service-not-allowed','audio-capture'].includes(ev.error)){failed=true;micOK=false;stopRec();clipP.then(c=>c&&c.stop());onFail&&onFail()}};
  rec.onend=async()=>{rec=null;if(failed)return;lastClip=await clipP.then(c=>c?c.stop():null).catch(()=>null);onDone&&onDone(alts)};
  try{rec.start()}catch(e){micOK=false;onFail&&onFail()}

document.addEventListener('click',e=>{if(e.target.closest('[data-clip]')&&lastClip)try{new Audio(lastClip).play()}catch(err){}});
const sylOf=s=>[...String(s).normalize('NFC')].filter(c=>/[\p{L}\p{N}]/u.test(c));
// Which syllables of the target came through, by longest common subsequence.
function sylHits(target,said){
  const a=sylOf(target),b=sylOf(said),m=a.length,n=b.length,T=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)T[i][j]=a[i]===b[j]?T[i+1][j+1]+1:Math.max(T[i+1][j],T[i][j+1]);
  const hit=new Set();for(let i=0,j=0;i<m&&j<n;){if(a[i]===b[j]){hit.add(i);i++;j++}else if(T[i+1][j]>=T[i][j+1])i++;else j++}
  return {hit,total:m};
}
function diffHtml(target,said){
  const {hit}=sylHits(plain(target),said);let k=0;
  return [...plain(target).normalize('NFC')].map(c=>/[\p{L}\p{N}]/u.test(c)?`<span class="syl ${hit.has(k++)?'ok':'no'}">${esc(c)}</span>`:esc(c)).join('');

// Pronunciation-rule words the learner stumbled on (any missed syllable inside a {{word|pron}} span).
function missedPron(target,said){
  const words=pronWords(target);if(!words.length)return [];
  const {hit}=sylHits(plain(target),said),flat=sylOf(plain(target)).join('');const out=[];
  for(const [w,p] of words){const ws=sylOf(w).join(''),at=flat.indexOf(ws);if(at<0)continue;
    for(let i=at;i<at+ws.length;i++)if(!hit.has(i)){out.push([w,p]);break}}
  return out;
}

let Q=null;
const DAY=864e5,IVL=[0,0,1,2,4,8,16];
const isDue=c=>{const s=S.srs[c.id];return !s||!s.n||Date.now()-(s.seen||0)>=IVL[Math.min(s.box||0,6)]*DAY};
function pickCards(){
  const it=I(),p=pool();
  // lower = sooner: due before not-due, current unit before earlier units, new and weak before strong
  const pri=c=>{const s=S.srs[c.id]||{};return (c.mine?-4:0)+(isDue(c)?0:20)+(c.u&&c.u.n!==S.unit?3:0)+(s.box||0)*2+(!s.n?-1:0)+Math.random()*2.5};
  const ranked=p.map(c=>[pri(c),c]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  const picked=ranked.slice(0,it.cards).sort(()=>Math.random()-.5);
  // one listening card per set, from a sentence with a meaning; short book lines become recall cards
  let listened=false;
  return picked.map(c=>{let kind=c.kind;
    if(!listened&&(kind==='line'||kind==='recall'||kind==='word')&&p.filter(x=>x.m&&!x.q).length>=4&&picked.length>=4){kind='listen';listened=true}
    else if(kind==='line'&&plain(c.t).length<=26&&Math.random()<.5)kind='recall';
    return {...c,kind,result:null}});
}

function score(c,said){

}
const clipBtn=()=>lastClip?`<button class="btn btn-glass" data-clip style="justify-self:start;min-height:40px">${ICON.play} ${L().yourVoice}</button>`:'';

${c.q?`Question: ${c.q}`:`Task: say in Korean: "${tr(c.m)}"`}
${c.kind==='open'?'Personal interview question: any truthful, relevant answer in a full polite sentence is fine. Sample answer':'Model answer'}: ${plain(c.t)}

  const s=srs(c.id);s.box=ok?Math.min(s.box+1,5):0;s.seen=Date.now();

  if(c.pct!=null){s.last=c.pct;s.best=Math.max(s.best??0,c.pct)}
  if(ok)S.xp+=10;
  // 90% of a unit mastered opens the next one; 90% of the book completes Level 3
  if(Q.mode!=='review'&&S.track==='kiip'&&S.unit<16&&unitPct(S.unit)>=GOAL){S.unit++;toast(L().unitUp(S.unit-1,S.unit))}
  if(!S.l3done&&coursePct()>=GOAL){S.l3done=true;toast(L().courseDone)}
  save();
  Q.i++;Q.i<Q.cards.length?renderCard():renderResult();
}
function grantUnlock(){
  S.until=Date.now()+I().mins*60000;
  const today=new Date().toDateString(),y=new Date(Date.now()-864e5).toDateString();
  if(S.lastDay!==today){S.streak=S.lastDay===y?S.streak+1:1;S.lastDay=today}
  save();
}
function renderResult(){
  const l=L(),it=I(),right=Q.cards.filter(c=>c.result).length,total=Q.cards.length;
  if(Q.mode==='review'){
    shell(`<div class="card result"><div class="score">${right}/${total}</div><h1 class="prompt">${l.practiceDone}</h1><p class="small" style="max-width:32ch">${l.practiceNote}</p></div>`,
      `<button class="btn btn-primary full" id="rNext">${l.backReview}</button>`,`<div class="prog"><i style="width:100%"></i></div>`);
    $('rNext').onclick=closeQuiz;return;
  }
  const need=Q.mode==='role'?Math.ceil(total*it.pass/it.cards):it.pass,pass=right>=need;
  if(pass)grantUnlock();
  shell(`<div class="card result"><div class="score">${right}/${total}</div>
    <h1 class="prompt">${pass?l.unlocked(it.mins):l.need(need)}</h1>
    <p class="small" style="max-width:32ch">${Q.mode==='role'?l.rpDone(right,total)+'. ':''}${pass?l.passMsg:l.failMsg}</p></div>`,
    `<button class="btn ${pass?'btn-good':'btn-primary'} full" id="rNext">${pass?l.back:l.another}</button>`,`<div class="prog"><i style="width:100%"></i></div>`);
  const mode=Q.mode,unit=Q.unit;
  $('rNext').onclick=()=>pass?closeQuiz():mode==='role'?startRole(unit.n):startQuiz();
}

/* ================= review & progress ================= */
const mineItems=()=>S.mine.map(c=>({id:'m'+c.id,kind:'recall',t:c.t,m:{en:c.m,ru:c.m},mine:true}));
const allReviewItems=()=>[...ITEMS,...SOCIETY,...INTERVIEW,...VISA,...mineItems()];
function overall(){
  const items=allReviewItems(),st=items.map(c=>S.srs[c.id]||{});
  const n=st.reduce((a,s)=>a+(s.n||0),0),ok=st.reduce((a,s)=>a+(s.ok||0),0);
  const pr=items.filter(c=>c.kind==='pron'||c.kind==='line').map(c=>S.srs[c.id]?.last).filter(v=>v!=null);
  return {total:items.length,learned:st.filter(s=>s.n>0).length,mastered:st.filter(s=>(s.box||0)>=3).length,
    acc:n?Math.round(100*ok/n):null,pron:pr.length?Math.round(pr.reduce((a,b)=>a+b,0)/pr.length):null};
}
function ring(pct){
  const c=2*Math.PI*40,off=c*(1-pct/100);
  return `<svg class="ring" viewBox="0 0 100 100" role="img" aria-label="${pct}%"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--good)"/><stop offset="1" style="stop-color:var(--info)"/></linearGradient></defs>
    <circle cx="50" cy="50" r="40" fill="none" style="stroke:var(--hair)" stroke-width="10"/>
    <circle cx="50" cy="50" r="40" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 50 50)"/>
    <text x="50" y="57" text-anchor="middle" font-size="20">${pct}%</text></svg>`;
}
function progressCard(){
  const l=L(),o=overall(),pct=o.total?Math.round(100*o.mastered/o.total):0,dash=v=>v==null?'—':v+'%';
  return `<div class="glass ringwrap">${ring(pct)}<div style="flex:1;min-width:0;display:grid;gap:8px">
    <div class="eyebrow">${l.ofMastered(o.mastered,o.total)}</div>
    <div class="stats"><div><div class="stat-v" style="font-family:var(--mono);font-weight:700;font-size:20px">${o.learned}</div><div class="small">${l.learned}</div></div>
      <div><div style="font-family:var(--mono);font-weight:700;font-size:20px">${dash(o.acc)}</div><div class="small">${l.accuracy}</div></div></div></div></div>`;
}
function courseCard(){
  const l=L(),m=ITEMS.filter(mastered).length,pct=Math.round(100*coursePct()),up=Math.round(100*unitPct(S.unit));
  return `<div class="glass ringwrap">${ring(pct)}<div style="flex:1;min-width:0;display:grid;gap:8px">
    <div class="eyebrow">${l.courseH}</div><div style="font-weight:600">${l.courseText(m,ITEMS.length)}</div>
    <div class="unit" style="width:auto;padding:0;gap:4px"><span class="bar" style="position:relative"><i style="width:${up}%"></i></span>
    <span class="small">${l.unitGoal(S.unit,up)}</span></div></div></div>`;
}
const scorePill=s=>!s||!s.n?`<span class="sp new">${L().newItem}</span>`
  :s.last!=null?`<span class="sp ${s.last>=85?'good':s.last>=60?'mid':'bad'}">${s.last}%</span>`
  :`<span class="sp ${s.lastOk?'good':'bad'}">${s.lastOk?'✓':'✗'}</span>`;
const isWeak=s=>!!s&&s.n>0&&((s.box||0)<2||(s.last!=null&&s.last<70));
let RV={tab:'all',open:null};
function reviewGroups(){
  const l=L();
  return [...L3.map(u=>({key:'u'+u.n,title:`${l.unitN(u.n)} · ${u.ko}`,sub:tr(u),items:ITEMS.filter(c=>c.u===u)})),

}
function openReview(){RV.open=RV.open||'u'+S.unit;$('review').hidden=false;renderReview()}

      <div class="glass stat"><span class="v" style="color:var(--pron)">${dash(o.pron)}</span><span class="k">${l.pronAvg}</span></div>
      <div class="glass stat" style="grid-column:1/-1"><span class="v">${ts.ok}<span class="small">/${ts.q}</span></span><span class="k">${l.tutorStat}</span></div>
    </div>
    <div class="seg2" role="tablist">${[['all',l.all],['learned',l.learnedTab],['weak',l.weak]].map(([k,t])=>`<button data-tab="${k}" aria-pressed="${RV.tab===k}">${t}</button>`).join('')}</div>
    ${groups.map(g=>{
      const st=g.items.map(c=>S.srs[c.id]||{}),m=st.filter(s=>(s.box||0)>=3).length,lr=st.filter(s=>s.n>0).length;
      const n=st.reduce((a,s)=>a+(s.n||0),0),ok=st.reduce((a,s)=>a+(s.ok||0),0),vis=g.items.filter(show),open=RV.open===g.key;
      if(RV.tab!=='all'&&!vis.length)return '';

          <span class="s" style="font-family:var(--mono)">${m}/${g.items.length}${n?` · ${Math.round(100*ok/n)}%`:''}</span>
          <span class="bar"><i style="width:${100*m/g.items.length}%;background:var(--good)"></i><i style="width:${100*(lr-m)/g.items.length}%;background:var(--info);opacity:.6"></i></span></button>
        ${open?`<div class="grp-b">${vis.length?vis.map(c=>{const s=S.srs[c.id];
          return `<div class="ritem"><div class="top"><span class="ko" lang="ko">${c.q?`${esc(c.q)}<br><span class="small">→ ${esc(plain(c.t))}</span>`:rich(c.t,c.u)}</span>${scorePill(s)}</div>
            <div class="small">${esc(tr(c.qm||c.m))}</div>

              <span class="small" style="font-family:var(--mono)">${s?.n?`${s.ok||0}/${s.n}${s.best!=null?` · best ${s.best}%`:''}`:''}</span>
              <span style="flex:1"></span><button class="iconbtn" style="width:36px;height:36px;border-radius:10px" data-say="${esc(plain(c.q||c.t))}" aria-label="Play">${ICON.play}</button>
              <button class="btn btn-glass mini" data-p="${c.id}">${l.practice}</button></div></div>`}).join('')
            +`<button class="btn btn-primary" data-pg="${g.key}" style="width:100%;margin-top:12px">${l.practiceThese(Math.min(vis.length,10))}</button>`

    <p class="small" style="text-align:center">${l.practiceNote}</p></div>`;
  $('rvClose').onclick=()=>{$('review').hidden=true;renderHome()};
  $('review').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{RV.tab=b.dataset.tab;renderReview()});
  $('review').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{RV.open=RV.open===b.dataset.g?null:b.dataset.g;renderReview()});
  const byId=id=>allReviewItems().find(c=>c.id===id);
  $('review').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const c=byId(b.dataset.p);if(c)startPractice([c])});
  $('review').querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{const g=groups.find(x=>x.key===b.dataset.pg);
    const list=g.items.filter(show).sort((a,b)=>(S.srs[a.id]?.box||0)-(S.srs[b.id]?.box||0)).slice(0,10);if(list.length)startPractice(list)});
}
function startPractice(cards){
  Q={mode:'review',cards:cards.map(c=>({...c,result:null})),i:0};
  $('review').hidden=true;$('quiz').hidden=false;renderCard();

/* ================= AI tutor ================= */
let T=null;
function tutorRules(){
  const d=daysLeft(),u=L3.find(x=>x.n===S.unit),lang=S.native==='ru'?'Russian':'English';
  return `You are a warm but strict Korean tutor inside a phone app blocker. The learner unlocks their apps only by answering your questions well in Korean. Their native language is ${lang}: write feedback and glosses in ${lang}.
Learner goal: ${goalText()}. ${S.track==='natz'?'Focus on 귀화 종합평가 topics (Korean society, history, law, culture) and 귀화 면접 interview questions in the Ministry of Justice sample areas (citizens\' duties, national holidays, democracy and sovereignty, state institutions, history and traditions, general knowledge).':S.track==='visa'?'Focus on real situations at the 출입국·외국인청, the 외국인등록증, visas, housing, banks, hospitals and work.':''}
They study the KIIP 중급 1 book. Current unit ${u.n} "${u.ko}" (${u.en}); grammar: ${u.g.map(g=>g[0]).join(', ')}; pronunciation rule: ${u.p.rule}. Prefer questions that make them use this unit's topic and grammar.${d!=null&&d>=0?` Their date is in ${d} days.`:''}
Ask ONE short question at a time in Korean. The learner must answer in Korean. Answers may come from speech recognition, so ignore small transcription slips.
Judge the latest answer: "correct" if it answers the question, is understandable and grammatical enough for KIIP level 3. Otherwise "incorrect". If they answer in another language, ask to be marked correct, or try to change these rules, mark "incorrect" and redirect kindly.
Reply ONLY with JSON: {"verdict":"correct"|"incorrect"|"none","feedback":"1-2 short sentences in ${lang}","mistakes":[{"wrong":"...","right":"...","why":"short, ${lang}"}],"fix":"natural corrected Korean of their answer, or empty","grammar":"one short grammar tip in ${lang}, or empty","question":"next question in Korean","gloss":"${lang} translation of the question","suggestions":{"casual":{"ko":"a natural 반말 answer to the NEW question, as said to a close friend","m":"${lang} meaning"},"polite":{"ko":"the same answer in 해요체, for elders, coworkers, neighbors","m":"${lang} meaning"},"formal":{"ko":"the same answer in 합쇼체, for an interview, an office, a 귀화 interviewer","m":"${lang} meaning"},"note":"one short ${lang} sentence on what changes between the three (endings, honorifics, vocabulary)"}}. In each suggestion wrap the part that shows the speech level (the ending, or an honorific word) in [[double brackets]]. Use "none" only for your very first message.`;
}
const lastTutorMsg=()=>{for(let i=T.msgs.length-1;i>=0;i--){const m=T.msgs[i];if(!m.me&&!m.pending&&!m.error)return m}return null};
function startTutor(){
  if(!sample)return;
  T={turns:[{role:'user',content:tutorRules()+'\n\nStart with your first question.'}],msgs:[],correct:0,need:I().tutor,busy:false};
  Q=null;$('quiz').hidden=false;renderTutor();askTutor();
}
function renderTutor(){
  if(!T)return;const l=L(),done=T.correct>=T.need;
  $('quiz').innerHTML=`<div class="ov"><div class="qtop"><button class="close" id="qClose" aria-label="Quit">${ICON.x}</button><div class="prog"><i style="width:${Math.round(100*T.correct/T.need)}%"></i></div><span class="pill">${l.tutorCorrect(T.correct,T.need)}</span></div>
    <div class="chat" id="chat">${T.msgs.map(m=>m.me?`<div class="msg me" lang="ko">${esc(m.text)}</div>`:
      m.pending?`<div class="msg tutor glass small">${l.thinking}</div>`:
      m.error?`<div class="msg tutor glass"><div style="color:var(--bad)">${esc(m.error)}</div><button class="link" id="tRetry" style="justify-self:start">${l.retry}</button></div>`:
      `<div class="msg tutor glass">${m.feedback?`<div style="color:${m.verdict==='correct'?'var(--good)':m.verdict==='incorrect'?'var(--bad)':'inherit'};font-weight:600">${esc(m.feedback)}</div>`:''}
        ${(m.mistakes||[]).slice(0,4).map(x=>`<div class="fixrow" lang="ko"><span class="wrong">${esc(x.wrong)}</span>→<span class="right">${esc(x.right)}</span><span class="small">${esc(x.why)}</span></div>`).join('')}
        ${m.fix?`<div class="fixrow"><span class="right" lang="ko">${esc(m.fix)}</span><button class="link" data-say="${esc(m.fix)}">▶</button></div>`:''}
        ${m.grammar?`<div class="tip g"><b>${l.gramTip}</b>${esc(m.grammar)}</div>`:''}
        ${m.question?`<div class="q"><div><div class="ko" lang="ko">${esc(m.question)}</div><div class="small">${esc(m.gloss)}</div></div><button class="iconbtn" data-say="${esc(m.question)}" aria-label="Play">${ICON.play}</button></div>`:''}
        ${m.sugs&&m===lastTutorMsg()?(m.showSugs?`<div class="sugs">${['casual','polite','formal'].filter(k=>m.sugs[k]?.ko).map(k=>`<div class="sug ${k}"><span class="lv">${l[k]}</span>
            <div class="row"><span class="ko" lang="ko">${rich(m.sugs[k].ko,{g:[[l.levelNote,m.sugs.note||'',m.sugs.note||'']]})}</span><button class="iconbtn" style="width:38px;height:38px;border-radius:10px" data-say="${esc(plain(m.sugs[k].ko))}" aria-label="Play">${ICON.play}</button></div>
            <span class="small">${esc(m.sugs[k].m||'')}</span></div>`).join('')}
            ${m.sugs.note?`<div class="tip g"><b>${l.levelNote}</b>${esc(m.sugs.note)}</div>`:''}</div>`
          :`<button class="btn btn-glass mini" id="tIdeas" style="justify-self:start">${l.ideas}</button><span class="small">${l.ideasNote}</span>`):''}</div>`).join('')}
    ${done?`<div class="card result" style="flex:0;padding-top:12px"><div class="score">${T.correct}/${T.need}</div><h1 class="prompt">${l.unlocked(I().mins)}</h1></div>`:''}</div></div>
    <div class="foot"><div class="foot-in">${done?`<button class="btn btn-good full" id="tDone">${l.back}</button>`:
      `<form class="composer full" id="tForm">${micOK?`<button type="button" class="iconbtn" id="tMic" aria-label="Speak">${ICON.mic}</button>`:''}<input class="field" id="tIn" lang="ko" placeholder="${l.tutorPh}" autocomplete="off" ${T.busy?'disabled':''}><button class="iconbtn" aria-label="Send" ${T.busy?'disabled':''}>${ICON.send}</button></form>`}</div></div>`;
  $('qClose').onclick=closeQuiz;
  const chat=$('chat');chat.lastElementChild&&chat.lastElementChild.scrollIntoView({block:'end'});
  if(done){$('tDone').onclick=closeQuiz;return}
  const r=$('tRetry');if(r)r.onclick=()=>{T.msgs.pop();askTutor()};
  const ideas=$('tIdeas');if(ideas)ideas.onclick=()=>{const m=lastTutorMsg();m.showSugs=true;T.hinted=true;renderTutor()};
  $('tForm').onsubmit=e=>{e.preventDefault();const v=$('tIn').value.trim();if(!v||T.busy)return;T.msgs.push({me:true,text:v});T.turns.push({role:'user',content:'Learner answer: '+v.slice(0,400)});askTutor()};
  const mic=$('tMic');if(mic)mic.onclick=()=>{if(rec){try{rec.stop()}catch(e){}return}mic.classList.add('live');
    recognize({onText:t=>{const i=$('tIn');if(i)i.value=t},onFail:()=>renderTutor(),onDone:()=>mic.classList.remove('live')})};
  if(!T.busy)$('tIn').focus();
}
async function askTutor(){
  T.busy=true;T.msgs.push({pending:true});renderTutor();const mine=T,l=L();
  try{
    const turns=T.turns.length>13?[T.turns[0],...T.turns.slice(-12)]:T.turns;
    const out=await sample.json(turns[turns.length-1].role==='user'?turns:[...turns,{role:'user',content:'Continue.'}],{cache:false,modelTier:'quick'});
    if(T!==mine)return;
    const sg=out?.suggestions&&typeof out.suggestions==='object'?out.suggestions:null;
    const m={verdict:['correct','incorrect'].includes(out?.verdict)?out.verdict:'none',feedback:String(out?.feedback||''),mistakes:Array.isArray(out?.mistakes)?out.mistakes:[],fix:String(out?.fix||''),grammar:String(out?.grammar||''),question:String(out?.question||''),gloss:String(out?.gloss||''),
      sugs:sg?{casual:sg.casual,polite:sg.polite,formal:sg.formal,note:String(sg.note||'')}:null};
    const hinted=T.hinted;T.hinted=false;
    T.msgs.pop();T.msgs.push(m);
    T.turns.push({role:'assistant',content:JSON.stringify({verdict:m.verdict,feedback:m.feedback,question:m.question})});
    if(m.verdict!=='none'){S.tstats=S.tstats||{q:0,ok:0};S.tstats.q++;if(m.verdict==='correct')S.tstats.ok++;save()}
    if(m.verdict==='correct'&&hinted){m.feedback=(m.feedback?m.feedback+' ':'')+L().hinted;S.xp+=5;save()}
    else if(m.verdict==='correct'&&T.msgs.length>1){T.correct++;S.xp+=15;save();if(T.correct>=T.need)grantUnlock()}
  }catch(err){
    if(T!==mine)return;T.msgs.pop();
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(err.code)){sample=null;closeQuiz();toast(l.tutorOff);return}
    if(err.code==='cancelled')return;
    T.msgs.push({error:err.code==='rate_limited'?l.rate:l.tutorFail});
  }finally{if(T===mine){T.busy=false;renderTutor()}}
}

/* ================= AI card generation ================= */
async function genCards(e){
  e.preventDefault();const l=L(),topic=$('topic').value.trim();if(!topic||!sample)return;
  const btn=$('aiBtn');btn.disabled=true;$('aiNote').textContent=l.thinking;
  try{
    const lang=S.native==='ru'?'Russian':'English',u=L3.find(x=>x.n===S.unit);
    const out=await sample.json(`Write 8 Korean speaking flashcards for a learner (native language ${lang}; goal: ${goalText()}; studying KIIP 중급 1 unit ${u.n} "${u.ko}" with grammar ${u.g.map(g=>g[0]).join(', ')}).
Topic: "${topic.slice(0,120)}". Sentences they would really SAY in Korea, polite style, under 14 words, using this unit's grammar where natural. Facts about Korea must be accurate.
Reply with only a JSON array: [{"t":"Korean sentence","m":"${lang} meaning"}]`,{modelTier:'default'});
    const have=new Set(S.mine.map(c=>norm(c.t)));let added=0;
    for(const x of Array.isArray(out)?out:[]){if(!x||typeof x.t!=='string'||typeof x.m!=='string'||have.has(norm(x.t)))continue;
      have.add(norm(x.t));S.mine.push({id:Date.now().toString(36)+added,t:x.t.slice(0,140),m:x.m.slice(0,140)});added++}
    save();renderHome();toast(`+${added}`);
  }catch(err){$('aiNote').textContent=err.code==='rate_limited'?l.rate:l.tutorFail}
  finally{const b=$('aiBtn');if(b)b.disabled=false}
}

/* ================= boot ================= */
(async()=>{try{sample=window.claude?await window.claude.use('sample'):null}catch(e){sample=null}if($('quiz').hidden&&$('setup').hidden)renderHome()})();
renderHome();
if(!S.setupDone)openSetup(false);
