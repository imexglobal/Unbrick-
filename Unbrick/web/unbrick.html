<title>Unbrick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: one phone column of frosted-glass panels over a dark aurora field; a lock "orb" panel leads, lessons scroll sideways. */
:root{
  --bg:#06070B; --bg2:#0D1018; --glass:rgba(255,255,255,.065); --glass-hi:rgba(255,255,255,.11); --hair:rgba(255,255,255,.11);
  --ink:#F5F5F7; --muted:#8E8E99; --accent:#0A84FF; --accent2:#5E5CE6; --on-accent:#FFFFFF;
  --good:#58CC02; --bad:#FF4B4B; --gram:#CE82FF; --pron:#FF9600; --info:#1CB0F6;
  --sheet:#11141C;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F2F2F7; --bg2:#E9EAF2; --glass:rgba(255,255,255,.72); --glass-hi:rgba(255,255,255,.92); --hair:rgba(0,0,0,.08);
  --ink:#1D1D1F; --muted:#6E6E78; --accent:#0071E3; --accent2:#5E5CE6; --on-accent:#FFFFFF;
  --good:#3F9A00; --bad:#E5383B; --gram:#9D4EDD; --pron:#D97700; --info:#1394CF;
  --sheet:#FFFFFF; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F2F2F7; --bg2:#E9EAF2; --glass:rgba(255,255,255,.72); --glass-hi:rgba(255,255,255,.92); --hair:rgba(0,0,0,.08);
  --ink:#1D1D1F; --muted:#6E6E78; --accent:#0071E3; --accent2:#5E5CE6; --on-accent:#FFFFFF;
  --good:#3F9A00; --bad:#E5383B; --gram:#9D4EDD; --pron:#D97700; --info:#1394CF;
  --sheet:#FFFFFF; color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 35% at 15% 10%,color-mix(in srgb,var(--accent2) 28%,transparent),transparent 70%),
             radial-gradient(35% 30% at 90% 25%,color-mix(in srgb,var(--info) 18%,transparent),transparent 70%),
             radial-gradient(45% 35% at 50% 100%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%)}
[lang="ko"]{word-break:keep-all}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:18px 56px;display:flex;flex-direction:column;gap:22px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent2),var(--info));display:inline-block}
.pills{display:flex;gap:8px}
.pill{font-family:var(--mono);font-size:12px;padding:6px 10px;border-radius:999px;background:var(--glass);border:1px solid var(--hair);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);white-space:nowrap}
.pill b{font-weight:700}

.glass{background:var(--glass);border:1px solid var(--hair);border-radius:24px;backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%)}
.lock{padding:22px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.lock-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.big{font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:1}
.timer{font-family:var(--mono);font-size:46px;font-weight:700;letter-spacing:-.02em;color:var(--good);line-height:1}
.orb{width:56px;height:56px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--accent2) 70%,white 10%),var(--accent) 70%);box-shadow:0 0 40px color-mix(in srgb,var(--accent) 55%,transparent);color:#fff}
.orb.open{background:radial-gradient(circle at 30% 30%,#9BE15D,var(--good) 70%);box-shadow:0 0 40px color-mix(in srgb,var(--good) 55%,transparent)}
.orb svg{width:24px;height:24px}
.sub{color:var(--muted);font-size:14px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{border:0;border-radius:16px;padding:14px 14px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:50px}
.btn-primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:var(--on-accent);box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn-glass{background:var(--glass-hi);border:1px solid var(--hair)}
.btn-good{background:var(--good);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--good) 60%,black)}
.btn-bad{background:var(--bad);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,black)}
.btn[disabled]{opacity:.45;cursor:default}
.btn small{display:block;font-weight:500;font-size:11px;opacity:.8}
.stack{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15}

section h2{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:12px}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px;font-size:15px}

.goal{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;color:inherit}
.goal .what{font-weight:700;font-size:17px}
.dday{font-family:var(--mono);font-weight:700;font-size:22px;background:linear-gradient(135deg,var(--accent2),var(--info));-webkit-background-clip:text;background-clip:text;color:transparent;flex:none}

.units{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.units::-webkit-scrollbar{display:none}
.unit{flex:none;width:150px;scroll-snap-align:start;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;color:inherit}
.unit .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.unit .ko{font-weight:700;font-size:17px}
.unit .tr{font-size:13px;color:var(--muted);min-height:2.6em}
.unit .bar{height:4px;border-radius:2px;background:var(--hair);overflow:hidden}
.unit .bar i{display:block;height:100%;background:var(--good)}
.unit[aria-pressed="true"]{border-color:color-mix(in srgb,var(--accent) 70%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 70%,transparent)}
.unit.locked{opacity:.5}

.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:16px}
.app{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.tile{width:100%;max-width:60px;aspect-ratio:1;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff;position:relative;transition:filter .2s,opacity .2s}
.app.blocked .tile{filter:grayscale(1) brightness(.7);opacity:.6}
.badge{position:absolute;right:-5px;bottom:-5px;width:22px;height:22px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);display:grid;place-items:center;color:#fff}
.badge svg{width:11px;height:11px}
.editing .tile{outline:2px dashed var(--hair);outline-offset:3px}

.list{padding:4px 16px}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:13px;border-bottom:1px solid var(--hair)}
.li:last-child{border-bottom:0}
.li .k{font-weight:500}
.small{font-size:13px;color:var(--muted)}
.field{background:var(--glass-hi);border:1px solid var(--hair);border-radius:14px;padding:12px 14px;min-width:0;width:100%}
.addform{display:grid;gap:8px;padding-block:14px}
.r{display:flex;gap:8px}
.r .field{flex:1}
.mine{list-style:none;margin:0;padding:0}
.mine li{display:flex;align-items:center;gap:10px;padding-block:10px;border-top:1px solid var(--hair)}
.mine li div{flex:1;min-width:0}
.mine .ko{font-weight:600;overflow-wrap:anywhere}
.x{background:none;border:0;color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.mem{display:flex;gap:4px;align-items:flex-end;height:28px}
.mem i{width:12px;border-radius:3px 3px 0 0;background:linear-gradient(var(--info),var(--accent))}

/* Duolingo-style highlights */
mark.g{background:color-mix(in srgb,var(--gram) 18%,transparent);color:var(--gram);border-radius:6px;padding:0 3px;font-weight:700;border-bottom:2px solid color-mix(in srgb,var(--gram) 60%,transparent);cursor:help}
ruby.p{ruby-position:over}
ruby.p rb,ruby.p>span{color:var(--pron);font-weight:700;border-bottom:2px dotted var(--pron)}
ruby.p rt{color:var(--pron);font-size:.5em;font-weight:700;letter-spacing:.02em}
.syl.ok{color:var(--good)}
.syl.no{color:var(--bad);text-decoration:underline wavy;text-underline-offset:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px}
.chip.g{background:color-mix(in srgb,var(--gram) 16%,transparent);color:var(--gram)}
.chip.p{background:color-mix(in srgb,var(--pron) 16%,transparent);color:var(--pron)}
.chip.i{background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info)}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--gram);color:var(--gram);text-align:center;line-height:1.2}
.tip{border-radius:16px;padding:12px 14px;font-size:14px;display:grid;gap:4px}
.tip b{font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.tip.i{background:color-mix(in srgb,var(--info) 12%,transparent);border:1px solid color-mix(in srgb,var(--info) 35%,transparent)}
.tip.i b{color:var(--info)}
.tip.g{background:color-mix(in srgb,var(--gram) 12%,transparent);border:1px solid color-mix(in srgb,var(--gram) 35%,transparent)}
.tip.g b{color:var(--gram)}
.tip.p{background:color-mix(in srgb,var(--pron) 12%,transparent);border:1px solid color-mix(in srgb,var(--pron) 35%,transparent)}
.tip.p b{color:var(--pron)}
.fixrow{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.wrong{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.right{color:var(--good);font-weight:700}

/* overlays */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.overlay::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(40% 30% at 20% 0%,color-mix(in srgb,var(--accent2) 22%,transparent),transparent 70%)}
.ov{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:16px 200px;min-height:100%;display:flex;flex-direction:column;gap:18px}
.qtop{display:flex;align-items:center;gap:12px}
.close{background:none;border:0;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.prog{flex:1;height:14px;border-radius:7px;background:var(--glass-hi);overflow:hidden;border:1px solid var(--hair)}
.prog i{display:block;height:100%;border-radius:7px;background:var(--good);transition:width .4s cubic-bezier(.2,.8,.2,1);box-shadow:inset 0 -4px 0 color-mix(in srgb,black 15%,transparent)}
.kind{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prompt{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.3;margin:0;text-wrap:balance}
.prompt[lang="ko"]{line-height:1.9}
.card{flex:1;display:flex;flex-direction:column;gap:16px}
.partner{padding:14px 16px;display:grid;gap:6px}
.partner .who{font-size:12px;font-weight:700;color:var(--muted)}
.partner .ko{font-size:17px;line-height:1.7}
.meaning{color:var(--muted);font-size:15px}
.answer{padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.answer .t{font-weight:700;font-size:21px;min-width:0;overflow-wrap:anywhere;line-height:1.8}
.iconbtn{flex:none;width:46px;height:46px;border-radius:14px;border:1px solid var(--hair);background:var(--glass-hi);display:grid;place-items:center;color:var(--ink)}
.iconbtn svg,.btn svg{width:20px;height:20px}
.mic{width:104px;height:104px;border-radius:50%;border:0;color:#fff;display:grid;place-items:center;align-self:center;
  background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--accent2) 80%,white 10%),var(--accent) 75%);box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 14%,transparent),0 12px 40px color-mix(in srgb,var(--accent) 45%,transparent)}
.mic svg{width:38px;height:38px}
.mic.live{animation:pulse 1.2s ease-in-out infinite;background:radial-gradient(circle at 30% 30%,#FF8A8A,var(--bad) 75%);box-shadow:0 0 0 14px color-mix(in srgb,var(--bad) 18%,transparent)}
@keyframes pulse{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.mic.live{animation:none}.prog i{transition:none}}
.heard{text-align:center;color:var(--muted);min-height:1.4em}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--glass);border:2px solid var(--hair);border-radius:16px;padding:14px 16px;font-weight:600;box-shadow:0 3px 0 var(--hair)}
.opt.right{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.opt.wrong{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:11;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--hair)}
.foot-in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foot-in .full{grid-column:1/-1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:12;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:2px solid;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet.ok{background:color-mix(in srgb,var(--good) 14%,var(--sheet));border-color:color-mix(in srgb,var(--good) 50%,transparent)}
.sheet.no{background:color-mix(in srgb,var(--bad) 12%,var(--sheet));border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.sheet-in{max-width:460px;margin:0 auto;display:grid;gap:12px;max-height:60vh;overflow:auto}
.sheet h3{margin:0;font-size:22px;font-weight:800;display:flex;align-items:center;gap:10px}
.sheet.ok h3{color:var(--good)} .sheet.no h3{color:var(--bad)}
.sheet .syls{font-size:22px;font-weight:700;line-height:1.7}
@keyframes up{from{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.result{align-items:center;text-align:center;justify-content:center}
.score{font-family:var(--mono);font-weight:700;font-size:72px;letter-spacing:-.04em;background:linear-gradient(135deg,var(--good),var(--info));-webkit-background-clip:text;background-clip:text;color:transparent}

/* setup */
.setup h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:0;text-wrap:balance}
.step{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.choices{display:grid;gap:10px}
.choice{text-align:left;padding:14px 16px;display:grid;gap:2px;color:inherit}
.choice b{font-size:16px}
.choice span{color:var(--muted);font-size:13px}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.seg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.seg button{border:1px solid var(--hair);background:var(--glass);border-radius:12px;padding:10px 0;font-family:var(--mono);font-weight:700}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.lbl{font-weight:600;display:block;margin-bottom:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* shield */
.shield-in{justify-content:center;text-align:center;align-items:center;padding-block:40px}
.shield-in .tile{width:84px;max-width:84px;font-size:34px;filter:grayscale(1)}
.shield-in h1{font-size:32px;font-weight:800;letter-spacing:-.03em;margin:0;text-wrap:balance}
.shield-in p{color:var(--muted);margin:0;max-width:32ch}
.shield-in .actions{display:grid;gap:10px;width:100%}

/* tutor */
.chat{flex:1;display:flex;flex-direction:column;gap:14px}
.msg{max-width:92%;display:grid;gap:8px}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border-radius:20px 20px 6px 20px;padding:10px 14px}
.msg.tutor{align-self:flex-start;border-radius:20px 20px 20px 6px;padding:12px 14px}
.msg .q{display:flex;gap:10px;align-items:flex-start}
.msg .q div{flex:1;min-width:0}
.msg .q .ko{font-size:19px;font-weight:700}
.composer{display:flex;gap:8px}
.composer .field{flex:1;font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--glass-hi);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--hair);color:var(--ink);padding:12px 16px;border-radius:16px;font-size:14px;z-index:30;max-width:calc(100% - 32px);box-shadow:0 12px 40px rgba(0,0,0,.3)}
.toast.g{border-color:color-mix(in srgb,var(--gram) 50%,transparent)}
/* review & progress */
.seg2{display:flex;background:var(--glass);border:1px solid var(--hair);border-radius:12px;padding:3px;gap:3px}
.seg2 button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:600;font-size:13px;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--glass-hi);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{padding:14px 16px;display:grid;gap:2px}
.stat .v{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;color:var(--muted)}
.ringwrap{display:flex;align-items:center;gap:18px;padding:18px}
.ring{width:92px;height:92px;flex:none}
.ring text{font-family:var(--mono);font-weight:700;fill:var(--ink)}
.grp{padding:0;overflow:hidden}
.grp-h{width:100%;background:none;border:0;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;color:inherit}
.grp-h .t{font-weight:700}
.grp-h .s{font-size:13px;color:var(--muted)}
.grp-h .bar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--hair);overflow:hidden;display:flex}
.grp-h .bar i{display:block;height:100%}
.grp-b{padding:0 16px 12px}
.ritem{display:grid;gap:6px;padding-block:12px;border-top:1px solid var(--hair)}
.ritem .top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ritem .ko{font-weight:600;line-height:1.85;min-width:0;overflow-wrap:anywhere}
.ritem .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--hair)}
.dots i.on{background:var(--good)}
.sp{font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:999px;font-weight:700;font-variant-numeric:tabular-nums}
.sp.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.sp.mid{background:color-mix(in srgb,var(--pron) 16%,transparent);color:var(--pron)}
.sp.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.sp.new{background:var(--glass-hi);color:var(--muted)}
.mini{min-height:36px;padding:6px 12px;font-size:13px;border-radius:12px}
/* tutor answer ideas */
.sugs{display:grid;gap:8px}
.sug{padding:10px 12px;border-radius:14px;display:grid;gap:4px;border:1px solid var(--hair);background:var(--glass-hi)}
.sug .lv{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.sug.casual .lv{color:var(--info)} .sug.polite .lv{color:var(--good)} .sug.formal .lv{color:var(--gram)}
.sug .row{display:flex;gap:8px;align-items:center;justify-content:space-between}

   ["후엔","그래요? 걱정되시겠어요. 그럼 아이한테 동아리나 봉사 활동을 시키면 어떨까요? 우리 아이는 봉사 활동을 한 후부터 성격이 외향적이고 밝아[[진]] 것 같아요.","Really? You must be worried. How about a club or volunteering? My child became more outgoing and cheerful after volunteering.","Правда? Вы, наверное, волнуетесь. Может, записать его в кружок или на волонтёрство? Мой ребёнок после волонтёрства стал общительнее и веселее."],
   ["고천","그렇군요. 이따 집에 가서 우리 아이하고 얘기해 볼게요. 고마워요.","I see. I'll talk with him when I get home. Thanks.","Понятно. Дома поговорю с ним. Спасибо."]]},
 {n:3,ko:"지역 복지 서비스",en:"Local welfare services",ru:"Социальные услуги района",
  g:[["-는지 알다/모르다","Know / not know whether or what…","Знать / не знать, (ли)…"],["-다가","Was doing A, then switched to B","Делал A, а потом перешёл к B"]],
  p:{rule:"이중 모음 '의'",en:"의 that isn't the first syllable may be said [의] or [이].",ru:"의 не в начале слова читается [의] или [이].",
   s:[["다른 {{문의|무늬}} 사항은 없으세요?","Do you have any other questions?","Других вопросов нет?"],
      ["공항에 무슨 {{편의|펴늬}} 시설이 있어요?","What amenities are there at the airport?","Какие удобства есть в аэропорту?"],
      ["그 문제에 대해서는 현재 {{논의|노늬}}가 활발하다.","That issue is being actively discussed now.","Этот вопрос сейчас активно обсуждается."]]},
  me:"후엔",d:[
   ["후엔","어머, 미호 씨. 컴퓨터를 배우세요?","Oh, Miho! Are you learning computers?","Ой, Михо! Вы учитесь работать на компьютере?"],
   ["미호","네, 혼자 책 보고 공부하[[다가]] 요즘은 동네에 있는 문화 체육 센터에서 배우고 있어요.","Yes, I was studying alone from books, and now I'm learning at the neighborhood culture and sports center.","Да, сначала занималась сама по книгам, а теперь учусь в районном культурно-спортивном центре."],
   ["후엔","와, 저는 우리 동네에 그런 시설이 있[[는지 몰랐어요]]. 수업은 언제 해요?","Wow, I didn't know we had a place like that. When are classes?","Ого, я не знала, что у нас есть такое место. Когда занятия?"],
   ["미호","매주 화요일과 목요일 오후 7시부터 8시까지 해요. 요리, 수영, 컴퓨터 등 다양한 프로그램이 있으니까 한번 알아보세요.","Every Tuesday and Thursday, 7 to 8 p.m. There's cooking, swimming, computers and more, so take a look.","Каждый вторник и четверг с 7 до 8 вечера. Есть кулинария, плавание, компьютер и другое — посмотрите."],
   ["후엔","그렇군요. 저도 알아봐야겠어요.","I see. I should look into it too.","Понятно. Надо и мне узнать."],
   ["미호","매달 마지막 주에 일주일 동안 신청을 받아요. 자세한 것은 문화 체육 센터 홈페이지에 나와 있으니까 들어가 보세요.","Applications open for a week in the last week of each month. Details are on the center's website.","Запись идёт неделю, в последнюю неделю месяца. Подробности на сайте центра."]]},
 {n:4,ko:"교환과 환불",en:"Exchanges & refunds",ru:"Обмен и возврат",
  g:[["-을 만하다","Worth doing / good enough to…","Стоит (сделать) / вполне можно…"],["-어 가지고","Because… / and then (casual speech)","Из-за того что… / и потом (разговорное)"]],
  p:{rule:"연음",en:"A final consonant moves into the next syllable when it starts with a vowel.",ru:"Конечная согласная переходит в следующий слог, если он начинается с гласной.",
   s:[["이 옷은 따뜻해서 환절기에 {{입을 만해요|이블 만해요}}.","These clothes are warm, so they're good between seasons.","Эта одежда тёплая, её стоит носить в межсезонье."],
      ["많은 사람들이 줄을 서서 {{먹을 만해요|머글 만해요}}.","Lots of people line up — it's worth eating.","Многие стоят в очереди — стоит попробовать."],
      ["한국 소설 중에서 {{읽을 만한|일글 만한}} 책 좀 소개해 주세요.","Please recommend a Korean novel worth reading.","Посоветуйте корейский роман, который стоит прочитать."]]},
  me:"라흐만",d:[
   ["직원","어서 오세요. 무엇을 도와드릴까요?","Welcome. How can I help you?","Добро пожаловать. Чем могу помочь?"],
   ["라흐만","어제 산 건데 단추가 떨어져 [[가지고]] 교환하고 싶은데요.","I bought this yesterday, but a button came off, so I'd like to exchange it.","Купил это вчера, но оторвалась пуговица, хочу обменять."],
   ["직원","아, 그러세요? 잠시 제품 먼저 확인해 보겠습니다. 이거 새 제품인데 색상이나 디자인이 맞는지 확인해 보시겠어요?","Oh, I see. Let me check the item first. Here's a new one — could you check the color and design?","Вот как? Сначала проверю товар. Вот новый — проверьте цвет и фасон."],
   ["라흐만","이거 좋습니다.","This one is good.","Этот подходит."],
   ["직원","그럼 이걸로 교환해 드리겠습니다. 결제하신 카드하고 영수증은 가지고 오셨지요?","Then I'll exchange it for this one. You brought the card you paid with and the receipt, right?","Тогда обменяю на этот. Карту, которой платили, и чек принесли?"],
   ["라흐만","네, 여기요.","Yes, here.","Да, вот."],
   ["직원","이 제품도 교환이나 환불 원하시면 일주일 이내에 가격표 제거하지 마시고 가져오세요.","If you want to exchange or refund this one too, bring it within a week with the price tag on.","Если захотите обменять или вернуть и этот товар, принесите в течение недели, не снимая ценник."]]},
 {n:5,ko:"소비와 절약",en:"Spending & saving",ru:"Расходы и экономия",
  g:[["이나 / 밖에","이나 = as much as (surprisingly many); 밖에 + negative = only","이나 — целых (удивительно много); 밖에 + отрицание — только"],["-는다고 하다","Reported speech: “They say…”","Косвенная речь: «Говорят, что…»"]],
  p:{rule:"경음화",en:"After [ㄱ/ㄷ/ㅂ], ㄱㄷㅂㅅㅈ become tense [ㄲㄸㅃㅆㅉ].",ru:"После [ㄱ/ㄷ/ㅂ] ㄱㄷㅂㅅㅈ становятся напряжёнными [ㄲㄸㅃㅆㅉ].",
   s:[["저렴하게 살 수 {{있었다고|이썯따고}} 합니다.","They say it could be bought cheaply.","Говорят, его можно было купить дёшево."],
      ["할인된 가격에 구입할 수 {{있습니다|읻씀니다}}.","You can buy it at a discounted price.","Можно купить по сниженной цене."],
      ["너무 추워서 계속 보일러를 {{틀었거든요|트럳꺼든요}}.","It was so cold that I kept the heating on.","Было так холодно, что я всё время включал отопление."]]},
  me:"후엔",d:[
   ["아주머니","후엔 씨, 뭘 그렇게 보고 있어요?","Huyen, what are you looking at so closely?","Хуен, что вы так рассматриваете?"],
   ["후엔","이번 달 난방비가 29만 원[[이나]] 나왔어요. 생각보다 너무 많이 나와서 어떻게 해야 할지 모르겠어요.","This month's heating bill was a whole 290,000 won! Much more than I expected — I don't know what to do.","За отопление в этом месяце пришло целых 290 000 вон! Гораздо больше, чем я думала, не знаю, что делать."],
   ["아주머니","어떻게 그렇게 많이 나왔어요?","How did it come out so high?","Как так много набежало?"],
   ["후엔","한국 겨울 날씨가 너무 추워서 계속 보일러를 {{틀었거든요|트럳꺼든요}}.","Korean winters are so cold that I kept the boiler on.","Корейская зима такая холодная, что я всё время включала отопление."],
   ["아주머니","그렇게 하면 안 돼요. 그럴 때는 온도를 조금 내리고 옷을 따뜻하게 입는 게 난방비를 절약할 수 있는 방법이[[라고 해요]].","You shouldn't do that. They say the way to save on heating is to turn it down a bit and dress warmly.","Так нельзя. Говорят, чтобы сэкономить на отоплении, надо немного убавить температуру и тепло одеваться."]]},
 {n:6,ko:"주거 환경",en:"Living environment",ru:"Жилая среда",
  g:[["피동 (passive)","Passive verbs: 보이다, 막히다, 잡히다…","Страдательные глаголы: 보이다, 막히다, 잡히다…"],["-자고 하다","Reported suggestion: “said let's…”","Передача предложения: «предложил…»"]],
  p:{rule:"격음화 (ㅎ)",en:"ㅎ next to ㄱ/ㄷ/ㅂ/ㅈ merges into [ㅋ/ㅌ/ㅍ/ㅊ]: 좋다 → [조타].",ru:"ㅎ рядом с ㄱ/ㄷ/ㅂ/ㅈ даёт [ㅋ/ㅌ/ㅍ/ㅊ]: 좋다 → [조타].",
   s:[["길이 많이 {{막히네요|마키네요}}.","The roads are really jammed.","Дороги сильно забиты."],
      ["범인이 드디어 {{잡혔어요|자펴써요}}.","The criminal was finally caught.","Преступника наконец поймали."],
      ["부모님은 고향이 {{좋다고|조타고}} 하세요.","My parents say they like their hometown.","Родители говорят, что им нравится родной край."]]},
  me:"후엔",d:[
   ["이웃","안녕하세요? 저, 어제 이 동네로 이사 왔는데요.","Hello. I moved into this neighborhood yesterday.","Здравствуйте. Я вчера переехала в этот район."],
   ["후엔","아, 그러세요? 반가워요.","Oh, really? Nice to meet you.","Правда? Рада знакомству."],
   ["이웃","아이가 놀러 가[[자고 해서]] 그러는데 혹시 동네에 아이가 놀 만한 곳이 있나요?","My child keeps asking to go play — is there a good place for kids around here?","Ребёнок просится гулять — есть поблизости место, где детям можно поиграть?"],
   ["후엔","105동 앞에 놀이터가 있어요. 그리고 아이가 자전거 타는 것을 좋아하면 산책로에 가는 것도 좋아요. 놀이터에서 산책로 입구가 [[보일]] 거예요.","There's a playground in front of Building 105. If your child likes biking, the walking trail is good too. You'll see the trail entrance from the playground.","Перед корпусом 105 есть площадка. А если ребёнок любит велосипед, можно пойти на прогулочную дорожку. Вход на неё видно с площадки."],
   ["이웃","그렇군요. 정말 감사합니다. 여쭤보길 잘했네요.","I see. Thank you so much. I'm glad I asked.","Понятно. Большое спасибо. Хорошо, что спросила."],
   ["후엔","궁금한 게 있으면 또 물어보세요.","If you have questions, ask any time.","Если что-то будет интересно, спрашивайте."]]},
 {n:7,ko:"문화생활",en:"Cultural life",ru:"Культурная жизнь",
  g:[["-으라고 / -냐고 하다","Reported command / reported question","Передача приказа / передача вопроса"],["만큼","As much as / to the same degree as","Так же, как / настолько, как"]],
  p:{rule:"경음화",en:"After [ㄱ/ㄷ/ㅂ], ㄱㄷㅂㅅㅈ become tense [ㄲㄸㅃㅆㅉ].",ru:"После [ㄱ/ㄷ/ㅂ] ㄱㄷㅂㅅㅈ становятся напряжёнными [ㄲㄸㅃㅆㅉ].",
   s:[["공연 {{입장권|입짱꿘}}을 보여 주세요.","Please show your ticket.","Покажите, пожалуйста, билет."],
      ["{{앞좌석|압쫘석}}에 앉아 있어요.","I'm sitting in the front seat.","Я сижу на переднем месте."],
      ["{{택배|택빼}}는 문 앞에 놓아 주세요.","Please leave the parcel at the door.","Посылку оставьте у двери, пожалуйста."]]},
  me:"아나이스",d:[
   ["라민","오늘 본 연극 어땠어요?","How was the play today?","Как вам сегодняшний спектакль?"],
   ["아나이스","저는 계속 웃다가 울다가 했어요.","I kept laughing and crying.","Я то смеялась, то плакала."],
   ["라민","어떤 장면이 가장 인상적이었어요?","Which scene impressed you most?","Какая сцена впечатлила больше всего?"],
   ["아나이스","제일 마지막에 배우들이 모두 같이 춤추는 장면이 기억에 남아요.","The very last scene, where all the actors dance together, stays with me.","Запомнилась самая последняя сцена, где все актёры танцуют вместе."],
   ["라민","저는 배우들의 표정까지 다 볼 수 있어서 좋았어요.","I liked that I could even see the actors' faces.","Мне понравилось, что было видно даже лица актёров."],
   ["아나이스","맞아요. 저도 이번[[만큼]] 무대 가까이에서 연극을 본 적이 없어요.","Right. I've never watched a play as close to the stage as this time.","Точно. Я ещё никогда не смотрела спектакль так близко к сцене, как сейчас."],
   ["라민","제 친구가 이 연극을 추천할 때 꼭 {{앞좌석|압쫘석}}에서 보[[라고 했거든요]].","When my friend recommended this play, they told me to sit in the front.","Друг, когда советовал спектакль, сказал обязательно сесть впереди."],
   ["아나이스","{{앞좌석|압쫘석}}은 정말 좋은 선택이었어요. 우리 또 공연 같이 봐요.","The front seats were a great choice. Let's see a show together again.","Первые ряды — отличный выбор. Давайте ещё сходим вместе."]]},
 {n:8,ko:"음식과 요리",en:"Food & cooking",ru:"Еда и кулинария",
  g:[["사동 (causative)","Causative verbs — make something happen: 끓이다, 익히다, 먹이다","Каузативные глаголы — вызвать действие: 끓이다, 익히다, 먹이다"]],
  p:{rule:"연음 (ㄲ, ㄹ)",en:"Final ㄲ or ㄹ carries over to a following vowel: 볶아요 → [보까요].",ru:"Конечные ㄲ и ㄹ переходят к следующей гласной: 볶아요 → [보까요].",
   s:[["감자하고 당근을 {{볶아요|보까요}}.","Stir-fry the potatoes and carrots.","Обжарьте картошку и морковь."],
      ["쇠고기 {{볶음밥을|보끔바블}} 만들어 볼게요.","I'll make beef fried rice.","Приготовлю жареный рис с говядиной."],
      ["양파 {{껍질은|껍찌른}} 한 개만 벗기면 될까요?","Should I peel just one onion?","Почистить только одну луковицу?"]]},
  me:"후엔",d:[
   ["후엔","제가 요즘 속이 좋지 않아 밥을 못 먹는데 어떤 음식을 만들어 먹으면 좋을까요?","My stomach has been bad lately and I can't eat rice. What should I make?","У меня последнее время болит живот, не могу есть рис. Что приготовить?"],
   ["고천","소화가 잘 되는 야채죽은 어때요? 요리하기도 아주 쉬워요.","How about vegetable porridge? It's easy to digest and very easy to make.","Как насчёт овощной каши? Легко переваривается и очень просто готовится."],
   ["후엔","어떻게 만들어요? 좀 가르쳐 주세요.","How do you make it? Please teach me.","Как её готовить? Научите, пожалуйста."],
   ["고천","먼저 밥에 물을 넣고 [[끓인]] 다음 채소를 썰어 넣고 [[끓여요]].","First add water to the rice and bring it to a boil, then chop the vegetables, add them and boil.","Сначала залейте рис водой и вскипятите, потом нарежьте овощи, добавьте и варите."],
   ["후엔","얼마나요?","For how long?","Сколько варить?"],
   ["고천","큰 채소가 익을 때까지 [[끓이]]면 돼요. 오래 걸리지 않아요. 간단해요.","Boil until the big vegetables are cooked. It doesn't take long. It's simple.","Варите, пока крупные овощи не сварятся. Это недолго. Всё просто."],
   ["후엔","우와! 생각보다 어렵지 않네요. 집에서 만들어 먹어야겠어요.","Wow! Easier than I thought. I'll make it at home.","Ух ты! Проще, чем я думала. Приготовлю дома."],
   ["고천","그래요. 만들다가 모르는 게 있으면 언제든지 저한테 물어보세요.","Sure. If anything's unclear while cooking, ask me any time.","Хорошо. Если что-то будет непонятно, спрашивайте в любое время."]]},
 {n:9,ko:"고장과 수리",en:"Breakdowns & repairs",ru:"Поломки и ремонт",
  g:[["-어서 그런지","Maybe because… (a guessed reason)","Может, потому что… (предполагаемая причина)"],["-나요? / -은가요?","Soft, polite question","Мягкий вежливый вопрос"]],
  p:{rule:"한자어 경음화",en:"In Sino-Korean words, ㄷ/ㅅ/ㅈ after ㄹ become tense [ㄸ/ㅆ/ㅉ].",ru:"В сино-корейских словах ㄷ/ㅅ/ㅈ после ㄹ становятся напряжёнными [ㄸ/ㅆ/ㅉ].",
   s:[["고객의 무리한 요구 때문에 {{갈등|갈뜽}}이 자주 생겨요.","Conflicts often arise from customers' unreasonable demands.","Из-за необоснованных требований клиентов часто возникают конфликты."],
      ["와이파이가 안 되는 것은 {{일시적|일씨적}}인 문제예요.","The Wi-Fi not working is a temporary problem.","То, что не работает Wi-Fi, — временная проблема."],
      ["냉장고가 고장 나면 {{출장|출짱}} 서비스를 신청하세요.","If the fridge breaks, request a home repair visit.","Если холодильник сломается, вызовите мастера на дом."]]},
  me:"아나이스",d:[
   ["아나이스","노트북에 문제가 있어서 서비스 문의 좀 드리려고 하는데요.","I have a problem with my laptop and want to make a service inquiry.","У меня проблема с ноутбуком, хочу обратиться в сервис."],
   ["직원","네, 고객님. 어떤 문제가 있는지 말씀해 주시겠어요?","Yes, of course. Could you tell me what the problem is?","Да, слушаю вас. Расскажите, в чём проблема?"],
   ["아나이스","어제부터 전원이 안 켜지는데 어떻게 해야 되[[나요]]?","Since yesterday it won't turn on. What should I do?","Со вчерашнего дня не включается. Что мне делать?"],
   ["직원","갑자기 문제가 생긴 건[[가요]]? 혹시 다른 문제는 없으셨어요?","Did the problem start suddenly? Were there any other issues?","Проблема появилась внезапно? Других неполадок не было?"],
   ["아나이스","며칠 전부터 속도가 좀 느려졌어요.","It's been a bit slow for a few days.","Несколько дней назад он стал медленнее."],
   ["직원","고객님, 가까운 서비스 센터에 방문하셔서 점검을 받아 보셔야 할 것 같습니다.","I think you should visit a nearby service center for an inspection.","Думаю, вам стоит обратиться в ближайший сервисный центр на диагностику."],
   ["아나이스","아, 그래요? 그럼 예약 좀 부탁드려요.","Oh, really? Then please book me in.","Ах так? Тогда запишите меня, пожалуйста."]]},
 {n:10,ko:"취업",en:"Getting a job",ru:"Трудоустройство",
  g:[["-기 위해서","In order to","Для того чтобы"],["-어 놓다","Do in advance and keep the result","Сделать заранее (результат сохраняется)"]],
  p:{rule:"경음화",en:"After [ㄱ/ㄷ/ㅂ], ㄱㄷㅂㅅㅈ become tense [ㄲㄸㅃㅆㅉ].",ru:"После [ㄱ/ㄷ/ㅂ] ㄱㄷㅂㅅㅈ становятся напряжёнными [ㄲㄸㅃㅆㅉ].",
   s:[["교사 {{자격증|자격쯩}}을 땄습니다.","I got a teaching certificate.","Я получил(а) сертификат учителя."],
      ["{{이력서|이력써}}를 어떻게 써야 돼요?","How should I write a résumé?","Как нужно писать резюме?"],
      ["{{경력 증명서|경녁 쯩명서}}를 제출해 주세요.","Please submit a certificate of work experience.","Предоставьте, пожалуйста, справку о стаже работы."]]},
  me:"아나이스",d:[
   ["라흐만","아나이스 씨는 무슨 일을 하고 싶어요?","Anaïs, what kind of work do you want to do?","Анаис, кем вы хотите работать?"],
   ["아나이스","네, 저는 무역 회사에 취직하고 싶어요.","I want to get a job at a trading company.","Я хочу устроиться в торговую компанию."],
   ["라흐만","아, 그러세요? 아나이스 씨는 한국말을 어느 정도 할 수 있으니까 문제없을 거예요.","Oh, really? You speak Korean fairly well, so it won't be a problem.","Правда? Вы неплохо говорите по-корейски, так что проблем не будет."],
   ["아나이스","그런데 한국에서 일하[[기 위해서]] 무엇이 필요해요?","But what do I need in order to work in Korea?","А что нужно, чтобы работать в Корее?"],
   ["라흐만","무역 회사에 취직하려면 컴퓨터를 할 줄 알아야 해요. 그러니까 {{이력서|이력써}}를 정성껏 쓰고 컴퓨터 {{자격증|자격쯩}}도 미리 따 [[놓으세요]].","For a trading company you need computer skills. So write your résumé carefully and get a computer certificate in advance.","Для торговой компании нужно уметь работать на компьютере. Так что старательно напишите резюме и заранее получите компьютерный сертификат."],
   ["아나이스","네, 그럴게요.","OK, I will.","Хорошо, так и сделаю."]]},
 {n:11,ko:"부동산",en:"Real estate",ru:"Недвижимость",
  g:[["-는 데다가","On top of / besides","К тому же / вдобавок"],["-는다","Plain written style (diaries, essays, news)","Нейтральный письменный стиль (дневник, эссе)"]],
  p:{rule:"비음화",en:"[ㅂ/ㄷ/ㄱ] before ㄴ or ㅁ become [ㅁ/ㄴ/ㅇ].",ru:"[ㅂ/ㄷ/ㄱ] перед ㄴ или ㅁ становятся [ㅁ/ㄴ/ㅇ].",
   s:[["건강을 위해서 아침에는 밥을 꼭 {{먹는|멍는}} 편이다.","For my health, I always try to eat breakfast.","Ради здоровья я обычно обязательно завтракаю."],
      ["나는 비가 올 때 혼자 음악 {{듣는|든는}} 것을 좋아한다.","I like listening to music alone when it rains.","Я люблю слушать музыку в одиночестве, когда идёт дождь."],
      ["애나 씨는 옷을 잘 {{입는|임는}} 데다가 성격도 좋아서 인기가 많다.","Anna dresses well and is nice, so she's popular.","Анна хорошо одевается, да ещё и характер хороший, поэтому она популярна."]]},
  me:"라민",d:[
   ["라민","안녕하세요? 집 좀 보려고 하는데요.","Hello. I'd like to look at a place.","Здравствуйте. Хочу посмотреть жильё."],
   ["중개인","어서 오세요. 어떤 집을 구하세요?","Welcome. What kind of place are you looking for?","Проходите. Какое жильё ищете?"],
   ["라민","방 두 개인 월세 빌라를 찾고 있어요.","I'm looking for a two-room villa apartment on monthly rent.","Ищу квартиру в вилле с двумя комнатами, помесячная аренда."],
   ["중개인","잠깐만요. 마침 새로 나온 집이 있어요. 남향인 [[데다가]] 새로 수리해서 깨끗하고요.","One moment. A new one just came up. It faces south and it's clean, newly renovated too.","Минутку. Как раз есть новый вариант. Окна на юг, к тому же после ремонта — чисто."],
   ["라민","아, 그래요? 근처에 지하철역이 있으면 좋겠어요.","Oh, really? I'd like a subway station nearby.","Правда? Хорошо бы рядом было метро."],
   ["중개인","네, 있어요. 걸어서 5분 거리에 지하철이 있어요. 한번 보시겠어요?","Yes. The subway is a five-minute walk. Would you like to see it?","Да, есть. Метро в пяти минутах пешком. Посмотрите?"],
   ["라민","네, 지금 바로 보여 주세요.","Yes, please show me right now.","Да, покажите прямо сейчас."]]},
 {n:12,ko:"전통 명절",en:"Traditional holidays",ru:"Традиционные праздники",
  g:[["-어도","Even if / no matter how","Даже если / как бы ни"],["-게 되다","End up / come to (a change)","Получилось так, что / в итоге стать"]],
  p:{rule:"유음화",en:"ㄴ next to ㄹ becomes [ㄹ].",ru:"ㄴ рядом с ㄹ становится [ㄹ].",
   s:[["{{설날|설랄}}에 뭐 해요?","What do you do on Seollal (Lunar New Year)?","Что вы делаете на Соллаль (Лунный Новый год)?"],
      ["동지는 {{일 년|일 련}} 중 가장 밤이 길다.","The winter solstice has the longest night of the year.","В зимнее солнцестояние самая длинная ночь в году."],
      ["오랜만에 친척들과 {{연락|열락}}을 했다.","I got in touch with my relatives after a long time.","Я давно не общался с родственниками и наконец связался с ними."]]},
  me:"안젤라",d:[
   ["과장님","안젤라 씨, 명절 잘 보냈어요?","Angela, did you have a good holiday?","Анджела, хорошо провели праздники?"],
   ["안젤라","네. 잘 보냈어요. 과장님도 연휴 동안 잘 지내셨어요?","Yes, I did. Did you have a good break too?","Да, хорошо. А вы хорошо отдохнули?"],
   ["과장님","고향 부모님 댁에 다녀왔어요. 아무리 바빠[[도]] 명절에는 부모님을 뵈러 가니까요. 그런데 안젤라 씨, {{설날|설랄}}에 떡국 먹었어요?","I visited my parents back home. However busy I am, I go see them on holidays. By the way, did you eat tteokguk on Seollal?","Ездил к родителям. Как бы ни был занят, на праздники навещаю их. Кстати, вы ели ттоккук на Соллаль?"],
   ["안젤라","아니요. {{설날|설랄}}에 떡국을 먹어야 해요?","No. Do you have to eat tteokguk on Seollal?","Нет. А на Соллаль обязательно есть ттоккук?"],
   ["과장님","그럼요. 안젤라 씨, 한국에서는 해가 바뀔 때 나이가 한 살 많아지잖아요. 그런데 한국 사람들은 {{설날|설랄}}에 떡국을 먹어야 나이가 한 살 더 많아진다고 생각하거든요.","Of course. In Korea you get a year older when the year changes, right? And Koreans feel you only get older by eating tteokguk on Seollal.","Конечно. В Корее ведь с новым годом становишься на год старше. А корейцы считают, что стать старше можно, только съев ттоккук на Соллаль."],
   ["안젤라","그래요? 그래서 생일이 안 지났는데 한국 나이로는 한 살이 더 많은 거군요. 과장님 덕분에 한국 문화를 잘 알[[게 됐어요]].","Really? So that's why I'm a year older in Korean age before my birthday. Thanks to you, I've come to understand Korean culture.","Правда? Вот почему по корейскому счёту я старше на год, хотя день рождения не прошёл. Благодаря вам я хорошо узнала корейскую культуру."]]},
 {n:13,ko:"직장 생활",en:"Work life",ru:"Жизнь на работе",
  g:[["-게 하다","Make or let someone do something","Заставить / позволить кому-то сделать"],["-어 가다","Gradually keep going (ongoing progress)","Постепенно продолжать (процесс)"]],
  p:{rule:"ㄴ 첨가",en:"In compounds, [ㄴ] is added before 이/야/여/요/유: 일 → [닐].",ru:"В сложных словах перед 이/야/여/요/유 добавляется [ㄴ]: 일 → [닐].",
   s:[["무슨 {{안 좋은 일|안 조은 닐}} 있어요?","Did something bad happen?","Что-то плохое случилось?"],
      ["저는 {{급한 일|그판 닐}}이 있어서 먼저 가야 할 것 같아요.","I have something urgent, so I think I need to go first.","У меня срочное дело, кажется, мне нужно уйти пораньше."],
      ["{{집안일|지반닐}}은 반반씩 나누어서 하고 있습니다.","We split the housework half and half.","Мы делим домашние дела пополам."]]},
  me:"안젤라",d:[
   ["드미트리","안젤라 씨, 무슨 {{안 좋은 일|안 조은 닐}} 있었어요?","Angela, did something bad happen?","Анджела, что-то плохое случилось?"],
   ["안젤라","얼마 전에 부장님이 저한테 중요한 계약서를 번역하[[게 하셨거든요]]. 그런데 어려운 말이 많아서 제대로 하지 못했어요.","Recently the department head had me translate an important contract. But there were many difficult words, so I couldn't do it properly.","Недавно начальник отдела поручил мне перевести важный договор. Но там было много трудных слов, и я не справилась как следует."],
   ["드미트리","그럼 미리 선배나 동료들한테 물어보지 그랬어요?","Then why didn't you ask a senior or coworkers beforehand?","А почему вы заранее не спросили старших коллег?"],
   ["안젤라","사람들은 제가 잘 적응해 [[가는]] 줄 아는데 물어보기가 창피하더라고요. 이럴 때는 어떻게 하는 게 좋을까요?","Everyone thinks I'm adapting well, so I was embarrassed to ask. What's best to do in a case like this?","Все думают, что я хорошо привыкаю, и мне было стыдно спрашивать. Как лучше поступать в таких случаях?"],
   ["드미트리","그럴 때는 내가 한 게 맞는지 주변 사람들에게 계속 물어보는 게 제일 좋아요.","Then the best thing is to keep asking people around you if what you did is right.","Тогда лучше всего постоянно спрашивать окружающих, правильно ли ты сделал."]]},
 {n:14,ko:"인터넷과 스마트폰",en:"Internet & smartphones",ru:"Интернет и смартфоны",
  g:[["-잖아요","“…you know” — reminding of something both know","«…же», «ведь» — напоминание общеизвестного"],["-어야","Only if / you must … to","Только если / нужно…, чтобы"]],
  p:{rule:"ㅎ 탈락",en:"A final ㅎ before a vowel is silent.",ru:"Конечная ㅎ перед гласной не произносится.",
   s:[["요리는 혼자 배우기 {{어렵잖아요|어렵짜나요}}.","Cooking is hard to learn alone, you know.","Готовить ведь трудно научиться самому."],
      ["한국어 어휘 공부 앱이 아주 {{괜찮아요|괜차나요}}.","The Korean vocabulary app is really good.","Приложение для корейской лексики очень неплохое."],
      ["이것은 제가 {{좋아하는|조아하는}} 인터넷 게임이에요.","This is an online game I like.","Это онлайн-игра, которая мне нравится."]]},
  me:"아나이스",d:[
   ["아나이스","라민 씨, 한국어를 재미있게 공부하는 방법이 있어요?","Ramin, is there a fun way to study Korean?","Рамин, есть интересный способ учить корейский?"],
   ["라민","요즘은 누구나 스마트폰을 가지고 있[[잖아요]]. 스마트폰으로 한번 공부해 보세요.","Everyone has a smartphone these days, you know. Try studying with it.","Сейчас ведь у всех есть смартфон. Попробуйте учиться с ним."],
   ["아나이스","그래요? 어떻게요?","Really? How?","Да? Как?"],
   ["라민","저는 한국어 어휘 앱을 설치해 놓고 심심할 때마다 공부해요. 그걸로 해 보니까 아주 재미있어요.","I installed a Korean vocabulary app and study whenever I'm bored. It's a lot of fun.","Я установил приложение для корейской лексики и занимаюсь, когда скучно. Очень интересно."],
   ["아나이스","와! 좋은 방법이에요. 꼭 책을 봐[[야]] 공부할 수 있는 게 아니네요.","Wow! That's a good way. You don't need books to study.","Ого! Хороший способ. Оказывается, учиться можно не только по книгам."],
   ["라민","맞아요. 아나이스 씨도 필요하면 무슨 앱인지 알려 줄게요.","Right. If you want, I'll tell you which app.","Точно. Если нужно, скажу, какое приложение."],
   ["아나이스","고마워요. 앱 이름 좀 알려 주세요. 저도 바로 해 볼게요.","Thanks. Tell me the name. I'll try it right away.","Спасибо. Скажите название, я сразу попробую."]]},
 {n:15,ko:"고민과 상담",en:"Worries & advice",ru:"Проблемы и советы",
  g:[["-으려던 참이다","Was just about to","Как раз собирался"],["-자마자","As soon as","Как только"]],
  p:{rule:"경음화",en:"After [ㄱ/ㄷ/ㅂ], ㄱㄷㅂㅅㅈ become tense [ㄲㄸㅃㅆㅉ].",ru:"После [ㄱ/ㄷ/ㅂ] ㄱㄷㅂㅅㅈ становятся напряжёнными [ㄲㄸㅃㅆㅉ].",
   s:[["주차 문제로 {{옆집|엽찝}} 사람들과 사이가 멀어졌다.","A parking issue drove us apart from the neighbors.","Из-за парковки отношения с соседями испортились."],
      ["조언을 {{듣자마자|듣짜마자}} 바로 실천했다.","As soon as I heard the advice, I put it into practice.","Как только услышал совет, сразу применил его."],
      ["설거지는 미루지 말고 밥을 {{먹자마자|먹짜마자}} 해야 돼요.","Don't put off the dishes — do them as soon as you eat.","Не откладывай посуду — мой сразу после еды."]]},
  me:"아나이스",d:[
   ["아나이스","선배, 잠깐 얘기 좀 할 수 있어요?","Can we talk for a minute?","Можно с вами минутку поговорить?"],
   ["선배","어, 안 그래도 커피 한잔하[[려던 참이었어]]. 왜? 무슨 일 있어?","Oh, I was just about to get a coffee anyway. Why? What's up?","О, я как раз собирался выпить кофе. А что? Что-то случилось?"],
   ["아나이스","아니, 저 요즘 한국어 실력이 통 늘지 않는 거 같아서요. 단어장도 많은데 외우[[자마자]] 금방 잊어버려요. 어떡하죠?","Well, my Korean doesn't seem to improve at all lately. I have lots of word lists, but I forget words as soon as I memorize them. What do I do?","Да вот, мой корейский совсем не улучшается. Словарей много, но я забываю слова, как только выучу. Что делать?"],
   ["선배","공부를 해도 실력이 안 늘어서 고민이구나.","So you're worried because you study but don't improve.","Значит, переживаешь, что занимаешься, а прогресса нет."],
   ["아나이스","네, 맞아요. 계속 제자리걸음을 하는 거 같아요.","Yes, exactly. I feel like I'm stuck in place.","Да, именно. Как будто топчусь на месте."],

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plain=s=>String(s).replace(/\[\[(.+?)\]\]/g,'$1').replace(/\{\{(.+?)\|(.+?)\}\}/g,'$1');
function rich(s,unit){
  const g=unit?unit.g.map(x=>`${x[0]}: ${tr({en:x[1],ru:x[2]})}`).join(' · '):'';
  return esc(s).replace(/\[\[(.+?)\]\]/g,(_,x)=>`<mark class="g" data-tip="${esc(g)}">${x}</mark>`)
               .replace(/\{\{(.+?)\|(.+?)\}\}/g,(_,w,p)=>`<ruby class="p"><span>${w}</span><rt>[${p}]</rt></ruby>`);
}
const pronWords=s=>[...String(s).matchAll(/\{\{(.+?)\|(.+?)\}\}/g)].map(m=>[m[1],m[2]]);

ten.","exru":"Чтобы сохранять хорошие отношения, нужно часто поддерживать связь."},{"ko":"예의를 지키다","en":"to be polite, to observe manners","ru":"соблюдать вежливость, этикет","ex":"대인 관계의 기본은 서로 예의를 잘 지키는 것이다.","exen":"The basis of relationships is being polite to each other.","exru":"Основа отношений — взаимная вежливость."},{"ko":"이야기를 잘 들어 주다","en":"to listen well to someone","ru":"внимательно выслушивать","ex":"친구가 고민이 있을 때에는 친구의 이야기를 잘 들어 주면 된다.","exen":"When a friend has a worry, you just need to listen to them well.","exru":"Когда у друга проблема, достаточно внимательно его выслушать."},{"ko":"솔직하다","en":"to be frank, honest","ru":"откровенный, честный","ex":"나는 선배의 결정에 반대하는 의견을 솔직하게 말했다.","exen":"I frankly said that I disagreed with my senior's decision.","exru":"Я откровенно сказал, что не согласен с решением старшего коллеги."},{"ko":"함께 시간을 보내다","en":"to spend time together","ru":"проводить время вместе","ex":"동료들하고 함께 시간을 보내면 될 거예요.","exen":"Spending time with your colleagues should do it.","exru":"Достаточно будет проводить время с коллегами."},{"ko":"사귀다","en":"to make friends with, to date","ru":"заводить друзей, дружить","ex":"새로 사귄 친구하고 친해졌어요?","exen":"Have you become close with your new friend?","exru":"Ты сблизился с новым другом?"},{"ko":"부족하다","en":"to be lacking, insufficient","ru":"недостаточный, не хватать","ex":"높임말을 배웠지만 그것만으로는 부족해요.","exen":"I learned honorifics, but that alone isn't enough.","exru":"Я изучил вежливую речь, но одного этого недостаточно."},{"ko":"내성적이다","en":"to be introverted","ru":"замкнутый, интровертный","ex":"성격도 내성적이고 혼자 있는 걸 좋아하고 해서 사람을 사귀기가 힘들어요.","exen":"I'm introverted and like being alone, so it's hard for me to make friends.","exru":"Я замкнутый и люблю быть один, поэтому мне трудно заводить друзей."},{"ko":"속도","en":"speed","ru":"скорость","ex":"기능이 다양하고 속도가 빠르면 돼요.","exen":"It just needs to have various functions and be fast.","exru":"Главное, чтобы было много функций и высокая скорость."},{"ko":"관심을 갖다","en":"to take an interest in","ru":"проявлять интерес","ex":"서로 관심을 갖고 상대방의 이야기를 잘 들어 주면 돼요.","exen":"Just take an interest in each other and listen well.","exru":"Достаточно интересоваться друг другом и внимательно слушать."},{"ko":"사이좋다","en":"to be on good terms","ru":"быть в хороших отношениях, дружный","ex":"싸우지 말고 사이좋게 지내야 한다.","exen":"Don't fight; you should get along well.","exru":"Не ссорься, живите дружно."},{"ko":"위로","en":"comfort, consolation","ru":"утешение","ex":"친구를 위로하는 방법","exen":"a way to comfort a friend","exru":"способ утешить друга"},{"ko":"줄이다","en":"to reduce","ru":"уменьшать, сокращать","ex":"직장 동료와 의견 차이를 줄이는 방법","exen":"a way to narrow differences of opinion with coworkers","exru":"способ сократить разногласия с коллегами"},{"ko":"안부","en":"regards, how someone is doing","ru":"приветы, новости о самочувствии","ex":"자주 안부를 묻고 연락을 주고받으면 돼요.","exen":"Just ask how they're doing often and keep in touch.","exru":"Достаточно часто спрашивать, как дела, и поддерживать связь."},{"ko":"문제를 풀다","en":"to solve problems (exercises)","ru":"решать задачи","ex":"문제도 많이 풀어 보고 단어도 많이 외우면 돼요.","exen":"Just solve lots of problems and memorize lots of words.","exru":"Нужно решать много заданий и учить много слов."},{"ko":"외우다","en":"to memorize","ru":"заучивать, запоминать","ex":"단어도 많이 외우면 돼요.","exen":"You just need to memorize lots of words.","exru":"Нужно просто выучить много слов."},{"ko":"적응하다","en":"to adapt, to adjust","ru":"адаптироваться, привыкать","ex":"좀 힘들지만 적응하려고 노력 중입니다.","exen":"It's a bit hard, but I'm trying to adapt.","exru":"Немного тяжело, но я стараюсь привыкнуть."},{"ko":"노력 중이다","en":"to be trying, making an effort","ru":"стараться, прилагать усилия","ex":"적응하려고 노력 중입니다.","exen":"I'm trying to adapt.","exru":"Я стараюсь адаптироваться."},{"ko":"이야기를 나누다","en":"to have a conversation, to talk","ru":"беседовать, разговаривать","ex":"저는 친구들과 이야기도 많이 나눠요.","exen":"I talk a lot with my friends.","exru":"Я много разговариваю с друзьями."},{"ko":"동호회","en":"hobby club","ru":"клуб по интересам","ex":"동호회에서 강릉에 가기로 했어요.","exen":"The club decided to go to Gangneung.","exru":"Клуб решил поехать в Каннын."},{"ko":"대통령","en":"president (of a country)","ru":"президент","ex":"대통령의 말씀이 있겠습니다.","exen":"The president will now speak.","exru":"Сейчас выступит президент."},{"ko":"말다툼","en":"quarrel, argument","ru":"ссора, перебранка","ex":"생활 방식이 달라서 자주 말다툼을 해요.","exen":"Our lifestyles are different, so we argue often.","exru":"У нас разный образ жизни, поэтому мы часто ссоримся."},{"ko":"답답하다","en":"to feel frustrated, stifled","ru":"чувствовать досаду, тягостно","ex":"간단한 말만 하니까 답답할 때가 많아요.","exen":"I can only say simple things, so I often feel frustrated.","exru":"Я могу говорить только простые вещи, поэтому мне часто досадно."},{"ko":"이직","en":"job change","ru":"смена работы","ex":"얼마 전에 이직을 했습니다.","exen":"I changed jobs recently.","exru":"Недавно я сменил работу."},{"ko":"옮기다","en":"to move, to transfer","ru":"переносить, переходить (на другое место)","ex":"이 사람은 얼마 전에 회사를 옮겼다.","exen":"This person changed companies recently.","exru":"Этот человек недавно перешёл в другую компанию."},{"ko":"대부분","en":"most, the majority","ru":"большинство, большая часть","ex":"대부분 저보다 연세가 많으신 분들입니다.","exen":"Most of them are older than me.","exru":"Большинство из них старше меня."},{"ko":"피하다","en":"to avoid","ru":"избегать","ex":"요즘은 선배들하고 같이 있는 자리를 피하게 됩니다.","exen":"These days I end up avoiding being with my seniors.","exru":"В последнее время я стал избегать ситуаций, где нахожусь со старшими."},{"ko":"높임말","en":"honorific speech","ru":"вежливая речь, гоноратив","ex":"한국에서는 높임말 사용이 중요해요.","exen":"In Korea, using honorifics is important.","exru":"В Корее важно использовать вежливую речь."},{"ko":"의도","en":"intention","ru":"намерение","ex":"제 의도를 정확하게 표현하기 힘들어요.","exen":"It's hard to express my intentions accurately.","exru":"Мне трудно точно выразить свои намерения."},{"ko":"편견","en":"prejudice","ru":"предубеждение","ex":"서로에게 편견을 갖고 있다.","exen":"They are prejudiced against each other.","exru":"У них предубеждения друг о друге."},{"ko":"생활 방식","en":"lifestyle, way of life","ru":"образ жизни","ex":"룸메이트와 생활 방식이 달라요.","exen":"My roommate and I have different lifestyles.","exru":"У нас с соседом по комнате разный образ жизни."}],"grammar":[{"g":"-고 해서","ko":"조금 전에 샌드위치도 먹[[고 해서]] 그냥 사무실에 있으려고요.","en":"I had a sandwich a little while ago and all, so I'll just stay in the office.","ru":"Я недавно съел сэндвич, так что просто останусь в офисе."},{"g":"-고 해서","ko":"초등학교 동창들하고 자주 연락을 주고받[[고 해서]] 아직도 만나요.","en":"I keep in touch with my elementary school classmates, among other reasons, so we still meet.","ru":"Мы часто общаемся с одноклассниками из начальной школы, поэтому до сих пор встречаемся."},{"g":"-고 해서","ko":"서로 공감대도 없고 바쁘[[고 해서]] 친해지기가 어려워요.","en":"We have no common ground and we're busy, so it's hard to get close.","ru":"У нас нет ничего общего, да и мы заняты, поэтому сблизиться трудно."},{"g":"-고 해서","ko":"고향 친구와 자주 못 만나고 연락도 자주 못하[[고 해서]] 사이가 멀어졌어요.","en":"I couldn't see my friend from home often or keep in touch, so we drifted apart.","ru":"Я редко виделся с другом с родины и редко с ним связывался, поэтому мы отдалились."},{"g":"-고 해서","ko":"이번 주말은 피곤하[[고 해서]] 집에서 쉴 거예요.","en":"I'm tired and all, so I'll rest at home this weekend.","ru":"Я устал, так что в эти выходные буду отдыхать дома."},{"g":"-고 해서","ko":"오늘 시간도 많고 날씨도 좋[[고 해서]] 산책을 했어요.","en":"I had plenty of time today and the weather was nice, so I took a walk.","ru":"Сегодня было много времени и хорошая погода, поэтому я погулял."},{"g":"-고 해서","ko":"출근 시간에 길도 막히[[고 해서]] 지하철을 타고 다녀요.","en":"The roads are jammed at rush hour, among other things, so I take the subway.","ru":"В час пик на дорогах пробки, поэтому я езжу на метро."},{"g":"-고 해서","ko":"마트보다 값도 싸고 가깝[[고 해서]] 저는 시장에 자주 가요.","en":"It's cheaper than the supermarket and close, so I often go to the market.","ru":"Там дешевле, чем в супермаркете, и близко, поэтому я часто хожу на рынок."},{"g":"-고 해서","ko":"생활비도 많이 들[[고 해서]] 아르바이트를 하나 더 하려고 해요.","en":"Living expenses are high, so I'm going to take one more part-time job.","ru":"Расходы на жизнь большие, поэтому я хочу взять ещё одну подработку."},{"g":"-고 해서","ko":"기름값이 많이 들[[고 해서]] 대중교통을 이용해요.","en":"Gas costs a lot, so I use public transportation.","ru":"Бензин дорого обходится, поэтому я пользуюсь общественным транспортом."},{"g":"-으면 되다","ko":"기능이 다양하고 속도가 빠르[[면 돼요]].","en":"It just needs to have various functions and be fast.","ru":"Главное, чтобы было много функций и высокая скорость."},{"g":"-으면 되다","ko":"이 약은 식사 후에 드시[[면 됩니다]].","en":"You just need to take this medicine after meals.","ru":"Это лекарство нужно просто принимать после еды."},{"g":"-으면 되다","ko":"수업 신청은 홈페이지에서 하[[면 돼요]].","en":"You can just sign up for classes on the website.","ru":"Записаться на занятия можно просто на сайте."},{"g":"-으면 되다","ko":"웃으면서 먼저 인사하고 서로 예의를 지키[[면 돼요]].","en":"Just greet them first with a smile and be polite to each other.","ru":"Достаточно первым здороваться с улыбкой и быть вежливыми друг с другом."},{"g":"-으면 되다","ko":"서로 관심을 갖고 상대방의 이야기를 잘 들어 주[[면 돼요]].","en":"Just take an interest in each other and listen well to your partner.","ru":"Достаточно интересоваться друг другом и внимательно слушать партнёра."},{"g":"-으면 되다","ko":"국물이 짜면 물을 조금 더 넣[[으면 된다]].","en":"If the soup is salty, just add a little more water.","ru":"Если суп пересолен, достаточно добавить немного воды."},{"g":"-으면 되다","ko":"싼 가격에 비행기표를 구하려면 미리 예약하[[면 된다]].","en":"To get cheap plane tickets, you just need to book in advance.","ru":"Чтобы купить дешёвые авиабилеты, нужно просто забронировать заранее."},{"g":"-으면 되다","ko":"2시에 수업을 시작하니까 10분 전에 도착하[[면 된다]].","en":"Class starts at 2, so you just need to arrive 10 minutes early.","ru":"Занятие начинается в два, так что достаточно прийти за десять минут."},{"g":"-으면 되다","ko":"2층에서 하니까 오른쪽 계단으로 올라가시[[면 돼요]].","en":"It's on the second floor, so just go up the stairs on the right.","ru":"Это на втором этаже, так что просто поднимитесь по лестнице справа."},{"g":"-으면 되다","ko":"수강 신청 기간에 홈페이지에서 신청하시[[면 돼요]].","en":"Just apply on the website during the registration period.","ru":"Просто подайте заявку на сайте в период записи."}],"content":[{"q":"성민의 반 친구들은 성민을 어떻게 대해요?","qen":"How do Seongmin's classmates treat him?","qru":"Как одноклассники относятся к Сонмину?","t":"반 친구들이 성민을 어려워하는 것 같아요.","en":"His classmates seem to feel uneasy around him.","ru":"Кажется, одноклассники его стесняются.","k":["어려워하다"]},{"q":"성민은 내일 친구들과 어디에 가기로 했어요?","qen":"Where did Seongmin agree to go with his friends tomorrow?","qru":"Куда Сонмин договорился пойти с друзьями завтра?","t":"수업 끝나고 피시방에 같이 가기로 했어요.","en":"They agreed to go to a PC room together after class.","ru":"Они договорились пойти вместе в компьютерный клуб после уроков.","k":["피시방"]},{"q":"성민의 친구들이 성민에게 질문을 많이 하는 이유는 뭐예요?","qen":"Why do Seongmin's friends ask him many questions?","qru":"Почему друзья Сонмина задают ему много вопросов?","t":"친구들이 중국에 관심이 많아서 질문을 많이 해요.","en":"Because they are very interested in China.","ru":"Потому что они очень интересуются Китаем.","k":["중국","관심"]},{"q":"게시판에 글을 쓴 베트남 사람이 어려워하는 것은 뭐예요?","qen":"What does the Vietnamese person who wrote the post find difficult?","qru":"Что вызывает трудности у вьетнамца, написавшего пост?","t":"높임말 사용이 어렵고 의도를 정확하게 표현하기 힘들어해요.","en":"Using honorifics is hard, and expressing his intentions accurately is difficult.","ru":"Ему трудно использовать вежливую речь и точно выражать свои намерения.","k":["높임말"]},{"q":"이 사람의 새 직장에는 어떤 사람들이 많아요?","qen":"What kind of people are at this person's new workplace?","qru":"Какие люди работают на новой работе этого человека?","t":"한국 사람들이 많고 대부분 연세가 많으신 분들이에요.","en":"There are many Koreans, and most of them are older.","ru":"Там много корейцев, и большинство из них старше по возрасту.","k":["한국 사람","연세"]},{"q":"동창회는 어떤 모임이에요?","qen":"What kind of gathering is a 동창회?","qru":"Что такое 동창회?","t":"같은 학교를 졸업한 사람들이 친목을 도모하고 모교와 연락하기 위해 만든 모임이에요.","en":"It's a gathering of graduates of the same school, made to build friendship and stay in contact with their alma mater.","ru":"Это объединение выпускников одной школы для общения друг с другом и связи с родной школой.","k":["졸업","학교"]},{"q":"동호회는 어떤 모임이에요?","qen":"What kind of group is a 동호회?","qru":"Что такое 동호회?","t":"등산이나 악기 연주처럼 같은 취미를 함께 즐기는 사람들의 모임이에요.","en":"It's a group of people who enjoy the same hobby together, like hiking or playing instruments.","ru":"Это объединение людей, которые вместе занимаются общим хобби, например походами или игрой на инструментах.","k":["취미"]},{"q":"동호회에 가입하면 어떤 점이 좋아요?","qen":"What are the benefits of joining a hobby club?","qru":"Чем полезно вступить в клуб по интересам?","t":"취미 활동도 하고 다양한 정보도 얻고 새로운 사람들도 사귈 수 있어요.","en":"You can do hobby activities, gather various information, and make new friends.","ru":"Можно заниматься хобби, получать разную информацию и заводить новых знакомых.","k":["취미","사귀다"]}]},{"n":2,"vocab":[{"ko":"외향적이다","en":"to be extroverted, outgoing","ru":"общительный, экстравертный","ex":"저는 성격이 외향적이에요. 그래서 사람들과 이야기하는 것을 좋아해요.","exen":"I'm outgoing, so I like talking with people.","exru":"Я общительный, поэтому люблю разговаривать с людьми."},{"ko":"내성적이다","en":"to be introverted","ru":"замкнутый, интровертный","ex":"나는 너무 내성적이어서 오랜 친구한테도 속마음을 이야기하지 않을 때가 있다.","exen":"I'm so introverted that sometimes I don't share my true feelings even with old friends.","exru":"Я настолько замкнут, что иногда не делюсь сокровенным даже со старыми друзьями."},{"ko":"적극적이다","en":"to be proactive, active","ru":"активный, инициативный","ex":"나는 적극적인 성격이어서 누가 시키지 않은 일을 스스로 먼저 하는 편이다.","exen":"I'm proactive, so I tend to do things on my own before anyone asks.","exru":"Я инициативный, поэтому обычно сам берусь за дела, не дожидаясь просьб."},{"ko":"소극적이다","en":"to be passive, reserved","ru":"пассивный, нерешительный","ex":"저는 성격이 소극적인 편이어서 다른 사람들 앞에 나서는 걸 안 좋아해요.","exen":"I'm rather passive, so I don't like to stand out in front of others.","exru":"Я довольно пассивная, поэтому не люблю выступать перед людьми."},{"ko":"꼼꼼하다","en":"to be meticulous, thorough","ru":"аккуратный, дотошный","ex":"예전에는 실수를 자주 했는데 요즘은 많이 꼼꼼해졌네요.","exen":"You used to make mistakes often, but you've become much more meticulous lately.","exru":"Раньше вы часто ошибались, а теперь стали гораздо аккуратнее."},{"ko":"덜렁거리다","en":"to be careless, scatterbrained","ru":"быть рассеянным, небрежным","ex":"우리 아이는 덜렁거리는 성격 때문에 물건을 잘 잃어버린다.","exen":"My child often loses things because he's scatterbrained.","exru":"Наш ребёнок рассеянный, поэтому часто теряет вещи."},{"ko":"다정하다","en":"to be warm, affectionate","ru":"ласковый, душевный","ex":"저도 그렇게 다정한 아빠가 되고 싶어요.","exen":"I want to be such an affectionate dad too.","exru":"Я тоже хочу быть таким ласковым папой."},{"ko":"무뚝뚝하다","en":"to be blunt, curt, unaffectionate","ru":"сдержанный, неприветливый, суровый","ex":"결혼 전에는 무뚝뚝했어요.","exen":"I was curt and unexpressive before marriage.","exru":"До свадьбы я был суховат и неприветлив."},{"ko":"(성격이) 느긋하다","en":"to be easygoing, unhurried","ru":"неторопливый, спокойный (по характеру)","ex":"고향에 있을 때는 성격이 급했어요. 그러나 요즘은 느긋해졌어요.","exen":"I was impatient back home, but these days I've become easygoing.","exru":"На родине я был нетерпеливым, а теперь стал спокойнее."},{"ko":"(성격이) 급하다","en":"to be impatient, hasty","ru":"нетерпеливый, торопливый","ex":"저는 성격이 급해서 실수를 많이 해요.","exen":"I'm impatient, so I make a lot of mistakes.","exru":"Я нетерпеливый, поэтому часто ошибаюсь."},{"ko":"활발하다","en":"to be lively, energetic","ru":"живой, бойкий, энергичный","ex":"태권도를 배운 후부터 많이 활발해졌어요.","exen":"He has become much livelier since learning taekwondo.","exru":"С тех пор как он занимается тхэквондо, он стал гораздо бойчее."},{"ko":"동아리","en":"club (school/student)","ru":"кружок, клуб","ex":"아이한테 동아리나 봉사 활동을 시키면 어떨까요?","exen":"How about having your child join a club or do volunteer work?","exru":"Может, записать ребёнка в кружок или на волонтёрство?"},{"ko":"봉사","en":"volunteer service","ru":"волонтёрство, служение","ex":"우리 아이는 봉사 활동을 한 후부터 성격이 밝아진 것 같아요.","exen":"My child seems to have become cheerful since doing volunteer work.","exru":"Кажется, после волонтёрства мой ребёнок стал жизнерадостнее."},{"ko":"습관","en":"habit","ru":"привычка","ex":"아이에게 계획하는 습관을 만들어 주다","exen":"to help a child form a habit of planning","exru":"приучить ребёнка планировать"},{"ko":"(계획을) 세우다","en":"to make (a plan)","ru":"составлять (план)","ex":"계획표를 세워서 일을 하니까 성격이 꼼꼼해졌어요.","exen":"Working with a schedule has made him more meticulous.","exru":"Он работает по плану и стал аккуратнее."},{"ko":"장기 자랑","en":"talent show","ru":"конкурс талантов","ex":"다음 주 장기 자랑 대회에서 노래할 거예요?","exen":"Are you going to sing at the talent show next week?","exru":"Вы будете петь на конкурсе талантов на следующей неделе?"},{"ko":"앞에 나서다","en":"to step forward, to put oneself in front","ru":"выходить вперёд, выступать перед людьми","ex":"다른 사람들 앞에 나서는 걸 안 좋아해요.","exen":"I don't like stepping forward in front of others.","exru":"Я не люблю выступать перед другими."},{"ko":"낯설다","en":"to be unfamiliar, strange","ru":"незнакомый, чужой","ex":"한국에 와서 낯선 생활에 적응하려고 노력했어요.","exen":"After coming to Korea, I tried to adapt to an unfamiliar life.","exru":"Приехав в Корею, я старался привыкнуть к незнакомой жизни."},{"ko":"설레다","en":"to be excited, fluttering","ru":"волноваться (радостно), трепетать","ex":"설레는 마음으로 집에 도착했습니다.","exen":"I arrived home with an excited heart.","exru":"Я приехал домой в радостном волнении."},{"ko":"시끄럽다","en":"to be noisy","ru":"шумный","ex":"저희 가족은 늘 대화도 많이 하고 집안이 시끄러운 편이에요.","exen":"My family always talks a lot, so our house is rather noisy.","exru":"В моей семье много разговаривают, поэтому дома обычно шумно."},{"ko":"다투다","en":"to quarrel, to argue","ru":"ссориться, спорить","ex":"부모님이 결혼기념일에 크게 다투셨어요.","exen":"My parents had a big fight on their wedding anniversary.","exru":"Родители сильно поссорились в годовщину свадьбы."},{"ko":"결혼기념일","en":"wedding anniversary","ru":"годовщина свадьбы","ex":"늦었지만 결혼기념일 파티를 하면 어떨까요?","exen":"It's late, but how about having a wedding anniversary party?","exru":"Пусть и с опозданием, может, устроим праздник в честь годовщины свадьбы?"},{"ko":"동호회","en":"hobby club","ru":"клуб по интересам","ex":"그날에도 동호회 모임에 가셨어요.","exen":"That day, too, he went to his club meeting.","exru":"И в тот день он пошёл на встречу клуба."},{"ko":"달라지다","en":"to change, to become different","ru":"меняться, становиться другим","ex":"미안해. 이제부터 달라질게.","exen":"I'm sorry. I'll change from now on.","exru":"Прости. С этого дня я изменюсь."},{"ko":"눈을 흘기다","en":"to give a sidelong glare","ru":"бросить косой взгляд","ex":"어머니께서는 눈을 흘기면서 좋아하셨습니다.","exen":"Mom gave him a sidelong glance but was pleased.","exru":"Мама бросила на него косой взгляд, но была рада."},{"ko":"개방적이다","en":"to be open-minded","ru":"открытый (взглядам), либеральный","ex":"","exen":"","exru":""},{"ko":"보수적이다","en":"to be conservative","ru":"консервативный","ex":"","exen":"","exru":""},{"ko":"신중하다","en":"to be careful, prudent","ru":"осмотрительный, осторожный","ex":"의사는 신중하면 좋을 것 같아요.","exen":"I think it's good for a doctor to be careful.","exru":"Мне кажется, врачу хорошо быть осмотрительным."},{"ko":"예민하다","en":"to be sensitive","ru":"чувствительный, восприимчивый","ex":"저는 예민한 편이어서 빗소리에도 잠이 깨요.","exen":"I'm rather sensitive, so even the sound of rain wakes me up.","exru":"Я довольно чуткий, поэтому просыпаюсь даже от шума дождя."},{"ko":"유머 감각이 많다","en":"to have a good sense of humor","ru":"иметь хорошее чувство юмора","ex":"저희 가족은 모두 다정하고 유머 감각이 많아요.","exen":"Everyone in my family is warm and has a great sense of humor.","exru":"Все в моей семье ласковые и с хорошим чувством юмора."},{"ko":"자상하다","en":"to be kind and considerate","ru":"заботливый, внимательный","ex":"안젤라 씨가 자상하게 잘 가르쳐 준 덕분이에요.","exen":"It's thanks to Angela teaching me so kindly.","exru":"Это благодаря тому, что Анжела заботливо меня учила."},{"ko":"정이 많다","en":"to be warm-hearted","ru":"душевный, сердечный","ex":"내 동생은 정이 많아서 어려운 일이 있는 사람을 잘 도와준다.","exen":"My younger sibling is warm-hearted, so they often help people in trouble.","exru":"Мой младший брат очень душевный и часто помогает людям в беде."},{"ko":"책임감이 강하다","en":"to have a strong sense of responsibility","ru":"иметь сильное чувство ответственности","ex":"책임감 있는 사람이 왔으면 좋겠다.","exen":"I hope someone responsible comes.","exru":"Хорошо бы пришёл ответственный человек."},{"ko":"호기심이 많다","en":"to be very curious","ru":"очень любопытный, любознательный","ex":"","exen":"","exru":""},{"ko":"공무원","en":"civil servant","ru":"государственный служащий","ex":"","exen":"","exru":""},{"ko":"네일 아티스트","en":"nail artist","ru":"мастер маникюра","ex":"","exen":"","exru":""},{"ko":"통역사","en":"interpreter","ru":"переводчик (устный)","ex":"","exen":"","exru":""},{"ko":"미용사","en":"hairdresser","ru":"парикмахер","ex":"","exen":"","exru":""},{"ko":"사회 복지사","en":"social worker","ru":"социальный работник","ex":"","exen":"","exru":""}],"grammar":[{"g":"-어지다","ko":"태권도를 배운 후부터 많이 활발[[해졌어요]].","en":"He has become much livelier since he started learning taekwondo.","ru":"С тех пор как он занимается тхэквондо, он стал гораздо бойчее."},{"g":"-어지다","ko":"고향에 있을 때는 성격이 느긋했어요. 한국에 와서 많이 급[[해졌어요]].","en":"I was easygoing back home. I've become much more impatient since coming to Korea.","ru":"На родине я был спокойным, а в Корее стал гораздо нетерпеливее."},{"g":"-어지다","ko":"이제는 한국 생활에 많이 익숙[[해졌어요]].","en":"Now I've become quite used to life in Korea.","ru":"Теперь я вполне привык к жизни в Корее."},{"g":"-어지다","ko":"예전에는 실수를 자주 했는데 요즘은 많이 꼼꼼[[해졌네요]].","en":"You used to make mistakes often, but you've become much more meticulous lately.","ru":"Раньше вы часто ошибались, а теперь стали гораздо аккуратнее."},{"g":"-어지다","ko":"예전에는 한국 생활이 힘들었어요. 하지만 요즘은 많이 편[[해졌어요]].","en":"Life in Korea used to be hard, but it's become much more comfortable lately.","ru":"Раньше жить в Корее было тяжело, но теперь стало гораздо легче."},{"g":"-어지다","ko":"채소 값과 과일 값이 작년보다 많이 비싸[[졌다]].","en":"Vegetable and fruit prices have become much higher than last year.","ru":"Овощи и фрукты сильно подорожали по сравнению с прошлым годом."},{"g":"-어지다","ko":"집 근처에 지하철역이 새로 생겨서 교통이 편리[[해졌다]].","en":"A new subway station opened near my home, so transportation has become convenient.","ru":"Рядом с домом открылась станция метро, и добираться стало удобнее."},{"g":"-어지다","ko":"가구를 옮기고 안 쓰는 물건들을 버리니까 방이 넓[[어졌다]].","en":"I moved the furniture and threw out unused things, and the room became more spacious.","ru":"Я переставил мебель и выбросил ненужные вещи, и комната стала просторнее."},{"g":"-어지다","ko":"물병을 넣으니까 가방이 무거[[워져서]] 다시 꺼냈다.","en":"Putting the water bottle in made the bag heavy, so I took it out again.","ru":"С бутылкой воды сумка стала тяжёлой, и я её вынул."},{"g":"-어지다","ko":"겨울이 돼서 낮이 많이 짧[[아졌어요]].","en":"Now that it's winter, the days have gotten much shorter.","ru":"Наступила зима, и дни стали гораздо короче."},{"g":"-는 대신(에)","ko":"시간이 오래 걸리[[는 대신에]] 실수가 없으니까 걱정하지 마세요.","en":"It takes a long time, but in return there are no mistakes, so don't worry.","ru":"Это занимает много времени, зато ошибок нет, так что не волнуйтесь."},{"g":"-는 대신(에)","ko":"부모님을 자주 찾아뵙지 못하[[는 대신에]] 전화를 자주 드려요.","en":"I can't visit my parents often, so instead I call them often.","ru":"Я не могу часто навещать родителей, зато часто им звоню."},{"g":"-는 대신(에)","ko":"일이 많[[은 대신에]] 다양한 경험을 쌓을 수 있어서 좋아요.","en":"There's a lot of work, but in return I can gain various experience, which is good.","ru":"Работы много, зато можно набраться разнообразного опыта."},{"g":"-는 대신(에)","ko":"일요일에 일하[[는 대신에]] 월요일에는 쉬어요.","en":"I work on Sunday, and in exchange I rest on Monday.","ru":"Я работаю в воскресенье, зато в понедельник отдыхаю."},{"g":"-는 대신(에)","ko":"저는 엘리베이터를 타[[는 대신에]] 계단을 자주 이용해요.","en":"Instead of taking the elevator, I often use the stairs.","ru":"Вместо лифта я часто хожу по лестнице."},{"g":"-는 대신(에)","ko":"그 회사는 월급이 적[[은 대신에]] 휴가가 많은 편이다.","en":"That company pays little, but in return it gives a lot of vacation.","ru":"В той компании маленькая зарплата, зато много отпуска."},{"g":"-는 대신(에)","ko":"버스를 타고 가면 한 번에 가[[는 대신에]] 지하철보다 시간이 더 걸린다.","en":"If you take the bus, you get there without transferring, but it takes longer than the subway.","ru":"На автобусе можно доехать без пересадок, зато дольше, чем на метро."},{"g":"-는 대신(에)","ko":"가족과 멀리 떨어져 사[[는 대신에]] 매일 영상 통화를 한다.","en":"I live far from my family, so instead we video call every day.","ru":"Я живу далеко от семьи, зато мы каждый день созваниваемся по видео."},{"g":"-는 대신(에)","ko":"라흐만 씨는 느긋[[한 대신에]] 꼼꼼해서 실수가 없어요.","en":"Rahman is easygoing, but in return he's meticulous and makes no mistakes.","ru":"Рахман неторопливый, зато аккуратный и не делает ошибок."},{"g":"-는 대신(에)","ko":"아이들이 많이 도와주[[는 대신에]] 용돈도 더 요구해요.","en":"The kids help a lot, but in return they also ask for more pocket money.","ru":"Дети много помогают, но зато и просят больше карманных денег."}],"content":[{"q":"애나 씨는 성격이 어때요?","qen":"What is Anna's personality like?","qru":"Какой характер у Анны?","t":"애나 씨는 소극적인 편이어서 다른 사람들 앞에 나서는 걸 안 좋아해요.","en":"Anna is rather passive, so she doesn't like stepping forward in front of others.","ru":"Анна довольно пассивная и не любит выступать перед людьми.","k":["소극적"]},{"q":"제이슨 씨는 성격이 왜, 어떻게 달라졌어요?","qen":"Why and how did Jason's personality change?","qru":"Почему и как изменился характер Джейсона?","t":"한국에서 낯선 생활에 적응하려고 노력하면서 적극적이고 말도 많아졌어요.","en":"While trying to adapt to an unfamiliar life in Korea, he became proactive and more talkative.","ru":"Стараясь привыкнуть к незнакомой жизни в Корее, он стал активным и разговорчивым.","k":["적응","적극적"]},{"q":"제이슨 씨는 애나 씨에게 무엇을 조언했어요?","qen":"What advice did Jason give Anna?","qru":"Что посоветовал Джейсон Анне?","t":"혼자 있는 대신에 다른 사람들과 시간도 보내고 이야기도 해 보라고 했어요.","en":"He told her to spend time and talk with other people instead of being alone.","ru":"Он посоветовал ей вместо того, чтобы быть одной, проводить время и общаться с другими.","k":["대신에"]},{"q":"라흐만 씨가 고향 집에 갔을 때 가족에게 무슨 일이 있었어요?","qen":"What had happened in Rahman's family when he went home?","qru":"Что произошло в семье Рахмана, когда он приехал домой?","t":"부모님이 결혼기념일에 크게 다투셔서 대화를 안 하셨어요.","en":"His parents had a big fight on their wedding anniversary and weren't talking.","ru":"Родители сильно поссорились в годовщину свадьбы и не разговаривали.","k":["결혼기념일","다투다"]},{"q":"라흐만 씨 아버지의 직업과 성격은 어때요?","qen":"What is Rahman's father's job and personality?","qru":"Кем работает отец Рахмана и какой у него характер?","t":"여행사를 운영하시고 적극적이고 활발한 편이세요.","en":"He runs a travel agency and is proactive and lively.","ru":"Он управляет турагентством и по характеру активный и энергичный.","k":["여행사","활발"]},{"q":"어머니는 왜 화가 나셨어요?","qen":"Why did the mother get angry?","qru":"Почему мама рассердилась?","t":"아버지가 결혼기념일을 잊어버리고 동호회 모임에서 밤늦게 들어오셨기 때문이에요.","en":"Because the father forgot their anniversary and came home late at night from his club meeting.","ru":"Потому что отец забыл о годовщине и поздно вернулся со встречи клуба.","k":["잊어버리다","늦게"]},{"q":"워크넷에서는 사람의 성격을 몇 가지 유형으로 나눠요?","qen":"Into how many types does Worknet divide personality?","qru":"На сколько типов Worknet делит характеры людей?","t":"현실형, 탐구형, 예술형, 사회형, 진취형, 관습형의 여섯 가지 유형으로 나눠요.","en":"Into six types: realistic, investigative, artistic, social, enterprising, and conventional.","ru":"На шесть типов: реалистический, исследовательский, артистический, социальный, предприимчивый и конвенциональный.","k":["여섯 가지"]},{"q":"현실형 사람은 어떤 성격이고 어떤 직업과 어울려요?","qen":"What is the realistic type like, and what jobs suit them?","qru":"Какой характер у реалистического типа и какие профессии ему подходят?","t":"현실적이고 신중하며 솔직하지만 고집이 센 편이고, 기술자나 경찰 같은 직업과 어울려요.","en":"They are realistic, careful and honest but stubborn, and suit jobs like technician or police officer.","ru":"Они практичные, осмотрительные и прямые, но упрямые; им подходят профессии техника или полицейского.","k":["현실적","고집"]}]},{"n":3,"vocab":[{"ko":"상담을 받다","en":"to receive counseling, to get a consultation","ru":"получать консультацию","ex":"한국 생활에 대해 궁금하신 분은 상담을 받으러 오세요.","exen":"If you have questions about life in Korea, come get a consultation.","exru":"Если у вас есть вопросы о жизни в Корее, приходите на консультацию."},{"ko":"임금 체불","en":"unpaid wages, wage arrears","ru":"задержка (невыплата) зарплаты","ex":"임금 체불, 생활, 가족 등 상담을 받다","exen":"to get counseling on unpaid wages, daily life, family, etc.","exru":"получать консультации по невыплате зарплаты, быту, семье и т. д."},{"ko":"통번역 서비스를 받다","en":"to use interpretation and translation services","ru":"пользоваться услугами устного и письменного перевода","ex":"아직 한국어가 부족해서 말이 잘 안 통하세요? 통번역 서비스를 신청하세요.","exen":"Is your Korean not good enough yet to communicate? Apply for the interpretation and translation service.","exru":"Вам пока не хватает корейского, чтобы объясниться? Подайте заявку на услуги перевода."},{"ko":"구직 상담을 받다","en":"to get job-seeking counseling","ru":"получать консультацию по поиску работы","ex":"지난달까지 구직 상담을 받다가 얼마 전에 취직했어요.","exen":"I got job-search counseling until last month and recently got a job.","exru":"До прошлого месяца я ходил на консультации по поиску работы, а недавно устроился."},{"ko":"창업 상담을 받다","en":"to get start-up (business) counseling","ru":"получать консультацию по открытию бизнеса","ex":"창업 지원 센터에서 무료로 창업 상담을 받을 수 있어요.","exen":"You can get free start-up counseling at the business start-up support center.","exru":"В центре поддержки предпринимательства можно бесплатно получить консультацию по открытию бизнеса."},{"ko":"아이를 맡기다","en":"to leave a child in someone's care","ru":"оставлять ребёнка (на попечение)","ex":"우리 부부는 회사에 출근하기 전에 어린이집에 아이를 맡긴다.","exen":"My spouse and I leave our child at daycare before going to work.","exru":"Мы с супругом перед работой оставляем ребёнка в детском 아는 사람이 많지 않다.","exen":"Not many people know that foreigners can also use welfare services.","exru":"Немногие знают, что иностранцы тоже могут пользоваться социальными услугами."}],"grammar":[{"g":"-는지 알다/모르다","ko":"문화 체육 센터에서 무엇을 배우[[는지 알아요]]?","en":"Do you know what they teach at the culture and sports center?","ru":"Вы знаете, чему учат в культурно-спортивном центре?"},{"g":"-는지 알다/모르다","ko":"외국인도 복지 서비스를 이용할 수 있[[는지 아는]] 사람이 많지 않다.","en":"Not many people know whether foreigners can use welfare services too.","ru":"Немногие знают, могут ли иностранцы пользоваться социальными услугами."},{"g":"-는지 알다/모르다","ko":"상담 센터가 몇 시에 문을 여[[는지 몰라서]] 홈페이지를 찾아보았다.","en":"I didn't know what time the counseling center opens, so I looked it up on the website.","ru":"Я не знал, во сколько открывается консультационный центр, и посмотрел на сайте."},{"g":"-는지 알다/모르다","ko":"어디에서 예방 접종을 하[[는지 알아요]]?","en":"Do you know where they give vaccinations?","ru":"Вы знаете, где делают прививки?"},{"g":"-는지 알다/모르다","ko":"어디에서 상담을 받을 수 있[[는지 아세요]]?","en":"Do you know where I can get counseling?","ru":"Вы знаете, где можно получить консультацию?"},{"g":"-는지 알다/모르다","ko":"저는 우리 동네에 그런 시설이 있[[는지 몰랐어요]].","en":"I didn't know there was such a facility in our neighborhood.","ru":"Я не знала, что в нашем районе есть такое учреждение."},{"g":"-는지 알다/모르다","ko":"여기서 공항까지 어떻게 가[[는지 아세요]]?","en":"Do you know how to get to the airport from here?","ru":"Вы знаете, как отсюда добраться до аэропорта?"},{"g":"-는지 알다/모르다","ko":"지금 교실에 사람이 몇 명 있[[는지 모르겠어요]].","en":"I don't know how many people are in the classroom now.","ru":"Не знаю, сколько сейчас человек в классе."},{"g":"-는지 알다/모르다","ko":"잡채를 먹고 싶은데 어떻게 만드[[는지 아세요]]?","en":"I want to eat japchae; do you know how to make it?","ru":"Хочу чапчхэ — вы знаете, как его готовить?"},{"g":"-는지 알다/모르다","ko":"무료로 컴퓨터를 배울 수 있는 곳이 어디[[인지 알고]] 싶어요.","en":"I want to know where I can learn computers for free.","ru":"Я хочу узнать, где можно бесплатно научиться работать на компьютере."},{"g":"-는지 알다/모르다","ko":"저도 저 학생이 어느 나라 사람[[인지 몰라요]].","en":"I don't know which country that student is from either.","ru":"Я тоже не знаю, из какой страны тот студент."},{"g":"-는지 알다/모르다","ko":"여기서 시청까지 얼마나 걸리[[는지 아세요]]?","en":"Do you know how long it takes from here to city hall?","ru":"Вы знаете, сколько отсюда добираться до мэрии?"},{"g":"-다가","ko":"지난달까지 구직 상담을 받[[다가]] 얼마 전에 취직해서 지금은 받지 않아요.","en":"I was getting job counseling until last month, but I got a job recently, so I don't anymore.","ru":"До прошлого месяца я ходил на консультации по трудоустройству, но недавно устроился и больше не хожу."},{"g":"-다가","ko":"영화를 보[[다가]] 재미없어서 나왔어요.","en":"I was watching a movie, but it was boring, so I left.","ru":"Я смотрел фильм, но он был скучным, и я ушёл."},{"g":"-다가","ko":"책을 읽[[다가]] 친구가 와서 밖에 나갔어요.","en":"I was reading a book when a friend came, so I went out.","ru":"Я читал книгу, но пришёл друг, и я вышел на улицу."},{"g":"-다가","ko":"컴퓨터 학원에 다니[[다가]] 어려워서 요리 수업으로 바꿨어요.","en":"I was attending a computer academy, but it was hard, so I switched to a cooking class.","ru":"Я ходил на компьютерные курсы, но было трудно, и я перешёл на кулинарные."},{"g":"-다가","ko":"공부하[[다가]] 모르는 단어가 있어서 사전을 찾았어요.","en":"While studying, I came across a word I didn't know, so I looked it up in the dictionary.","ru":"Во время учёбы мне попалось незнакомое слово, и я посмотрел его в словаре."},{"g":"-다가","ko":"이 길로 쭉 가[[다가]] 편의점 앞에서 왼쪽으로 가시면 돼요.","en":"Go straight along this road, then turn left at the convenience store.","ru":"Идите прямо по этой дороге, а у магазина у дома поверните налево."},{"g":"-다가","ko":"아이가 엄마를 찾으면서 울[[다가]] 잠이 들었어요.","en":"The child was crying for mom and then fell asleep.","ru":"Ребёнок плакал, звал маму и уснул."},{"g":"-다가","ko":"7년 전에 부산에서 살[[다가]] 대구로 이사했다.","en":"I lived in Busan and then moved to Daegu seven years ago.","ru":"Семь лет назад я жил в Пусане, а потом переехал в Тэгу."},{"g":"-다가","ko":"아침에 많이 오[[다가]] 지금은 그쳤어요.","en":"It rained a lot in
